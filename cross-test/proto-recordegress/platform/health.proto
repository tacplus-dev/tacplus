// Minimal ServiceHealth state root required by InjectHealthState. Every service
// build needs this so the generated service-manager can report instance health
// to the platform health-discovery path. Same shape as the c2s-only, health-only
// and requires-device fixtures carry, for the same reason.

syntax = "proto3";

package recordegresshealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["egressvault"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
