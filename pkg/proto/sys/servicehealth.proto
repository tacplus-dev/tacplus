syntax = "proto3";

package servicehealth;

import "sys/spec.proto";
import "sys/healthreport.proto";

// ServiceHealth is the fleet's service-instance health root, part of the sys
// contract every fleet provides: every service reports its instances here and
// the fleet's state host (routing label "kernel") holds it. It lives in tacplus
// so a service generates alone, without the host's proto; the host imports
// this file rather than declaring its own copy. Field numbers are frozen: they
// are the wire contract with every running service.
message ServiceHealth {
  option (spec.service_state) = {label: ["kernel"], export: true};

  // instances holds health data for each running service instance, keyed by
  // "service_id@instance_id" (composed by the host from token claims). Entries
  // TTL-expire if not refreshed, so a dead process disappears.
  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 256
  ];
}
