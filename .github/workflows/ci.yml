name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Every job but the secrets scan runs inside the tacplus build image
# (images/build.Dockerfile): the one image that carries every SDK and tool
# tacplus is built and tested with. Nothing is installed on the runner.

jobs:
  test:
    name: Unit tests and soundness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/tacplus-dev/tacplus/build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just protoc-check
      - run: just generate
      - run: just vet
      - run: just test

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL --retry 5 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - run: gitleaks git --no-banner --redact .

  example:
    name: Example (Go server, TypeScript client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/tacplus-dev/tacplus/build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just example

  cross-test-go:
    name: Go cross-test gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/tacplus-dev/tacplus/build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just current-generation-go
      - run: just determinism-go
      - run: just w2s-validate-go

  w2s-validate-java:
    name: Java W2S dispatch gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/tacplus-dev/tacplus/build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just w2s-validate-java
