// The record store hosting the trace-helpers fixture's record query plane
// (tacplus#327), a package of its own as in cross-test/proto-recordegress.

syntax = "proto3";

package helperstratum;

import "sys/spec.proto";

option (spec.service) = {name: "helperstratum"};
option (spec.record_store) = {};

message StratumPing {}

service HelperStratum {
  option (spec.service_s2s) = {};

  rpc Ping(StratumPing) returns (StratumPing) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
