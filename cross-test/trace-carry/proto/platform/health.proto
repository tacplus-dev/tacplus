// Minimal ServiceHealth state root required by InjectHealthState on this
// release line: the Note service_store gives tracecarry a state, and every
// service that has states needs this root so the generated service-manager
// can report instance health.

syntax = "proto3";

package tracecarryhealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["tracecarry"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
