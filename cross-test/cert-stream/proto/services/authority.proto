// Cert-stream fixture SMB authority. The behavioral harnesses supply the runtime
// implementation; this proto only declares the model shape needed by tacplus.
// The minting contract is the sys minter.Minter (routing label "kernel"), and
// instance health is the sys servicehealth.ServiceHealth; neither is declared
// here.

syntax = "proto3";

package authority;

import "sys/spec.proto";

message Ping { string m = 1; }

service AuthorityService {
  option (spec.service_s2s) = {label: "AuthorityService"};
  option (spec.smb_authority) = {};
  rpc Get(Ping) returns (Ping) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
