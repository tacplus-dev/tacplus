name: Images

# The image set from docs/VERSIONING.md: base (every SDK) and build (base +
# every tool and verifier; the image builds and the gates run in), pushed to
# ghcr.io for linux/amd64 and linux/arm64. There is no tacplus image any more
# (#193): tacplus is a release binary, and the build image's tacplus is
# images/tacplus.sh, which runs the release a repository pins (tacplus.lock).
# The old tacplus/tacplus tags stay, deprecated, and are never pushed again.
#
# build is rebuilt on every release tag, as build:X.Y.Z (immutable: a second
# push of it is refused) and the floating tags of scripts/images-tags.sh
# (X.Y, X, latest when it is the newest release each covers), with the line
# X.Y baked in (TACPLUS_LINE); on main when its file changed, on demand, or
# when base is rebuilt (weekly, or when its file changed). Releases are cut on
# several lines at once, so a run for an older line never moves base:latest or
# build:latest (#160). Each run writes the build image's digest to its summary:
# the digest is what a repository pins (`tacplus pin`).
#
# A run on a release/X.Y branch is a line rebuild (#283): base and build from
# that branch, pushed as base:X.Y and build:X.Y (and the dated tag) only, never
# latest, main, X or an X.Y.Z. The weekly schedule on main dispatches one for
# every supported line (job lines), so each line's images take the OS security
# fixes (apt-get upgrade) without waiting for a patch. A release tag's build
# starts from its line's base:X.Y when there is one.
#
# Every run upgrades the OS packages (#369): APT_REFRESH, unique to the run,
# keeps the registry cache from handing back an older run's apt-get upgrade
# layer, and scripts/images-check-index.sh fails the run unless each index it
# pushes holds linux/amd64 and linux/arm64, both created during the run.
#
# The images are built inside the build image (build:latest, as CI runs in),
# by tacplus-image-build: rootless BuildKit, no host Docker socket in the
# container (#315; tacplus-dev/roadmap: decisions/builds-in-containers-2026-11-03.md).
# Its cache is this workflow's configuration, TACPLUS_CACHE_REGISTRY: ghcr.io
# here, where GitHub can write. A builder that predates tacplus-image-build
# builds with buildx on the runner instead, once, to publish the first one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Lowest layer to rebuild (everything above it rebuilds too); a run on release/X.Y always rebuilds base and build, as that line's X.Y"
        type: choice
        options: [build, base]
        default: build

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NS: ghcr.io/${{ github.repository }}
  BUILDER: ghcr.io/${{ github.repository }}/build:latest
  TACPLUS_CACHE_REGISTRY: ghcr.io/${{ github.repository }}
  # Rootless BuildKit needs a user namespace in its container (images/image-build.sh).
  BUILDKIT_CONTAINER: --security-opt seccomp=unconfined --security-opt apparmor=unconfined

jobs:
  plan:
    name: Which layers
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
      line: ${{ steps.plan.outputs.line }}
      base_image: ${{ steps.plan.outputs.base_image }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: a release tag diffs against the previous release tag.
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          # Every image this run pushes must be created after this (#369,
          # scripts/images-check-index.sh).
          started="$(date -u +%s)"
          plan="$(scripts/images-plan.sh "$EVENT_NAME" "$GITHUB_REF_TYPE" "$REBUILD_INPUT" "$GITHUB_REF_NAME")"
          read -r base build <<<"$plan"
          # First publish: build everything when the build image does not exist yet.
          if ! docker manifest inspect "$NS/build:latest" >/dev/null 2>&1; then base=true; build=true; fi
          stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # The release line a tag's or a line rebuild's build image serves (its
          # tacplus refuses a repository pinned to another); none for main.
          line=""
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            line="${BASH_REMATCH[1]}"
          fi
          # The base a build starts from when this run does not rebuild base: its
          # line's base:X.Y (refreshed weekly by the line rebuild), else base:latest.
          base_image="$NS/base:latest"
          if [[ -n $line ]] && docker manifest inspect "$NS/base:$line" >/dev/null 2>&1; then base_image="$NS/base:$line"; fi
          { echo "base=$base"; echo "build=$build"; echo "stamp=$stamp"; echo "line=$line"; echo "base_image=$base_image"; echo "started=$started"; } >> "$GITHUB_OUTPUT"
          echo "base=$base build=$build line=$line base_image=$base_image"
        env:
          DOCKER_CONFIG: /tmp/docker-anon
          # Through the environment, never pasted into the script: the input
          # is whatever the dispatcher typed (#584).
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_INPUT: ${{ github.event.inputs.rebuild }}

  base:
    name: base
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          list="$NS/base:${{ needs.plan.outputs.stamp }}"
          # base takes latest where build does (main, the newest release) and its
          # line's X.Y where build does (a line rebuild, the newest patch of a line).
          for t in $(scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA"); do
            case "$t" in
              main|latest) list+=",$NS/base:latest" ;;
              "${{ needs.plan.outputs.line }}") list+=",$NS/base:$t" ;;
            esac
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Builder
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's AppArmor withholds capabilities in a user namespace an
          # unconfined process creates; RootlessKit needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          if docker pull -q "$BUILDER" && docker run --rm "$BUILDER" sh -c 'command -v tacplus-image-build' >/dev/null; then
            # BuildKit's state on the runner's large disk, not in the container's layer.
            sudo install -d -o 1000 -g 1000 /mnt/buildkit
            echo "rootless=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$BUILDER has no tacplus-image-build yet: building with buildx on the runner"
            echo "rootless=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (rootless BuildKit in the build image)
        if: steps.builder.outputs.rootless == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The commit's time for the image's timestamps (images/image-build.sh),
          # read here: inside the container the checkout is another user's, which
          # git refuses to read.
          # shellcheck disable=SC2086 # BUILDKIT_CONTAINER is a list of options
          docker run --rm $BUILDKIT_CONTAINER -e TACPLUS_CACHE_REGISTRY -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src:ro" -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" -v /mnt/buildkit:/home/build/.local/share/buildkit "$BUILDER" \
            tacplus-image-build -f /src/images/base.Dockerfile --platform linux/amd64,linux/arm64 --cache base \
            --build-arg "APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}" \
            --output 'type=image,"name=${{ steps.tags.outputs.list }}",push=true' /src
      - uses: docker/setup-buildx-action@v3
        if: steps.builder.outputs.rootless != 'true'
      - uses: docker/build-push-action@v6
        if: steps.builder.outputs.rootless != 'true'
        with:
          context: .
          file: images/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Unique to the run: every run upgrades the OS packages instead of
          # taking an older run's upgrade from the cache (#369).
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ env.NS }}/base:buildcache
          cache-to: type=registry,ref=${{ env.NS }}/base:buildcache,mode=max
      - name: Both platforms built by this run
        run: scripts/images-check-index.sh "$NS/base:${{ needs.plan.outputs.stamp }}" "${{ needs.plan.outputs.started }}"

  build:
    name: build (${{ matrix.arch }})
    needs: [plan, base]
    if: always() && needs.plan.outputs.build == 'true' && (needs.base.result == 'success' || needs.base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Builder
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's AppArmor withholds capabilities in a user namespace an
          # unconfined process creates; RootlessKit needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          if docker pull -q "$BUILDER" && docker run --rm "$BUILDER" sh -c 'command -v tacplus-image-build' >/dev/null; then
            # BuildKit's state on the runner's large disk, not in the container's layer.
            sudo install -d -o 1000 -g 1000 /mnt/buildkit
            echo "rootless=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$BUILDER has no tacplus-image-build yet: building with buildx on the runner"
            echo "rootless=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (rootless BuildKit in the build image)
        id: rootless
        if: steps.builder.outputs.rootless == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The build's log goes to stderr; its metadata (the digest) to stdout.
          # shellcheck disable=SC2086 # BUILDKIT_CONTAINER is a list of options
          metadata=$(docker run --rm $BUILDKIT_CONTAINER -e TACPLUS_CACHE_REGISTRY -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/src:ro" -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" -v /mnt/buildkit:/home/build/.local/share/buildkit "$BUILDER" \
            bash -c 'tacplus-image-build "$@" >&2 && cat /tmp/metadata.json' tacplus-image-build \
            -f /src/images/build.Dockerfile --platform "linux/${{ matrix.arch }}" --cache build \
            --build-arg "BASE_IMAGE=${{ needs.base.result == 'success' && format('{0}/base:{1}', env.NS, needs.plan.outputs.stamp) || needs.plan.outputs.base_image }}" \
            --build-arg "TACPLUS_LINE=${{ needs.plan.outputs.line }}" \
            --build-arg "APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "type=image,name=${{ env.NS }}/build,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json /src)
          digest=$(jq -r '."containerimage.digest"' <<<"$metadata")
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in $metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.builder.outputs.rootless != 'true'
      - id: buildx
        if: steps.builder.outputs.rootless != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.base.result == 'success' && format('{0}/base:{1}', env.NS, needs.plan.outputs.stamp) || needs.plan.outputs.base_image }}
            TACPLUS_LINE=${{ needs.plan.outputs.line }}
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=image,name=${{ env.NS }}/build,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }},mode=max
      - id: push
        name: Digest
        run: echo "digest=${{ steps.rootless.outputs.digest || steps.buildx.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (this architecture)
        if: matrix.arch == 'amd64'
        run: docker run --rm "$NS/build@${{ steps.push.outputs.digest }}" tacplus-smoke
      # A cache only speeds a build up (#315): compilers and an image built
      # cold and warm in the new image give one verdict and one set of digests.
      - name: Cache determinism (cold and warm identical)
        if: matrix.arch == 'amd64'
        timeout-minutes: 30
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          # shellcheck disable=SC2086 # BUILDKIT_CONTAINER is a list of options
          docker run --rm $BUILDKIT_CONTAINER -v "$PWD:/src:ro" "$NS/build@${{ steps.push.outputs.digest }}" bash /src/images/cache-determinism.sh
      # Generate, test, verify (Kani; Go reported as skipped) and fuzz a pinned
      # repository through the image's tacplus launcher, with a tacplus built
      # from this commit as a local release of the image's line.
      - name: Pipeline smoke (generate, test, verify, fuzz)
        if: matrix.arch == 'amd64'
        timeout-minutes: 90
        run: docker run --rm -v "$PWD:/src:ro" "$NS/build@${{ steps.push.outputs.digest }}" bash /src/images/smoke-pipeline.sh
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  build-manifest:
    name: build (manifest)
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: build-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=(); for d in *; do refs+=("$NS/build@sha256:$d"); done
          tags=(-t "$NS/build:${{ needs.plan.outputs.stamp }}")
          # Fetched here, not in plan: parallel tags on one line (v2.3.1 and
          # v2.3.2) must see each other before either moves a floating tag.
          git -C "$GITHUB_WORKSPACE" fetch --force --tags origin
          list="$(cd "$GITHUB_WORKSPACE" && scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # build:X.Y.Z is what a pin was resolved from: never moved once pushed.
            v="${GITHUB_REF_NAME#v}"
            if docker buildx imagetools inspect "$NS/build:$v" >/dev/null 2>&1; then
              echo "::error::$NS/build:$v already exists; a release's build image is immutable"
              exit 1
            fi
            for t in $list; do tags+=(-t "$NS/build:$t"); done
          else
            # main moves latest; a line rebuild moves its X.Y and nothing else.
            for t in $list; do
              case "$t" in
                main) tags+=(-t "$NS/build:latest") ;;
                main-*) ;;
                *) tags+=(-t "$NS/build:$t") ;;
              esac
            done
          fi
          # The dated tag first, and the release and floating tags only once
          # its index holds both platforms, each built by this run (#369):
          # v2.6.2 published v2.6.1's arm64 image, which the cache handed back.
          docker buildx imagetools create -t "$NS/build:${{ needs.plan.outputs.stamp }}" "${refs[@]}"
          "$GITHUB_WORKSPACE/scripts/images-check-index.sh" "$NS/build:${{ needs.plan.outputs.stamp }}" "${{ needs.plan.outputs.started }}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$NS/build:${{ needs.plan.outputs.stamp }}"
      - name: Digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$NS/build:${{ needs.plan.outputs.stamp }}" --format '{{json .Manifest}}' | jq -r .digest)"
          ref="$NS/build:${{ needs.plan.outputs.stamp }}@$digest"
          [[ "$GITHUB_REF_TYPE" == tag ]] && ref="$NS/build:${GITHUB_REF_NAME#v}@$digest"
          echo "build image: $ref"
          echo "Build image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  # The weekly line rebuild (#283): dispatch this workflow on every supported
  # release/X.Y (a minor released within the last twelve months,
  # docs/VERSIONING.md), each building from its own branch. A branch whose own
  # scripts/images-tags.sh does not yet map release/X.Y to X.Y alone (its
  # backport of #283 not merged) is skipped: its images.yml would push the
  # line's image as build:latest.
  lines:
    name: Rebuild each release line
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch a line rebuild per supported line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          cutoff=$(( $(date -u +%s) - 365*24*3600 ))
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release/*'); do
            line="${ref#release/}"
            [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || continue
            first="$(git tag -l "v$line.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k3,3n | head -1 || true)"
            if [[ -n $first ]] && (( $(git log -1 --format=%ct "$first") < cutoff )); then
              echo "$ref: out of support (first release $first), skipped"; continue
            fi
            got="$(bash <(git show "origin/$ref:scripts/images-tags.sh") branch "$ref" "$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$got" != "$line" ]]; then
              echo "::warning::$ref has no line rebuild yet (its images-tags.sh gives '$got'); skipped"; continue
            fi
            gh workflow run images.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
            echo "$ref: line rebuild dispatched"
          done
