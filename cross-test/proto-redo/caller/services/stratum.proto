// The redo-contract fixture's CALLER (issue #163 D5): a per-tenant record
// store that calls the sys redo contract, redolog.Redo, through its generated
// client. Generated from this proto alone, plus sys/: the redo host's proto is
// not in the run. redo is a /system service (#258), so the contract's rpcs are
// not tenant-routed: a tenant's store calls /system, never another tenant.

syntax = "proto3";

package stratum;

import "sys/spec.proto";

option (spec.service) = {name: "stratum", tenant_owned: true};
option (spec.grpc_s2s_client) = {service: "redolog.Redo"};

service StratumPeer {
  option (spec.service_s2s) = {label: "StratumPeer"};

  // GetStoreStatus reports the target tenant's store status.
  rpc GetStoreStatus(GetStoreStatusRequest) returns (GetStoreStatusResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"], route_field: "tenant"};
  }
}

message GetStoreStatusRequest {
  // tenant is the target tenant's tid.
  string tenant = 1 [(spec.assert_max_size) = 8];
}

message GetStoreStatusResponse {
  bool replayed = 1;
}
