// Minimal ServiceHealth state root required by InjectHealthState.
// Every service that has states needs this so the generated service-manager
// can report instance health to the platform health-discovery path.
//
// It is also what makes the generated state WRAPPER reachable in this fixture:
// state.go calls service_im.NoteIfCredentialRejection / NoteCredentialAccepted
// unconditionally, and those live in the chassis package whose no-exchanger
// variant is under test here (NEW-47).

syntax = "proto3";

package c2sonlyhealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["c2sonly"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
