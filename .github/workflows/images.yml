name: Images

# The three-layer image set from docs/VERSIONING.md: base (runtimes), build
# (base + every build tool), tacplus (build + the binary). Each layer is
# rebuilt only when its definition changed, on demand, or (base) weekly, and
# pushed to ghcr.io for linux/amd64 and linux/arm64. The tacplus image is
# rebuilt on every push to main (main-<sha>) and every release tag
# (X.Y.Z, X.Y, X, latest).

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Lowest layer to rebuild (everything above it rebuilds too)"
        type: choice
        options: [tacplus, build, base]
        default: tacplus

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NS: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: Which layers
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          base=false; build=false
          case "${{ github.event_name }}" in
            schedule) base=true ;;
            workflow_dispatch)
              [[ "${{ github.event.inputs.rebuild }}" == base ]] && base=true
              [[ "${{ github.event.inputs.rebuild }}" != tacplus ]] && build=true ;;
            push)
              changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
              grep -q '^images/base.Dockerfile$' <<<"$changed" && base=true
              grep -q '^images/build.Dockerfile$' <<<"$changed" && build=true ;;
          esac
          [[ $base == true ]] && build=true
          # First publish: build everything when the build image does not exist yet.
          if ! docker manifest inspect "$NS/build:latest" >/dev/null 2>&1; then base=true; build=true; fi
          { echo "base=$base"; echo "build=$build"; echo "stamp=$(date -u +%Y%m%d)-${GITHUB_SHA::7}"; } >> "$GITHUB_OUTPUT"
          echo "base=$base build=$build"
        env:
          DOCKER_CONFIG: /tmp/docker-anon

  base:
    name: base
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.NS }}/base:${{ needs.plan.outputs.stamp }}
            ${{ env.NS }}/base:latest
          cache-from: type=registry,ref=${{ env.NS }}/base:buildcache
          cache-to: type=registry,ref=${{ env.NS }}/base:buildcache,mode=max

  build:
    name: build (${{ matrix.arch }})
    needs: [plan, base]
    if: always() && needs.plan.outputs.build == 'true' && (needs.base.result == 'success' || needs.base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ env.NS }}/base:latest
          outputs: type=image,name=${{ env.NS }}/build,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }},mode=max
      - name: Record digest
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  build-manifest:
    name: build (manifest)
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: build-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=(); for d in *; do refs+=("$NS/build@sha256:$d"); done
          docker buildx imagetools create \
            -t "$NS/build:${{ needs.plan.outputs.stamp }}" -t "$NS/build:latest" "${refs[@]}"
          docker buildx imagetools inspect "$NS/build:latest"

  tacplus:
    name: tacplus (${{ matrix.arch }})
    needs: [plan, base, build, build-manifest]
    if: always() && needs.plan.result == 'success' && (needs.base.result == 'success' || needs.base.result == 'skipped') && (needs.build-manifest.result == 'success' || needs.build-manifest.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" == v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/tacplus.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_IMAGE=${{ env.NS }}/build:latest
            VERSION=${{ steps.v.outputs.version }}
            VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.NS }}/tacplus,push-by-digest=true,name-canonical=true,push=true
      - name: Smoke test (this architecture)
        if: matrix.arch == 'amd64'
        run: docker run --rm "$NS/tacplus@${{ steps.push.outputs.digest }}" tacplus-smoke
      - name: Record digest
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tacplus-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  tacplus-manifest:
    name: tacplus (manifest, tags)
    needs: [plan, tacplus]
    if: always() && needs.tacplus.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: tacplus-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags from the version policy
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" == v* ]]; then
            v="${GITHUB_REF_NAME#v}"; IFS=. read -r MA MI _ <<<"$v"
            tags="-t $NS/tacplus:$v -t $NS/tacplus:$MA.$MI -t $NS/tacplus:$MA -t $NS/tacplus:latest"
          else
            tags="-t $NS/tacplus:main-${GITHUB_SHA::7} -t $NS/tacplus:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"; echo "$tags"
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=(); for d in *; do refs+=("$NS/tacplus@sha256:$d"); done
          # shellcheck disable=SC2086
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} "${refs[@]}"
          docker buildx imagetools inspect "$NS/tacplus:main" 2>/dev/null || true
      - name: Prune old main-<sha> images
        uses: actions/delete-package-versions@v5
        with:
          package-name: tacplus/tacplus
          package-type: container
          min-versions-to-keep: 20
          ignore-versions: '^(latest|main|\d+(\.\d+){0,2})$'
