// The (spec.trait) that asks for the record query plane, hosted by ksstratum.

syntax = "proto3";

package ksquery;

import "sys/spec.proto";

option (spec.trait) = {
  name: "ksquery"
  host: "ksstratum"
  s2s_service: "KsRecordMap"
  c2s_service: "KsRecordQuery"
  auth_services: ["kssvc"]
};
