// Minimal ServiceHealth state root used by SMB generation fixtures. The member
// service owns ordinary state, which triggers health-state injection; this root
// is then discovered and injected as the generated ServiceHealthState surface.

syntax = "proto3";

package smbhealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["mysmb"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
