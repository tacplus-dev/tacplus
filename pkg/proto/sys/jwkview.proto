// ============================================================================
// This file defines the cross-boundary JWK verifying keys view service.
// grpcserver subscribes to this service for token signature verification.
// the cluster automatically implements this service by aggregating all
// collections annotated with (spec.view_member) = "JwkVerifyingKeysView".
// ============================================================================

syntax = "proto3";

package jwkview;

import "sys/jwk.proto";
import "sys/spec.proto";
import "sys/trace.proto";

// JwkVerifyingKeysViewService provides a read-only aggregated view of all
// JWK verifying keys across all state services that registered via
// (spec.view_member) = "JwkVerifyingKeysView".
//
// This service is automatically implemented by the cluster.
// grpcserver subscribes to it for token signature verification.
service JwkVerifyingKeysViewService {
  rpc Watch(trace.TraceRequest) returns (stream JwkViewResponse);
  rpc Get(JwkViewGetRequest) returns (JwkViewGetResponse);
}

message JwkViewResponse {
  map<string, jwk.Jwk> entries = 1 [(spec.assert_max_size) = 256];  // kid -> Jwk
}

message JwkViewGetRequest {
  string kid = 1;
}

message JwkViewGetResponse {
  jwk.Jwk value = 1;
  bool found = 2;
}
