// Package accounting defines the typed event system that replaces unstructured
// text logging. Every event is a proto message with a known schema. Events flow
// through EventBus to consumers (short-term store, long-term accounting, LLM
// troubleshooting, alerting, suppression).
//
// Accounting never carries data (tacplus#273): who called what, the outcome,
// the gRPC status, a typed reason and typed metrics, never a request or
// response value, an error text or a stack trace. Every string or bytes field
// reachable from Event (and from a declared accountingrecord.AccountingRecord)
// is an identifier or an enum-like code, and says so with
// (spec.accounting_safe); generation fails on one that does not. Stack traces
// and error texts go to the debug console only.
//
// Event levels:
//   ERROR — our bugs/failures, not user errors
//   WARN  — user-caused issues (expired token, bad input)
//   INFO  — state changes, completed actions (the accounting backbone)
//   DEBUG — fine-grained detail (dev binary only, console only, never stored)
//
// Prod binaries emit INFO+ to EventBus. Debug code paths are compiled out.
// Dev binaries also emit DEBUG to stderr (never EventBus).
//
// AccountingMethod is the only generated type (generated/accounting_method.proto,
// package accounting_method) because it has one field per discovered service.
// Everything else is static.

syntax = "proto3";

package accounting;

import "generated/accounting_method.proto";
import "sys/spec.proto";

// =============================================================================
// Event Level
// =============================================================================

// EventLevel classifies events for emission control and retention policy.
// The level is inherent to the event type, not chosen at emit-time.
enum EventLevel {
  EVENT_LEVEL_UNDEFINED = 0;
  EVENT_LEVEL_DEBUG = 1;   // Dev binary only, console only, never stored
  EVENT_LEVEL_INFO = 2;    // Accounting backbone — completed actions, state changes
  EVENT_LEVEL_WARN = 3;    // User-caused issues — not our bug, but noteworthy
  EVENT_LEVEL_ERROR = 4;   // Our failures — something is broken
}

// =============================================================================
// Event Envelope
// =============================================================================

// Event is the top-level envelope for all typed events. It carries common
// context (source, identity, request tracing) and a typed payload.
//
// This is what gets published to EventBus, spooled for guaranteed delivery,
// and indexed by consumers.
message Event {
  // timestamp_ms is the event timestamp in milliseconds since epoch (UTC).
  int64 timestamp_ms = 1;

  // source_id identifies the emitting process.
  // Format: "{service_id}-{instance_id}" for services (e.g., "identity-a1b2c3")
  // or "{tool}-{user}" for clients (e.g., "mycli-alice").
  string source_id = 2 [(spec.accounting_safe) = true];

  // request_id is the x-request-id that traces a request across gateway,
  // backend services, and client tools. Set by gateway, forwarded as gRPC
  // metadata, extracted by generated wrappers.
  string request_id = 3 [(spec.accounting_safe) = true];

  // identity is the caller's identity — the claims from the verified token.
  // Enables identity-scoped event access — users query only their own events.
  // Keys are claim names (sub, aud, iss, azp, act), values are claim values:
  // identifiers, never request data.
  map<string, string> identity = 4 [(spec.accounting_safe) = true];

  // level is the event level, derived from the event type.
  // Included on the envelope for filtering without inspecting the payload.
  EventLevel level = 5;

  // event is the typed payload.
  oneof event {
    // RPC lifecycle: one RpcCompleted per call, whatever its outcome.
    RpcCompleted rpc_completed = 10;
    SessionSummary session_summary = 13;
    // Auth
    TokenExchanged token_exchanged = 20;
    // Infrastructure
    EndpointHealthChanged endpoint_health_changed = 30;
    StateUpdated state_updated = 31;
  }

  // Removed by tacplus#273: RpcError and TokenRejected (an RPC's outcome is
  // RpcCompleted.outcome), and the free-text CommandExecuted, ToolUsed,
  // SubagentStarted, FileModified and Diagnostic (accounting carries no data).
  reserved 11, 12, 40, 50, 51, 52, 100;
  reserved "rpc_error", "token_rejected", "command_executed", "tool_used",
    "subagent_started", "file_modified", "diagnostic";
}

// =============================================================================
// RPC Lifecycle — emitted automatically by generated wrappers
// =============================================================================

// RpcOutcome is what became of a call. It is derived from the call's gRPC
// status code alone, the same in every language:
//   OK                                              -> PERMITTED
//   UNAUTHENTICATED                                 -> DENIED_AUTHN
//   PERMISSION_DENIED                               -> DENIED_AUTHZ
//   INVALID_ARGUMENT, NOT_FOUND, ALREADY_EXISTS,
//   FAILED_PRECONDITION, OUT_OF_RANGE               -> INVALID
//   any other code                                  -> FAILED
enum RpcOutcome {
  RPC_OUTCOME_UNDEFINED = 0;
  // The call was authorized and served.
  RPC_OUTCOME_PERMITTED = 1;
  // The caller could not be authenticated.
  RPC_OUTCOME_DENIED_AUTHN = 2;
  // The caller was authenticated and refused.
  RPC_OUTCOME_DENIED_AUTHZ = 3;
  // The request could not be served as asked (the caller's input).
  RPC_OUTCOME_INVALID = 4;
  // The call failed on our side.
  RPC_OUTCOME_FAILED = 5;
}

// RpcReason is the typed reason of an outcome other than PERMITTED: where in
// the generated call path the call stopped. It replaces the free-text error
// message (tacplus#273). UNDEFINED on a permitted call.
enum RpcReason {
  RPC_REASON_UNDEFINED = 0;
  // Authentication failed: no token, or a token that did not verify.
  RPC_REASON_TOKEN_REJECTED = 1;
  // The method's declared auth check refused the authenticated caller.
  RPC_REASON_NOT_ENTITLED = 2;
  // A declared guard refused the call (namespace, owner, tenant, device,
  // egress policy).
  RPC_REASON_POLICY_DENIED = 3;
  // The request failed validation.
  RPC_REASON_REQUEST_INVALID = 4;
  // The handler returned the error.
  RPC_REASON_HANDLER_ERROR = 5;
  // The handler's response failed validation.
  RPC_REASON_RESPONSE_INVALID = 6;
  // The generated call path failed before the handler.
  RPC_REASON_INTERNAL = 7;
}

// RpcMetrics are the typed numbers a handler may attach to its call's record.
// Numbers only, so they cannot carry data. Zero means not reported.
message RpcMetrics {
  // records_returned is how many records the call returned (a query's rows).
  int64 records_returned = 1;

  // bytes is how many payload bytes the call moved, as the handler counts them.
  int64 bytes = 2;
}

// RpcCompleted is the RPC record: one per call, whatever its outcome. [INFO for
// PERMITTED, WARN for DENIED_* and INVALID, ERROR for FAILED]
// This is the primary accounting event. A call refused before its handler
// (authentication, authorization, validation, a declared guard) is recorded
// too, with its outcome and reason.
message RpcCompleted {
  // method is the RPC that was invoked (generated per-service type).
  accounting_method.AccountingMethod method = 1;

  // duration_ms is the server-side processing time in milliseconds.
  int64 duration_ms = 2;

  // outcome is what became of the call (see RpcOutcome).
  RpcOutcome outcome = 3;

  // code is the call's gRPC status code (numeric), 0 when it succeeded.
  int32 code = 4;

  // reason is the typed reason of an outcome other than PERMITTED.
  RpcReason reason = 5;

  // metrics are the typed numbers the handler attached, if any.
  RpcMetrics metrics = 6;
}

// =============================================================================
// Aggregation
// =============================================================================

// RpcSummary is an aggregated view of RPC usage for a single method.
// Used by SessionSummary to compress N events into one record.
message RpcSummary {
  accounting_method.AccountingMethod method = 1;
  int32 count = 2;
  int64 total_duration_ms = 3;
  int32 error_count = 4;
}

// SessionSummary compresses all RPC events sharing the same token
// into a single record. The aggregation window is bounded by the
// token's expiration time, so it has a known finite period.
message SessionSummary {
  map<string, string> identity = 1 [(spec.accounting_safe) = true];
  int64 start_ms = 2;
  int64 end_ms = 3;
  repeated RpcSummary rpcs = 4;
  int32 total_requests = 5;
  int32 total_errors = 6;
}

// =============================================================================
// Auth Events
// =============================================================================

// TokenExchanged records a successful token mint or exchange. [INFO]
// Accounting event — tracks token issuance for usage/billing.
message TokenExchanged {
  // audience is the target audience of the minted token.
  string audience = 1 [(spec.accounting_safe) = true];

  // grant_type is the OAuth grant type used (e.g., "urn:ietf:params:oauth:grant-type:token-exchange").
  string grant_type = 2 [(spec.accounting_safe) = true];

  // token_type distinguishes JWT vs X509 mints.
  string token_type = 3 [(spec.accounting_safe) = true];
}

// =============================================================================
// Infrastructure Events
// =============================================================================

// EndpointHealthChanged records a change in endpoint health status. [WARN]
// Emitted by ServiceManager when an endpoint transitions healthy↔unhealthy.
message EndpointHealthChanged {
  // endpoint is the "host:port" of the affected endpoint.
  string endpoint = 1 [(spec.accounting_safe) = true];

  // healthy is the new health status.
  bool healthy = 2;

  // latency_ms is the last measured latency (0 if unhealthy).
  int64 latency_ms = 3;
}

// StateUpdated records a state change in the system. [INFO]
// Emitted when entities are created, updated, or deleted via state services.
// Provides a coarse audit trail — "what changed" without the full payload.
message StateUpdated {
  // entity_type is the proto message type that changed (e.g., "DetectionRule", "Topic").
  string entity_type = 1 [(spec.accounting_safe) = true];

  // entity_id is the identifier of the changed entity.
  string entity_id = 2 [(spec.accounting_safe) = true];

  // action is what happened.
  StateAction action = 3;
}

// StateAction describes what happened to a state entity.
enum StateAction {
  STATE_ACTION_UNDEFINED = 0;
  STATE_ACTION_CREATED = 1;
  STATE_ACTION_UPDATED = 2;
  STATE_ACTION_DELETED = 3;
}

// =============================================================================
// Spool Configuration
// =============================================================================

// SpoolConfig configures the local spool for guaranteed delivery of INFO+
// events to EventBus.
message SpoolConfig {
  int32 flush_interval_ms = 1;
  int32 batch_size = 2;
  string spool_path = 3;
  int64 spool_max_bytes = 4;
}
