// Stand-in record store: (spec.record_store) makes it the host of the record
// query plane vservices/ksquery.proto asks for, which a record's residency
// needs to be read at all.

syntax = "proto3";

package ksstratum;

import "sys/spec.proto";

option (spec.service) = {name: "ksstratum"};
option (spec.record_store) = {};

message StratumPing {}

service KsStratum {
  option (spec.service_s2s) = {};

  rpc Ping(StratumPing) returns (StratumPing) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
