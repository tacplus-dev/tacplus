// W2S request-validation fixture backend: a C2S service whose request message
// carries an assert_* constraint, so the generated Rust REST dispatch has a
// request to validate before forwarding.

syntax = "proto3";

package catalog;

import "sys/spec.proto";

option (spec.string_const) = {name: "REST_ROOT_PATH", value: "/api/v1"};

message GetItemRequest {
  // owner must be a well-formed email address. A REST request carrying
  // anything else must be rejected by the dispatcher before it reaches the
  // backend gRPC service.
  string owner = 1 [
    (spec.assert_required) = true,
    (spec.assert_email) = true
  ];
}

message GetItemResponse {
  string owner = 1;
}

service CatalogService {
  option (spec.service_c2s) = {auth_entitled_users: true};

  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ANY_USER]};
  }

  // Server-streaming twin of GetItem, so the fixture also covers the SSE
  // dispatch_stream() leg of the same request-validation seam.
  rpc WatchItems(GetItemRequest) returns (stream GetItemResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ANY_USER]};
    option (spec.method_collection) = {mode: COLLECTION_MODE_WATCH, order_by: ["owner"]};
  }
}
