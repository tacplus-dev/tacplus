// State-queue cross-test fixture (#456): a state root with a FIFO queue and a
// priority queue boundary. The state service backs both with the
// OfferTo*/ConsumeFrom*/Peek*/Size* RPCs (pkg/internal/proto/state.go). The
// Java StateClient took both for singletons and called getTasks/watchTasks,
// which do not exist, so the generated model did not compile. Generated and
// compiled in Go, Java and Rust by cross-test/current-generation.

syntax = "proto3";

package helper;

import "sys/spec.proto";

// No gRPC service, so the fixture declares its own backing-store identity:
// without it no service serves the routing label its state names.
option (spec.service) = {name: "helper", store: true};

message Task {
  string task_id = 1;
}

message Alert {
  string alert_id = 1;
  int32  severity = 2;
}

message HelperState {
  option (spec.service_state) = {label: ["helper"]};

  Task  tasks  = 5 [(spec.queue) = true];
  Alert alerts = 6 [(spec.priority_queue) = "severity"];
}
