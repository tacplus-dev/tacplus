// The approval-broker half of the (spec.rpc).requires_device fixture.
//
// This package is the authoritative (spec.token_minter), so DiscoverApprovalBroker
// finds BrokerPendingApproval here BY SIGNATURE (BrokerPendingApprovalRequest →
// BrokerPendingApprovalResponse), not by name. It is a DIFFERENT package from the
// guarded rpc's on purpose: all three backends refuse to generate when the minter's
// own package declares a requires_device rpc, because a package gets no generated
// client to itself.
//
// The message shapes are the wire contract the generated approval check builds:
// service_manager templates set approval_id / rpc_method / request_hash /
// caller_namespace / caller_subject / device_assertion by name in all three
// languages, so this file is what makes those templates compile.

syntax = "proto3";

package devicemint;

import "sys/spec.proto";
import "sys/tokenrequest.proto";
import "sys/x509.proto";

// DeviceMint is the cluster's authoritative S2S token minter and therefore the
// host of the approval broker.
service DeviceMint {
  option (spec.service_s2s) = {label: "DeviceMint"};
  option (spec.token_minter) = {};

  // Self-mint, the ordinary minter surface. Present because the generated
  // bootstrap exchanger targets the authoritative minter's mint RPC.
  rpc MintServiceToken(tokenrequest.MintServiceTokenRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES]};
  }

  // Token exchange, required of the CLIENT-side minter surface.
  rpc MintToken(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES]};
  }

  // Cert mint, the other surface the generated servicemanager requires of the
  // authoritative minter (it is also the cluster's cert authority).
  rpc MintX509Cert(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES]};
  }

  // BrokerPendingApproval consumes a pending approval with the device assertion
  // the person signed it with. The generated requires_device gate calls this and
  // refuses the guarded rpc on any error.
  rpc BrokerPendingApproval(BrokerPendingApprovalRequest) returns (BrokerPendingApprovalResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}

// WebauthnAssertion is the device proof the person produced. The generated check
// decodes the x-tacplus-device-assertion-bin metadata value into this type.
message WebauthnAssertion {
  // credential_id names the device credential that signed.
  string credential_id = 1 [(spec.assert_required) = true];

  // authenticator_data is the raw WebAuthn authenticator data.
  bytes authenticator_data = 2 [(spec.assert_required) = true];

  // client_data_json is the raw WebAuthn client data.
  bytes client_data_json = 3 [(spec.assert_required) = true];

  // signature is the assertion signature over the two blobs above.
  bytes signature = 4 [(spec.assert_required) = true];
}

// BrokerPendingApprovalRequest is built field-for-field by the generated approval
// check in every language. rpc_method and request_hash are the LIVE values the
// gate computed from the request in front of it.
message BrokerPendingApprovalRequest {
  // approval_id is the pending approval the caller presented, read from the
  // x-tacplus-approval-id metadata key.
  string approval_id = 1 [(spec.assert_required) = true];

  // rpc_method is the wire-qualified method key, "pkg.Service/Method".
  string rpc_method = 2 [(spec.assert_required) = true];

  // request_hash is the SHA-256 of the canonicalized request, 32 bytes.
  bytes request_hash = 3 [(spec.assert_required) = true];

  // caller_namespace is the verified caller's namespace claim.
  string caller_namespace = 4;

  // caller_subject is the verified caller's subject.
  string caller_subject = 5;

  // device_assertion is the decoded device proof.
  WebauthnAssertion device_assertion = 6;
}

// BrokerPendingApprovalResponse is ignored by the generated check, which treats
// any non-error reply as approval.
message BrokerPendingApprovalResponse {
  // person_id is the person whose device consumed the approval.
  string person_id = 1;

  // consumed_at is the epoch-seconds the approval was consumed.
  int64 consumed_at = 2;
}
