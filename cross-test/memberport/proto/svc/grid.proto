// Member-port fixture (tacplus#212): a service whose members exchange
// black-box traffic, so it declares (spec.member_port) and the auto_tls
// serving certificate the member port serves with.

syntax = "proto3";

package grid;

import "sys/spec.proto";

message Ping { string m = 1; }

message GridState {
  option (spec.service_state) = {
    name: "GridState",
    label: ["grid"],
    auto_tls: TLS_KEY_TYPE_ED25519,
    export: true
  };
  string marker = 1;
}

service GridService {
  option (spec.service_s2s) = {label: "grid"};
  option (spec.member_port) = {};
  rpc Get(Ping) returns (Ping) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
