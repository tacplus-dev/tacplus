//
// Every C2S client resolves service instances through their health state, so a
// proto set that generates C2S clients declares one. This is the minimal one.

syntax = "proto3";

package noteshealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["notesapi"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
