syntax = "proto3";

package tokenrequest;

import "sys/cloudidentity.proto";
import "sys/key.proto";
import "sys/spec.proto";
import "sys/token.proto";
import "sys/x509.proto";
import "generated/entitlements.proto";
import "google/protobuf/struct.proto";

option java_outer_classname = "Tokenrequest";

// TokenMintRequest is a compatibility request shape for token mint services.
message TokenMintRequest {
  string input_token = 1;
  cloudidentity.CloudIdentityProof cloud_proof = 2;
  string continuity_token = 3;
  string aud = 4;
  int64 exp = 5;
  token.TokenPurpose token_purpose = 6;
  string subject = 7;
  google.protobuf.Struct claims = 8;
  bool offline_access = 9;
  string locality_token = 10;
  string project = 11;
  repeated string service_auds = 12 [(spec.assert_max_size) = 1024];
  // Which tenant namespace to mint a personal-principal token for. Only meaningful when the
  // caller's identity is a personal principal (see sys/kernel.proto PersonalPrincipal) with a
  // live TenantMembership in that namespace; refused (INVALID_ARGUMENT) on a service/workload
  // token. Selects among a personal principal's N per-tenant memberships at mint time.
  string tenant_namespace = 13;
  string trace_id = 200;
  bool noop = 201;
}

// MintServiceTokenRequest is the input for service-token minting.
//
// Credential proof: exactly one of input_token, cloud_proof, kubernetes_token,
// or external_oidc_token authenticates the caller. The kernel groups these into a
// oneof (credential_proof) and routes on the discriminator; clients may set a
// single flat field — proto3 oneof membership is a property of the parsing
// descriptor, so a flat field at the same tag/wire type is decoded into the
// matching oneof case and remains wire-compatible.
message MintServiceTokenRequest {
  string input_token = 1;
  cloudidentity.CloudIdentityProof cloud_proof = 2;
  string continuity_token = 3;
  string aud = 4;
  int64 exp = 5;
  token.TokenPurpose token_purpose = 6;
  string locality_token = 7;
  // kubernetes_token is a projected Kubernetes service-account JWT carrying the
  // configured kernel workload audience ("kernel"; it must NOT
  // be the "kmaker" audience). The kernel maps the verified
  // (namespace, service account) to a Delegate. Tag 8 matches the kernel's
  // credential_proof oneof so a flat field here is wire-compatible.
  string kubernetes_token = 8;
  // external_oidc_token is an OIDC ID token minted natively by tenant-owned CI
  // (e.g. a GitHub Actions OIDC token or a GitLab CI ID token), presented so
  // that CI may act as a tenant-scoped service. The kernel verifies the token
  // against the tenant's enrolled-issuer list (KernelTenantConfig) and maps the
  // verified issuer plus claims to an enrolled config via a Delegate matcher.
  // Tag 9 matches the kernel's credential_proof oneof so a flat field here is
  // wire-compatible.
  string external_oidc_token = 9;
  string trace_id = 200;
  bool noop = 201;
}

// AuthBrokerKind classifies what a broker attests when it calls MintUserToken.
// The kind is not decoration: it selects which proof kernel verifies and which
// namespace the resulting token may carry.
enum AuthBrokerKind {
  AUTH_BROKER_KIND_UNSPECIFIED = 0;
  // An IdP assertion the broker has already validated (oauth). Kernel
  // trusts the broker's attestation — today's behaviour, unchanged.
  AUTH_BROKER_KIND_IDP = 1;
  // Possession of a personal principal's device key. Kernel verifies the
  // proof itself; may mint only a /people/<pid> personal token.
  AUTH_BROKER_KIND_DEVICE = 2;
  // Control of an email address a tenant authorized.
  AUTH_BROKER_KIND_EMAIL_LINK = 3;
  // An admin-issued link accepted on the member's own device.
  AUTH_BROKER_KIND_PERSONAL_LINK = 4;
}

// MintUserTokenRequest is the input for user-token minting.
message MintUserTokenRequest {
  string subject = 1;
  google.protobuf.Struct claims = 2;
  int64 exp = 3;
  bool offline_access = 4;
  // broker_kind is the class of proof this call presents. Kernel refuses if
  // the resolved Delegate's auth_broker_kinds does not contain it.
  AuthBrokerKind broker_kind = 5;
  // proof_token is the principal-held proof (a device- or link-signed JWT)
  // that kernel verifies ITSELF. Required for every kind except IDP.
  string proof_token = 6;
  string trace_id = 200;
  bool noop = 201;
}

// MintClientTokenRequest is the input for external-client token minting.
message MintClientTokenRequest {
  string input_token = 1;
  int64 exp = 2;
  token.TokenPurpose token_purpose = 3;
  string trace_id = 200;
  bool noop = 201;
}

// TokenMintResponse is the generic token mint response shape.
message TokenMintResponse {
  token.Token access_token = 1;
  token.Token refresh_token = 2;
  repeated token.Token service_tokens = 3 [(spec.assert_max_size) = 1024];
  string trace_id = 200;
  bool noop = 201;
}

// X509MintRequest is the input for certificate minting.
message X509MintRequest {
  string aud = 1;
  x509.X509CertRequest cert_request = 2;
  string input_token = 3;
  string trace_id = 200;
  bool noop = 201;
}

// ExternalTokenMintRequest is the input for proxy-mediated token minting.
message ExternalTokenMintRequest {
  string user_token = 1;
  string metadata = 2;
  // requested_signing_key_type selects the kernel signing key family for the
  // external JWT. Empty/undefined preserves the default internal family:
  // OKP / Ed25519 / EdDSA. Use EC for vendors that require P-256 / ES256.
  key.KeyType requested_signing_key_type = 3;
  string trace_id = 200;
  bool noop = 201;
}

// ExternalTokenMintResponse is the response for MintExternalToken (proxy egress).
message ExternalTokenMintResponse {
  // token is the minted external JWT. Populated when auth_type = TOKEN_TYPE_JWT.
  token.Token token = 1;
  // dst_url is the destination URL to forward to (empty = provider default).
  string dst_url = 2 [(spec.assert_max_size) = 2048];
  // auth_type indicates the credential format.
  token.TokenType auth_type = 3;
  reserved 4; // was saml_assertion — SAML removed from the product (D29 amendment 2)
  reserved "saml_assertion";
}

// MintDelegatedTokenRequest is the input for standing-delegation (Grant) token
// minting. The delegate's own identity is verified from its S2S bearer token
// (Authorization header), not carried in the request — only the Grant id it
// holds and asserts is.
message MintDelegatedTokenRequest {
  // grant_id is the opaque Grant.id the caller (a delegate) holds and asserts.
  string grant_id = 1 [(spec.assert_required) = true];
  string trace_id = 200;
  bool noop = 201;
}

// MintDelegatedTokenResponse is the response for MintDelegatedToken.
message MintDelegatedTokenResponse {
  // token is the minted short-lived access token. No refresh/offline
  // companion — re-mint per use from the same grant_id.
  token.Token token = 1;
}

// MintDelegateOfflineTokenRequest is the input for runtime delegation (C2S).
// The user's own identity is the caller's bearer token; only the delegate to
// bind the Offline Token to, and an optional narrowing scope, are carried here.
message MintDelegateOfflineTokenRequest {
  // delegate_name is the Delegate.name of the agent this OT is minted for. It
  // becomes the token's act claim. Paired with delegate_namespace: the name
  // alone does not identify a delegate.
  string delegate_name = 1 [(spec.assert_required) = true, (spec.assert_max_size) = 512];
  // delegate_namespace is the Delegate.tenant_namespace completing the
  // (name, namespace) key. Empty means the /system delegate of that name.
  string delegate_namespace = 2 [(spec.assert_max_size) = 512];
  // scope narrows the delegation below the platform default. Unset means the
  // platform default; every later mint intersects fresh OPA output with this,
  // so it can only ever narrow, never widen.
  entitlements.TokenEntitlements scope = 3;
  string trace_id = 200;
  bool noop = 201;
}

// MintDelegateOfflineTokenResponse returns ONLY the one-time code. The Offline
// Token itself is withheld and never transits the user's client; the delegate
// obtains it via RedeemDelegateOfflineToken.
message MintDelegateOfflineTokenResponse {
  // code is the short-lived, single-use redemption code the user hands to the
  // delegate. Opaque; kernel holds the minted OT against it.
  string code = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 64, (spec.assert_max_size) = 128];
  // expires_at_ms is when the code stops being redeemable, epoch milliseconds.
  int64 expires_at_ms = 2 [(spec.assert_ge) = 0];
}

// RedeemDelegateOfflineTokenRequest is the input for a delegate redeeming a
// one-time code (S2S). The delegate's own identity is verified from its S2S
// bearer token, not carried here — kernel requires it to equal the withheld
// token's act claim.
message RedeemDelegateOfflineTokenRequest {
  string code = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 64, (spec.assert_max_size) = 128];
  string trace_id = 200;
  bool noop = 201;
}

// RedeemDelegateOfflineTokenResponse releases the Offline Token to the delegate.
message RedeemDelegateOfflineTokenResponse {
  // token is the delegate-bound OT (token_use = TOKEN_USE_OFFLINE, sub = user,
  // act = delegate). The delegate mints AT/ST from it via the existing
  // Mint.MintToken exchange; every derived token carries act.
  token.Token token = 1;
}

// WorkloadMintRequest mints a child workload identity. The child's SPIFFE ID is
// the caller's spiffe_id + "/" + workload_name.
message WorkloadMintRequest {
  string workload_name = 1 [(spec.assert_required) = true, (spec.assert_max_size) = 128];
  // terminal marks the child as unable to mint further children.
  bool terminal = 3;
  // exp is the desired expiry for the bootstrap token (0 = kernel default).
  int64 exp = 4 [(spec.assert_ge) = 0];
}

// WorkloadMintResponse carries the short-lived bootstrap token for a new child.
message WorkloadMintResponse {
  token.Token bootstrap_token = 1;
}
