name: Nightly gates

# The full mandatory gate set (soundness, unit tests, current-generation and
# determinism for every language, cert-stream, claims-provenance) needs Java,
# Rust, Node and Python toolchains as well as Go. It runs inside the base image
# built from Dockerfile.base, exactly as `just gates-container` does locally.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: just gates-container
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just gates-container
