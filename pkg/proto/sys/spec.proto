syntax = "proto3";

package spec;

import "google/protobuf/descriptor.proto";

// File-level string constants.
// StringConst defines a named string constant that can be used in file-level options.
message StringConst {
  // Name is the identifier for the constant
  string name = 1;
  // Value is the string value of the constant
  string value = 2;
}

// File-level int constants.
// IntConst defines a named integer constant that can be used in file-level options.
message IntConst {
  // Name is the identifier for the constant
  string name = 1;
  // Value is the integer value of the constant
  int64 value = 2;
}

// File-level float constants.
// FloatConst defines a named floating-point constant that can be used in file-level options.
message FloatConst {
  // Name is the identifier for the constant
  string name = 1;
  // Value is the floating-point value of the constant
  double value = 2;
}

// File-level bool constants.
// BoolConst defines a named boolean constant that can be used in file-level options.
message BoolConst {
  // Name is the identifier for the constant
  string name = 1;
  // Value is the boolean value of the constant
  bool value = 2;
}

// DefaultHost provides default values for host.Host fields.
// Mirrors host.Host structure to avoid circular import with host.proto.
message DefaultHost {
  string host = 1;
  int32 port = 2;
}

extend google.protobuf.FileOptions {
  // StringConst defines string constants at the file level
  repeated StringConst string_const = 50001;
  // IntConst defines integer constants at the file level
  repeated IntConst int_const = 50002;
  // FloatConst defines floating-point constants at the file level
  repeated FloatConst float_const = 50003;
  // BoolConst defines boolean constants at the file level
  repeated BoolConst bool_const = 50004;
  // GenerateUserApi marks this proto file for user API code generation
  // When true, tacplus will generate service wrappers, HTTP clients, and example implementations
  bool generate_user_api = 50010;

  // service declares the owning service identity for this proto file.
  // This is the source of truth for the generated service schema injected into sys/tacplus.proto.
  ServiceAnnotation service = 50011;

  // state_imports is a legacy file-level mirror for field-level state_import roots.
  // Prefer field-level state_import; if this option is present, it must exactly
  // mirror the imported "package.StateName" roots derived from those fields.
  repeated StateImport state_imports = 50012;

  // opa_import declares dependencies on OPA eval definitions.
  // Each entry references a "package.InputMessageName" that must have spec.opa_eval.
  // tacplus generates typed client methods on the importing service's SM.
  repeated OpaImport opa_import = 50013;

  // 50014 retired (graph_store — graph store support removed 2026-08-25).

  // timeseries_store marks this service as a timeseries data store. The store
  // receives its projection data by subscribing to the EventBus topics that
  // carry its projection sources (no mutation service is generated).
  // Example: option (spec.timeseries_store) = {};
  TimeseriesStoreAnnotation timeseries_store = 50015;
  // 50016, 50017 retired (graph_import/timeseries_import — push-mutation imports removed).

  // grpc_s2s_client declares service-to-service gRPC client dependencies.
  // tacplus generates typed gRPC client wrappers for each referenced service.
  // Example: option (spec.grpc_s2s_client) = {service: "identity.Mint"};
  repeated GrpcS2SClient grpc_s2s_client = 50018;

  // grpc_c2s_client declares client-facing service dependencies for this service.
  // tacplus.yaml selects whether those dependencies emit C2S, W2S, or both.
  // Example: option (spec.grpc_c2s_client) = {service: "gateway.TokenMint"};
  repeated GrpcC2SClient grpc_c2s_client = 50019;

  // grpc_w2s_client declares browser/web client-facing service dependencies.
  // tacplus.yaml selects whether those dependencies emit C2S, W2S, or both.
  // Example: option (spec.grpc_w2s_client) = {service: "dashboard.Dashboard"};
  repeated GrpcW2SClient grpc_w2s_client = 50020;

  // all_grpc_s2s_clients declares that this service/client needs gRPC client
  // wrappers for ALL gRPC services in the proto source. Intended for tooling
  // (e.g. a CLI) that must be able to call every service.
  // Example: option (spec.all_grpc_s2s_clients) = true;
  bool all_grpc_s2s_clients = 50021;

  // vservice declares a virtual service identity for this proto file.
  // Virtual services are not physical processes — their RPCs are hosted by a
  // physical service (identified by the service_event label). vservice identity
  // enables entitlement-based C2S authorization: aud targets the physical host
  // while entitlements are checked against the vservice name.
  // Example: option (spec.vservice) = {id: 30, name: "claudesensor"};
  VServiceAnnotation vservice = 50022;

  // record_store marks this service as the full-record store (stratum). Tiering
  // (hot/cold) is internal to the service. tacplus auto-derives EventBus
  // subscriptions for the record types it stores (currently spec.record).
  // Example: option (spec.record_store) = {};
  RecordStoreAnnotation record_store = 50023;
  // 50024 retired (cold_store — tiering is internal to the store service).

  // trait declares a cross-service trait implemented by a host service.
  // Like vservice, a trait is not a physical process: its RPCs are hosted by a
  // physical service while entitlements are checked against the trait name.
  // A trait declaration populates the same identity the vservice option does.
  // Example: option (spec.trait) = {id: 40, name: "query"};
  TraitAnnotation trait = 50025;

  // record_read declares that THIS service reads the stored rows of the named
  // (spec.record) types, through the record query plane's S2S half.
  //
  // It is the USE half of a paired control whose GRANT half is
  // (spec.record).s2s_read on the record itself. One says "these services may
  // read my rows"; this says "I read that record's rows". The generator refuses
  // a build in which one is declared without the other, so a client that would
  // be denied at runtime cannot be generated, and a grant nothing uses cannot
  // sit unnoticed.
  //
  // Declaring it is the ONLY thing the reader has to write. It implies the
  // underlying (spec.grpc_s2s_client) on the trait's S2S half — the reader does
  // not restate the transport dependency, because the transport is a
  // consequence of the read, not a second decision.
  //
  // What it generates is a typed, per-record reader on the service manager that
  // collapses the plane's three-call query lifecycle
  // (Create<T>Query -> List<T> -> Delete<T>Query) into the two questions a
  // reader actually asks:
  //
  //   get(key)              -> Option<T>       point read by the record's key
  //   list(filter, page)    -> (Vec<T>, token) paged read over a typed predicate
  //
  // Adding the `c2s` block asks for a SECOND surface on top of that reader: a
  // synthesized `<Service>Records` sibling service in THIS service's own proto,
  // carrying Get<T> and Get<T>Page — a client-facing read of the same rows,
  // scoped to the calling person and their tenant by pins the generated handler
  // applies before the store is asked. Its grant half is
  // (spec.record).c2s_read, and it is a separate right from s2s_read: reading a
  // record type with your own authority and DISCLOSING it to a human are
  // different decisions, and the record owner makes the second one.
  //
  // Example: option (spec.record_read) = {record: "messaging.Message"};
  // Example, with the client-facing half:
  //   option (spec.record_read) = {
  //     record: "scotty.ScottyActivity"
  //     c2s: {scope: C2S_SCOPE_PRINCIPAL, exposure: RPC_EXPOSURE_EXTERNAL}
  //   };
  repeated RecordRead record_read = 50026;
}

// Enum value JSON serialization
extend google.protobuf.EnumValueOptions {
  // JsonReturnValue specifies the JSON representation for an enum value
  string json_return_value = 50005;
}

// IpAddrTypes defines validation types for IP addresses, masks, and networks.
// Used in field options to enforce IP address format validation.
enum IpAddrTypes {
	// IP_ADDR_TYPE_UNSPECIFIED represents an unspecified IP address type
	IP_ADDR_TYPE_UNSPECIFIED = 0;
	// IP_ADDR_TYPE_IP_V4 validates IPv4 addresses (e.g., 1.1.1.1)
	IP_ADDR_TYPE_IP_V4 = 1;
	// IP_ADDR_TYPE_IP_V6 validates IPv6 addresses (e.g., 2001:0db8:85a3:0000:0000:8a2e:0370:7334)
	IP_ADDR_TYPE_IP_V6 = 2;
	// IP_ADDR_TYPE_IP_ANY validates either IPv4 or IPv6 addresses
	IP_ADDR_TYPE_IP_ANY = 3;
	// IP_ADDR_TYPE_MASK_V4 validates IPv4 subnet masks (e.g., 0-32)
	IP_ADDR_TYPE_MASK_V4 = 4;
	// IP_ADDR_TYPE_MASK_V6 validates IPv6 subnet masks (e.g., 0-128)
	IP_ADDR_TYPE_MASK_V6 = 5;
	// IP_ADDR_TYPE_MASK_ANY validates either IPv4 or IPv6 subnet masks
	IP_ADDR_TYPE_MASK_ANY = 6;
	// IP_ADDR_TYPE_NET_V4 validates IPv4 CIDR networks (e.g., 1.1.1.1/32)
	IP_ADDR_TYPE_NET_V4 = 7;
	// IP_ADDR_TYPE_NET_V6 validates IPv6 CIDR networks (e.g., 2001:0db8:85a3::8a2e:0370:7334/128)
	IP_ADDR_TYPE_NET_V6 = 8;
	// IP_ADDR_TYPE_NET_ANY validates either IPv4 or IPv6 CIDR networks
	IP_ADDR_TYPE_NET_ANY = 9;
}

// EncType defines validation types for cryptographic keys and certificates.
// Used in field options to enforce key format and algorithm validation.
enum EncType {
  // ENC_TYPE_KEY_UNDEFINED represents an unspecified encryption key type
  ENC_TYPE_KEY_UNDEFINED = 0;
  // ENC_TYPE_KEY_PRIVATE_RSA validates private RSA keys in PEM format
  ENC_TYPE_KEY_PRIVATE_RSA = 1;
  // ENC_TYPE_KEY_PUBLIC_RSA validates public RSA keys in PEM format
  ENC_TYPE_KEY_PUBLIC_RSA = 2;
  // ENC_TYPE_KEY_ANY_RSA validates either private or public RSA keys
  ENC_TYPE_KEY_ANY_RSA = 3;
  // ENC_TYPE_KEY_PRIVATE_EC validates private Elliptic Curve keys in PEM format
  ENC_TYPE_KEY_PRIVATE_EC = 4;
  // ENC_TYPE_KEY_PUBLIC_EC validates public Elliptic Curve keys in PEM format
  ENC_TYPE_KEY_PUBLIC_EC = 5;
  // ENC_TYPE_KEY_ANY_EC validates either private or public EC keys
  ENC_TYPE_KEY_ANY_EC = 6;
  // ENC_TYPE_KEY_PRIVATE_ED25519 validates private Ed25519 keys in PEM format
  ENC_TYPE_KEY_PRIVATE_ED25519 = 7;
  // ENC_TYPE_KEY_PUBLIC_ED25519 validates public Ed25519 keys in PEM format
  ENC_TYPE_KEY_PUBLIC_ED25519 = 8;
  // ENC_TYPE_KEY_ANY_ED25519 validates either private or public Ed25519 keys
  ENC_TYPE_KEY_ANY_ED25519 = 9;
  // ENC_TYPE_KEY_PRIVATE_ANY validates private keys of any algorithm (RSA, EC, Ed25519)
  ENC_TYPE_KEY_PRIVATE_ANY = 10;
  // ENC_TYPE_KEY_PUBLIC_ANY validates public keys of any algorithm
  ENC_TYPE_KEY_PUBLIC_ANY = 11;
  // ENC_TYPE_KEY_ANY validates any key (private or public) of any algorithm
  ENC_TYPE_KEY_ANY = 12;
  // ENC_TYPE_X509_CERT_RSA validates X.509 certificates with RSA public keys
  ENC_TYPE_X509_CERT_RSA = 13;
  // ENC_TYPE_X509_CERT_EC validates X.509 certificates with EC public keys
  ENC_TYPE_X509_CERT_EC = 14;
  // ENC_TYPE_X509_CERT_ED25519 validates X.509 certificates with Ed25519 public keys
  ENC_TYPE_X509_CERT_ED25519 = 15;
  // ENC_TYPE_X509_CERT_ANY validates X.509 certificates with any key algorithm
  ENC_TYPE_X509_CERT_ANY = 16;
}

enum UrlScheme {
  URL_SCHEME_UNSPECIFIED = 0;
  URL_SCHEME_HTTP = 1;          // Allow only http://
  URL_SCHEME_HTTPS = 2;         // Allow only https://
  URL_SCHEME_HTTP_OR_HTTPS = 3; // Allow both http:// and https://
}

// SqlPermit defines validation types for SQL statement fields.
// Used in field options to enforce a syntactic sanity check plus a statement-type restriction.
// This is NOT an injection defense: the validator only rejects a handful of obvious tokens
// (semicolons, -- and /* comments, backslash escapes) and checks the leading keyword. A
// syntactically valid statement can still carry an injection payload (e.g. a UNION or a
// subquery in a permitted SELECT), and the check does not cover all comment syntaxes (e.g.
// '#' line comments). Callers MUST use parameterized queries and MUST NOT interpolate a validated
// string into a query as though it were safe.
enum SqlPermit {
  // SQL_PERMIT_UNSPECIFIED represents an unspecified SQL permit type
  SQL_PERMIT_UNSPECIFIED = 0;
  // SQL_PERMIT_SELECT allows only SELECT statements (including WITH ... SELECT CTEs)
  SQL_PERMIT_SELECT = 1;
  // SQL_PERMIT_DML allows SELECT, INSERT, UPDATE, DELETE statements
  SQL_PERMIT_DML = 2;
  // SQL_PERMIT_DDL allows CREATE, ALTER, DROP, TRUNCATE statements
  SQL_PERMIT_DDL = 3;
  // SQL_PERMIT_ANY applies only the syntactic sanity check, with no statement-type restriction
  SQL_PERMIT_ANY = 4;
}

enum DurationType {
  DURATION_TYPE_UNSPECIFIED = 0;
  DURATION_TYPE_POSITIVE = 1;      // > 0
  DURATION_TYPE_NON_NEGATIVE = 2;  // >= 0
}

enum PathType {
  PATH_UNSPECIFIED = 0;
  PATH_ABSOLUTE = 1;   // Absolute file path
  PATH_RELATIVE = 2;   // Relative file path
  PATH_ANY = 3;        // Either absolute or relative
  PATH_DIR = 4;        // Directory path (must exist and be a directory)
}

// Azp enumerates the authorized-party / attestation contexts a kernel-minted
// token may record (SPIFFE plan D4). It is the proto-defined source of truth for
// the `azp` claim — generated code carries no hardcoded azp list. `azp` is the
// attestation path, NOT part of the subject identity, and kernel sets it from
// trusted context (never copied from untrusted request claims).
enum Azp {
  AZP_UNSPECIFIED = 0;
  // kernel: minted by kernel from trusted internal context (service/bootstrap).
  AZP_KERNEL = 1;
  // oauth: user attested via an OAuth broker; kernel maps the broker's
  // authenticated S2S identity to this value at MintUserToken.
  AZP_OAUTH = 2;
  // saml: user attested via a SAML broker; mapped by kernel as for oauth.
  AZP_SAML = 3;
  // cloud-auth: reserved for the future cloud-auth attestation broker. No
  // runtime mints this except tests until that broker exists (D4).
  AZP_CLOUD_AUTH = 4;
}

// TypeKind classifies protobuf field kinds for generated registry metadata.
enum TypeKind {
  TYPE_KIND_UNSPECIFIED = 0;
  TYPE_KIND_STRING = 1;
  TYPE_KIND_BOOL = 2;
  TYPE_KIND_BYTES = 3;
  TYPE_KIND_INT32 = 4;
  TYPE_KIND_INT64 = 5;
  TYPE_KIND_UINT32 = 6;
  TYPE_KIND_UINT64 = 7;
  TYPE_KIND_SINT32 = 8;
  TYPE_KIND_SINT64 = 9;
  TYPE_KIND_FIXED32 = 10;
  TYPE_KIND_FIXED64 = 11;
  TYPE_KIND_SFIXED32 = 12;
  TYPE_KIND_SFIXED64 = 13;
  TYPE_KIND_FLOAT = 14;
  TYPE_KIND_DOUBLE = 15;
  TYPE_KIND_ENUM = 16;
  TYPE_KIND_MESSAGE = 17;
  TYPE_KIND_MAP = 18;
}

// NumericConstraint defines constraints for integer fields (int32, int64, uint32, uint64)
// This message supports complex validation scenarios beyond simple comparisons
message NumericConstraint {
  // gt: field must be greater than this value
  optional int64 gt = 1;

  // ge: field must be greater than or equal to this value
  optional int64 ge = 2;

  // lt: field must be less than this value
  optional int64 lt = 3;

  // le: field must be less than or equal to this value
  optional int64 le = 4;

  // eq: field must equal this value
  optional int64 eq = 5;

  // ne: field must not equal this value
  optional int64 ne = 6;

  // in: field must be one of these values
  repeated int64 in = 7;

  // not_in: field must not be one of these values
  repeated int64 not_in = 8;

  // multiple_of: field must be divisible by this value (field % multiple_of == 0)
  optional int64 multiple_of = 9;
}

// FloatConstraint defines constraints for floating-point fields (float, double)
message FloatConstraint {
  // gt: field must be greater than this value
  optional double gt = 1;

  // ge: field must be greater than or equal to this value
  optional double ge = 2;

  // lt: field must be less than this value
  optional double lt = 3;

  // le: field must be less than or equal to this value
  optional double le = 4;

  // epsilon: tolerance for floating-point equality comparisons (default: 1e-9)
  // Used when comparing floats to avoid precision issues
  optional double epsilon = 5;

  // in: field must be one of these values (within epsilon)
  repeated double in = 6;

  // not_in: field must not be one of these values (within epsilon)
  repeated double not_in = 7;
}

// ParamMapConfig configures automatic generation of FromMap methods
// This generates a method that converts a map[string]string to the message type,
// where the map keys correspond to enum values with json_return_value annotations
message ParamMapConfig {
  // The enum type to use for parameter keys (e.g., "TokenParamKey")
  // The enum must have json_return_value annotations on its values
  string key_enum = 1;

  // Whether to return an error on unknown keys (default: false, ignore unknown)
  bool strict = 2;

  // Whether to return an error if required fields are missing (default: true)
  bool validate_required = 3;
}

extend google.protobuf.MessageOptions {
  // Generate a FromMap method that converts map[string]string to this message type
  // Example: TokenRequestParams with key_enum="TokenParamKey" generates:
  //   func TokenRequestParamsFromMap(params map[string]string) (*TokenRequestParams, error)
  ParamMapConfig generate_from_map = 60028;

  // service_state marks a message as a state root.
  // Example: option (spec.service_state) = {name: "BaseballState", label: ["state-store"]};
  StateAnnotation service_state = 60035;

  // 60036 was (spec.state_consistency) (ConsistencyModel) — removed; boundaries are
  // convergent. Do not reuse 60036.

  // NOT IMPLEMENTED. state_eviction_policy would specify the default eviction
  // policy for all boundaries in a state root message. No generator reads it;
  // generation REJECTS it (GEN-ANN-1).
  // Default: EVICTION_POLICY_NONE.
  EvictionPolicy state_eviction_policy = 60038;

  // NOT IMPLEMENTED. state_sync_backup_count would specify the default sync
  // backup count for all boundaries. No generator reads it; generation REJECTS it
  // (GEN-ANN-1).
  int32 state_sync_backup_count = 60039;

  // NOT IMPLEMENTED. state_async_backup_count would specify the default async
  // backup count for all boundaries. No generator reads it; generation REJECTS it
  // (GEN-ANN-1).
  int32 state_async_backup_count = 60040;

  // 60041 was (spec.state_perms) (RO/RW/WORM access grants) — removed; state access
  // is export/import only, not governed by a per-service permission axis. Do not reuse 60041.

  // grpc_config marks this message as a gRPC service's configuration.
  // tacplus generates a generated.Services message and per-service config state boundaries.
  GrpcConfigAnnotation grpc_config = 60042;

  // disable_auth_message marks a service_state message as not requiring authentication.
  // RPCs on this state service skip token validation entirely.
  // Use for state roots that must be reachable before callers have tokens
  // (e.g., TokenExchangerState, TrustedCaState).
  // Example: option (spec.disable_auth_message) = true;
  bool disable_auth_message = 60044;

  // subscribe declares event-bus topic subscriptions for this state service.
  // Only valid on messages with option (spec.service_state).
  // Each entry references a topic field on another service's state root.
  // Example:
  //   option (spec.subscribe) = {source: "claudesensor.AgenticCodeEventBus.event_stream"};
  repeated SubscriptionAnnotation subscribe = 60045;

  // 60046 retired (graph_type — graph store support removed 2026-08-25).

  // record marks this message as a stored record (an event held in full by the
  // record_store, stratum) and makes it projectable. key = unique id field,
  // owner = ownership/identity field. A record implies event.
  // Example:
  //   option (spec.record) = {key: "event_id", owner: "spiffe_id"};
  RecordAnnotation record = 60065;

  // event marks this message as an EventBus event: a topic + publish RPC are
  // generated for it. The producer surface is DECLARED — at least one of c2s
  // (external clients, via gateway) or s2s (internal services). An internal-only
  // event is s2s and is NOT exposed externally. spec.record implies spec.event.
  // Example:
  //   option (spec.event) = {s2s: {}};            // internal-only
  //   option (spec.event) = {c2s: {auth_any_user: true}, s2s: {}};
  EventAnnotation event = 60079;

  // 60066 retired (graph_projection — graph store support removed 2026-08-25).

  // 60067 retired (timeseries_projection — split into spec.transformation
  // (the pure conversion) + spec.record.retention (delivery-side lifetime),
  // 2026-08-25).

  // transformation declares a pure typed conversion of this message into a
  // derived row type. tacplus generates the derived message, its column
  // annotations, and its projection_source mappings.
  //
  // DELIVERY IS NOT DECLARED HERE. A transformation needs no spec.record, no
  // EventBus topic, and no subscription to generate; conversely a record
  // delivers and stores with no transformation attached. Retention — the one
  // piece of delivery state the old timeseries_projection bundled in — lives on
  // (spec.record).retention.
  //
  // Repeated — one per oneof variant / derived type.
  // Example:
  //   option (spec.transformation) = {
  //     name: "SessionRecord"
  //     when: "session"
  //     field: {source: "session.model"  cardinality_hint: CARDINALITY_LOW}
  //   };
  repeated Transformation transformation = 60085;

  // service_event declares that this state root's topic publish RPCs should be
  // exposed through the API gateway. tacplus propagates this to the generated
  // state service as spec.service_c2s and spec.event_label options.
  ServiceEventAnnotation service_event = 60060;

  // timeseries_type opts a message into timeseries table generation.
  // tacplus generates store-neutral conversion helpers and a gRPC service;
  // a downstream materializer renders the concrete backend schema.
  TimeseriesTypeAnnotation timeseries_type = 60061;

  // service_store marks a message as a durable key-value store.
  // tacplus generates a gRPC service with Put/Get/Delete/List RPCs.
  // The backing store implementation can map these RPCs to replicated storage.
  // Example:
  //   message CredPair {
  //     option (spec.service_store) = {label: ["state-store"]};
  //     string client_id = 1 [(spec.store_key) = true];
  //     string client_secret = 2;
  //   }
  ServiceStoreAnnotation service_store = 60062;

  // opa_eval marks a message as an OPA policy evaluation input.
  // tacplus generates a typed S2S RPC on opa for each annotated message.
  // The entry_point identifies the OPA policy path; the result identifies
  // the output message in the same proto file.
  OpaEvalAnnotation opa_eval = 60063;

  // service_health declares a typed health message for a service.
  // The message MUST embed healthreport.ServiceInstanceHealth as field 1.
  // The state store keeps the full typed message per service, keyed by
  // instance_id and extracts .base into the generic health view for gateway.
  // One service_health message per service package.
  ServiceHealthAnnotation service_health = 60064;

  // per_service_config marks a message whose fields are per-service configuration
  // slices. Each field name must match a known service package name. tacplus
  // automatically subscribes each named service to a read-only view of its own
  // slice from the grpc_config service that owns this message type.
  //
  // Example:
  //   message TenantConfig {
  //     option (spec.per_service_config) = true;
  //     OAuthTenantConfig     oauth    = 1;  // delivered to "oauth" service
  //     IdentityTenantConfig  identity = 2;  // delivered to "identity" service
  //     OpaTenantConfig       opa      = 3;  // delivered to "opa" service
  //   }
  bool per_service_config = 60068;

  // data_entitlement: message(type)-level default data-entitlement transform for
  // the eligible fields of this message. A field-level (spec.redact) overrides it.
  // Only meaningful for fields that are themselves annotation-eligible (e.g.
  // anonymize requires string/bytes). Mirrors how a message-level default is
  // overridden per field; does NOT cascade into nested messages (each message
  // carries its own default).
  RedactOption data_entitlement = 60069;

  // config_slice marks a message as one per-service configuration slice with an
  // explicit owner and scope.
  // Example: option (spec.config_slice) = {scope: CONFIG_SLICE_SCOPE_TENANT, service_name: "identity"};
  ConfigSliceAnnotation config_slice = 60075;
  // Field numbers 60069-60072 retired: the legacy tenant_config_slice/
  // tenant_config_service/project_config_slice/project_config_service aliases
  // were removed in favor of config_slice. Do not reuse these numbers.

  // event_publish declares that this actor publishes an EventBus topic. The
  // topic_ref must be a tacplus-validated TopicRef:
  // "<proto-package>.<topic-message>.<topic-field>".
  //
  // Because this derives a normal RPC, the annotation carries the normal tacplus
  // method auth shape for the derived RPC. Set exactly one of method_s2s or
  // method_c2s unless the surrounding actor context provides an unambiguous
  // default.
  repeated EventPublishAnnotation event_publish = 60073;

  // event_watch declares that this actor watches an EventBus topic. The
  // topic_ref must be a tacplus-validated TopicRef:
  // "<proto-package>.<topic-message>.<topic-field>".
  //
  // Because this derives a normal RPC, the annotation carries the normal tacplus
  // method auth shape for the derived RPC. Set exactly one of method_s2s or
  // method_c2s unless the surrounding actor context provides an unambiguous
  // default.
  repeated EventWatchAnnotation event_watch = 60074;

  // owner_default declares what the OWNER of a row of this type may do with it
  // by default (§4b). The owner is the principal named by this message's
  // (spec.store_principal) field — a message declaring owner_default without one
  // has no owner to speak of and is rejected at generation time.
  //
  // The generated service wrapper enforces it: a method the verb registry
  // classifies as WRITE that touches a type declaring {write: false} is refused
  // with PERMISSION_DENIED before the handler runs, and likewise a READ method
  // touching {read: false}. Absent the option nothing is enforced, so this is
  // additive to every existing type.
  //
  // It is a DEFAULT, so it binds only a caller acting as its own principal.
  // PrincipalScope (below) is the override: a grant carrying a scope wider than
  // self is not the owner acting on itself and is not refused here.
  //
  // Example: option (spec.owner_default) = {read: true, write: false};
  OwnerDefault owner_default = 60080;
}

// PrincipalScope is how wide a caller's authority over PRINCIPALS is. It rides
// the caller's grant as the "principal_scope" key of the OPA-stamped
// service_entitlements claim bag — the same bag the egress "data_grants" ride —
// so it is one more claim on an existing seam, not a second auth path.
//
// The generated service wrapper reads it by name and compares it to the row's
// principal. SELF_ONLY (and absent/unspecified, which fail closed to it) means
// the caller may act only as its own principal, which is what scopes a
// (spec.owner_default) refusal to the row's owner instead of to every caller.
// Anything wider means the caller is not the owner acting on itself.
//
// SELF_ONLY, not SELF: the Rust variant is the value name with the enum prefix
// stripped, and `Self` is a Rust keyword that protoc-gen-prost-serde does not
// escape (prost renders `Self_`, the serde companion renders `Self`, and the
// crate does not compile). See PRINCIPAL_SCOPE_QUESTIONS.md.
enum PrincipalScope {
  // Unspecified is the proto3 zero value and is treated as SELF_ONLY: a token
  // that says nothing about principal scope has not been widened.
  PRINCIPAL_SCOPE_UNSPECIFIED = 0;
  // Self only: the caller may act only on rows whose principal is the caller.
  PRINCIPAL_SCOPE_SELF_ONLY = 1;
  // Subtree: the caller may act on rows whose principal is at or below the
  // caller's own namespace.
  PRINCIPAL_SCOPE_SUBTREE = 2;
  // Any: the caller may act on any principal's rows.
  PRINCIPAL_SCOPE_ANY = 3;
}

// OwnerDefault is the rights a type's owner holds over its own rows by default.
// Both fields default to false, so an owner_default that names neither denies
// both — the option is never a no-op, which is what makes a declaration
// observable rather than decorative.
message OwnerDefault {
  // read: the owner may read rows of this type.
  bool read = 1;
  // write: the owner may create or modify rows of this type.
  bool write = 2;
}

// SubscriptionAnnotation declares that this state service subscribes to
// an event-bus topic from another service's state root.
message SubscriptionAnnotation {
  // source is the fully-qualified topic reference: "package.StateRoot.field_name"
  // e.g., "claudesensor.AgenticCodeEventBus.event_stream"
  string source = 1;
}

// EventPublishAnnotation declares that an actor publishes an EventBus topic.
// topic_ref is canonical identity; auth policy is the standard tacplus method
// auth shape carried through to the derived publish RPC.
message EventPublishAnnotation {
  string topic_ref = 1;
  MethodS2SAnnotation method_s2s = 2;
  MethodC2SAnnotation method_c2s = 3;
}

// EventWatchAnnotation declares that an actor watches an EventBus topic.
// topic_ref is canonical identity; auth policy is the standard tacplus method
// auth shape carried through to the derived watch RPC.
message EventWatchAnnotation {
  string topic_ref = 1;
  MethodS2SAnnotation method_s2s = 2;
  MethodC2SAnnotation method_c2s = 3;
}

// RecordAnnotation marks a message as a stored record: an event held in full by
// the record_store (stratum) and projectable to timeseries stores. A record
// IS an event (it flows through eventbus); every record declares a key field
// (unique identifier) and an owner field (ownership/identity).
message RecordAnnotation {
  // key is the proto field name used as the unique record identifier.
  string key = 1;
  // owner is the proto field name that identifies the record's owner (e.g. spiffe_id).
  string owner = 2;
  // c2s, when present, exposes the record's publish RPC to external clients (via
  // gateway). A record IS an event; this declares its producer surface the same
  // way spec.event does. See EventAnnotation.
  MethodC2SAnnotation c2s = 3;
  // s2s, when present, exposes the record's publish RPC to internal services.
  // It is the PRODUCER surface only; the consumer surface is s2s_subscribe.
  MethodS2SAnnotation s2s = 4;
  // retention is the store-neutral row retention policy for this record's
  // stored rows (unset = indefinite).
  //
  // Retention is DELIVERY-side state, not transformation state. A
  // (spec.transformation) is a pure typed conversion A -> B; a pure function has
  // no lifetime, so a retention window cannot live on it. It lives here, on the
  // declaration that says this message is stored and delivered — the same place
  // key/owner/producer-surface live. A downstream materializer (e.g. stratum's
  // EventStoreGenerator) reads it from here to render the concrete eviction rule.
  //
  // Example:
  //   option (spec.record) = {
  //     key: "event_id" owner: "spiffe_id" s2s: {auth_services: ["*"]}
  //     retention: {timestamp_field: "timestamp_ms" duration_seconds: 7776000}
  //   };
  RetentionPolicy retention = 5;

  // min_group_size is the smallest result size this record's size-only query
  // surfaces will disclose. 0 / unset = no guard (additive, like owner_default).
  //
  // "Size-only" is the line: it covers the surfaces that return a size and no
  // rows (Get<T>Count, Subscribe<T>Count, and the QueryStats.size that
  // Update<T>Query returns for its newly-installed predicate). It deliberately
  // does NOT cover List<T>'s total_count, which accompanies rows the caller has
  // just been handed and so discloses nothing the rows themselves do not. A
  // future change that makes a paged read return counts without rows has
  // crossed that line.
  int32 min_group_size = 6;

  // residency is how long this record type's rows stay resident in MEMORY.
  //
  // It is a data-lifecycle property of the type inside ONE store, not a choice
  // of backing store: field 50024 (cold_store) was retired above because
  // "tiering is internal to the store service", and that ruling stands. There is
  // still exactly one record store. This names the WINDOW, and hot/warm/cold are
  // presets of it.
  //
  // Unset = RESIDENCY_HOT, which is what every record does today. Additive, the
  // same way min_group_size and owner_default are.
  //
  // Residency is NOT retention. Retention (field 5) DELETES rows and measures
  // from the author's business timestamp; residency EVICTS rows from memory and
  // measures from the store epoch (the (spec.store_epoch) field, stamped by the
  // wrapper on every write). Eviction is cache maintenance: a warm row evicted
  // from memory is still complete and queryable on disk.
  //
  // Example:
  //   option (spec.record) = {
  //     key: "accounting_id" owner: "spiffe_id"
  //     residency: {window: RESIDENCY_WARM}
  //   };
  ResidencyPolicy residency = 7;

  // mutability is whether this record type's rows may be changed after they are
  // written. It is an ATTRIBUTE, orthogonal to residency: immutable-warm
  // (accounting) and mutable-warm are both legitimate, and so is either with
  // RESIDENCY_HOT.
  //
  // Unset = MUTABILITY_CRUD, which is what every record does today.
  //
  // MUTABILITY_APPEND_ONLY is enforced at BOTH ends or it is decoration: the
  // generator emits no row-mutating RPC for the type (ValidateMutabilityAnnotations
  // refuses one at generation), and the generated service wrapper refuses to host
  // one. This is the same two-ended shape (spec.record).min_group_size already has.
  Mutability mutability = 8;

  // s2s_subscribe, when present, exposes the record's SUBSCRIBE RPC to the named
  // internal services. It is the consumer half of the pair whose producer half
  // is s2s (field 4), and it exists because a topic has two boundaries and only
  // one of them was declarable.
  //
  // A record's synthesized <Record>Bus topic wrapper hosts both PublishTo<T> and
  // SubscribeTo<T>. s2s names who may PUBLISH. Nothing named who may CONSUME, so
  // the subscribe RPC could only ever fall back to the state service's
  // service-level list, which for a synthesized wrapper is resolved from the
  // owning PACKAGE — and the record store that consumes every record topic is
  // never in the owning package. Under per-topic authorization that is
  // fail-closed: the store is denied on every topic it exists to read.
  //
  // Declared rather than inferred on purpose. Treating "the record store" as an
  // implicitly authorized consumer would put an undeclared trust relationship in
  // the generator with no proto anyone could read to audit it, and would silently
  // grant or silently withhold access to any FUTURE consumer of a record topic.
  // Who may read a record's stream is exactly as much a policy statement as who
  // may write it, so it is written down in the same place, in the same shape.
  //
  // Same semantics as s2s: ["*"] is any authenticated service, an explicit list
  // is exactly that list, and an absent annotation leaves the service-level
  // default in place (i.e. this is additive — a record that declares none keeps
  // today's behaviour).
  //
  // Example — a stored record consumed by the record store:
  //   option (spec.record) = {
  //     key: "accounting_id" owner: "spiffe_id"
  //     s2s: {auth_services: ["*"]}              // anyone may publish
  //     s2s_subscribe: {auth_services: ["stratum"]}  // only the store may read
  //   };
  MethodS2SAnnotation s2s_subscribe = 9;

  // s2s_read, when present, exposes this record's STORED-ROW READ surface to the
  // named internal services — the record query plane's S2S half, hosted by the
  // record store.
  //
  // It is the third member of a set whose other two already exist, and it is
  // declared for exactly the reason s2s_subscribe is. A record type has three
  // boundaries, not two:
  //
  //   s2s            who may PUBLISH onto the record's topic  (write the stream)
  //   s2s_subscribe  who may CONSUME the record's topic       (tail the stream)
  //   s2s_read       who may READ the record's STORED ROWS    (query the store)
  //
  // Until this field existed the third boundary had no per-record declaration at
  // all: every record's read RPCs carried the TRAIT-WIDE (spec.trait).auth_services
  // list, so authorizing one service to read one record type authorized it to read
  // EVERY record type in the fleet. That is precisely what
  // decisions/mcp-generation-and-service-owned-data-2026-08-31.md §2 rules out —
  // "Stratum grants entitlements per service, per record type, INDEPENDENTLY" —
  // and it is why that document's §1 calls the shared `query` trait superseded.
  // The trait-wide list stays as the fallback for records that declare nothing,
  // so this is additive exactly the way s2s_subscribe, min_group_size and
  // owner_default are.
  //
  // Declared rather than inferred, on the same reasoning s2s_subscribe records:
  // treating "the service that produces a record type" as an implicitly
  // authorized reader would put an undeclared trust relationship in the
  // generator with no proto anyone could read to audit it. A producer is not
  // automatically a reader — §2's whole point is that read and write rights are
  // granted independently — so the read right is written down where the other two
  // are, in the same shape.
  //
  // PAIRED CONTROL. This is the grant half. The USE half is
  // (spec.record_read) on the reading service's own proto, and the generator
  // refuses a build where one is declared without the other: a service that
  // declares (spec.record_read) on a record whose s2s_read does not name it
  // fails generation rather than emitting a client that would be denied at
  // runtime. Neither end can drift from the other, because neither end works
  // alone.
  //
  // Same semantics as s2s and s2s_subscribe: ["*"] is any authenticated service,
  // an explicit list is exactly that list, and an absent annotation leaves the
  // trait-wide default in place.
  //
  // Declaring it also makes the record's KEY field an EQ criterion on the
  // generated <T>Filter, whether or not the key carries its own
  // (spec.query_field). Point-read-by-key is the read surface's most basic
  // question and the plane could not express it otherwise; see
  // record_map.go's keyFilterCriterion.
  //
  // Example — a record its own producer reads back:
  //   option (spec.record) = {
  //     key: "delivery_id" owner: "spiffe_id"
  //     s2s: {auth_services: ["messaging"]}
  //     s2s_subscribe: {auth_services: ["stratum"]}
  //     s2s_read: {auth_services: ["messaging"]}
  //   };
  MethodS2SAnnotation s2s_read = 10;

  // c2s_read, when present, names the services allowed to RE-EXPOSE this
  // record's stored rows TO THEIR OWN END USERS — the client-facing read plane,
  // hosted by the reading service itself and never by the record store.
  //
  // It is the FOURTH boundary, and it is not a narrowing of the third:
  //
  //   s2s            who may PUBLISH onto the record's topic  (write the stream)
  //   s2s_subscribe  who may CONSUME the record's topic       (tail the stream)
  //   s2s_read       who may READ the record's STORED ROWS    (query the store)
  //   c2s_read       who may DISCLOSE those rows TO A PERSON  (re-expose them)
  //
  // A service can hold s2s_read without c2s_read and that combination is the
  // common one: read a record type to make an internal decision, and never show
  // it to anyone. Making disclosure a separate grant is what keeps that
  // distinction sayable, and it keeps the RECORD OWNER in the loop on every
  // re-exposure of its data rather than only on the first read of it.
  //
  // TWO SEMANTIC DIFFERENCES FROM s2s_read, both deliberate:
  //
  //   ["*"] FAILS GENERATION. On s2s_read the wildcard means "any authenticated
  //       peer inside the fleet", which is broad but is a statement someone
  //       might mean. "Any service may show my rows to any of its users" is not
  //       a statement anyone means to make, so it is refused rather than
  //       supported.
  //   c2s_read IMPLIES s2s_read for the same service, and the pair with the
  //       second half missing fails generation. The generated c2s handler's
  //       entire data path IS the s2s reader; a disclosure grant without a read
  //       grant is a surface that cannot execute.
  //
  // PAIRED CONTROL, exactly as s2s_read is. This is the grant half; the use half
  // is (spec.record_read).c2s on the reading service's own proto, and
  // ValidateRecordReadAnnotations refuses a build in which one is declared
  // without the other, in both directions.
  //
  // Example — a record its producer also shows to its users:
  //   option (spec.record) = {
  //     key: "activity_id" owner: "spiffe_id"
  //     s2s:           {auth_services: ["scotty"]}
  //     s2s_subscribe: {auth_services: ["stratum"]}
  //     s2s_read:      {auth_services: ["scotty"]}
  //     c2s_read:      {auth_services: ["scotty"]}
  //   };
  MethodS2SAnnotation c2s_read = 11;
}

// Residency is the memory-residency window preset for a stored record type.
// The presets are the whole vocabulary; there is no free-form third axis.
enum Residency {
  // Unspecified = RESIDENCY_HOT. Absence must keep meaning today's behaviour,
  // or every record proto in the fleet changes meaning on the P1 upgrade.
  RESIDENCY_UNSPECIFIED = 0;

  // HOT: in memory forever, or until deleted. Window = unbounded.
  RESIDENCY_HOT = 1;

  // WARM: in memory for a window; complete and queryable on disk beneath it.
  // Window = ResidencyPolicy.window_seconds, or the configured default when
  // that is 0. Rows are evicted from memory at window age and served from disk
  // thereafter; a write returns the row to the window.
  RESIDENCY_WARM = 2;

  // COLD: RESERVED, NOT IMPLEMENTED. Semantics would be window = 0 — straight
  // to disk, never resident — if a high-volume need ever appears. Declaring it
  // FAILS GENERATION (see ValidateResidencyAnnotations). The value exists so the
  // refusal can be explicit instead of the declaration being a typo nobody
  // catches.
  RESIDENCY_COLD = 3;
}

// ResidencyPolicy states a record type's memory-residency window.
message ResidencyPolicy {
  // window is the preset. Required when residency is declared at all;
  // RESIDENCY_UNSPECIFIED inside a present ResidencyPolicy is a generation
  // error, not a silent HOT (an author who wrote the block meant something).
  Residency window = 1;

  // window_seconds overrides the configured default window. WARM ONLY:
  // set on HOT or COLD it is a knob nothing reads, and generation REJECTS it
  // rather than accept an intent tacplus does not honour.
  // 0 = use the configured default.
  int64 window_seconds = 2;
}

// Mutability is whether a stored record type's rows may change after write.
enum Mutability {
  // Unspecified = MUTABILITY_CRUD (today's behaviour).
  MUTABILITY_UNSPECIFIED = 0;

  // CRUD: rows may be updated and deleted by key.
  MUTABILITY_CRUD = 1;

  // APPEND_ONLY: rows are written once. No row-mutating RPC is generated for
  // the type and the generated wrapper refuses to host one. Its disk slices are
  // pure appends — sealed, checksummable units.
  MUTABILITY_APPEND_ONLY = 2;
}

// Ejectionable is whether ONE ROW may be evicted from memory when its residency
// window expires. It is the per-row gate on the window (spec.record).residency
// declares for the whole type.
//
// It is an ATTRIBUTE, orthogonal to residency, exactly as Mutability is: the
// type says HOW LONG rows stay resident, each row says WHETHER the window
// applies to it at all. Both axes are needed because a single warm record type
// legitimately holds rows that must not leave memory (a mailbox's undelivered
// message) alongside rows that may (one already retrieved).
//
// Unset = EJECTIONABLE_NEVER, which is HOT's safe default: a row nobody marked
// stays in memory. Absence must keep meaning today's behaviour, and the safe
// direction for a marker an author forgets is "keep the row", never "drop it".
enum Ejectionable {
  // Unspecified = EJECTIONABLE_NEVER. The row is never evicted.
  EJECTIONABLE_UNSPECIFIED = 0;

  // NEVER: the residency window does not apply to this row. It stays resident
  // for as long as the type's rows are retained at all. The explicit spelling
  // of an absent value, the same way RetentionPolicy.forever is.
  EJECTIONABLE_NEVER = 1;

  // WINDOW: the residency window applies to this row as declared — it is
  // evicted from memory once its (spec.store_epoch) is older than the window,
  // and served from disk thereafter.
  EJECTIONABLE_WINDOW = 2;
}

// EventAnnotation marks a message as an EventBus event: tacplus generates a topic
// and a publish RPC for it. The producer surface is declared (not defaulted):
// set c2s to expose the publish RPC to external clients (via gateway), s2s to
// expose it to internal services. At least one must be present; an internal-only
// event sets only s2s and is never exposed externally. spec.record implies
// spec.event (a record is an event that is also stored + projectable).
message EventAnnotation {
  // c2s, when present, exposes the publish RPC to external clients (via gateway).
  MethodC2SAnnotation c2s = 1;
  // s2s, when present, exposes the publish RPC to internal services.
  // Producer surface only; the consumer surface is s2s_subscribe.
  MethodS2SAnnotation s2s = 2;
  // s2s_subscribe, when present, exposes the SUBSCRIBE RPC of this event's topic
  // to the named internal services. See RecordAnnotation.s2s_subscribe for the
  // full reasoning; the semantics are identical.
  MethodS2SAnnotation s2s_subscribe = 3;
}

// CardinalityHint is a store-neutral hint about how many distinct values a
// column holds. A downstream materializer may use it to pick an encoding, but
// tacplus emits no concrete codec — the hint is pure semantic intent.
enum CardinalityHint {
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_LOW = 1;   // few distinct values; was low_cardinality=true
  CARDINALITY_HIGH = 2;  // many distinct values
}

// RetentionPolicy is a store-neutral statement of how long rows are retained.
// A downstream materializer renders this into an engine-specific TTL/eviction
// rule; tacplus carries only the semantic intent (which field, how long).
message RetentionPolicy {
  string timestamp_field = 1;   // row field the retention age is measured from
  int64 duration_seconds = 2;   // retain this long after timestamp_field; 0 = indefinite

  // forever declares that this record type's rows are never aged out. It is the
  // EXPLICIT spelling of what an absent retention block means implicitly, and it
  // exists so an append-only "forever" dataset can be refused a retention knob —
  // you cannot refuse a knob on the grounds that another knob is absent.
  // forever:true with duration_seconds > 0 is a contradiction and fails
  // generation (ValidateResidencyAnnotations).
  bool forever = 3;
}

// DedupStrategy is a store-neutral statement of how duplicate rows are resolved.
enum DedupStrategy {
  DEDUP_NONE = 0;               // append-only; keep all rows
  DEDUP_LATEST_BY_VERSION = 1;  // keep latest row per key by version_field
}

// DedupPolicy is a store-neutral statement of row identity and duplicate
// resolution. A downstream materializer maps this onto an engine's merge/dedup
// mechanism; tacplus carries only the semantic intent.
message DedupPolicy {
  DedupStrategy strategy = 1;
  repeated string key_fields = 2;  // logical row identity
  string version_field = 3;        // selects winning row under DEDUP_LATEST_BY_VERSION
}

// Transformation declares a pure typed conversion of this message into a
// derived row type: source message A -> derived type B. tacplus generates the
// derived message with its column annotations and projection_source mappings.
//
// A transformation says NOTHING about delivery. It does not require the source
// to be a (spec.record), it does not create or subscribe to an EventBus topic,
// and it carries no retention window — retention is delivery-side state and
// lives on (spec.record).retention. Declaring a transformation and declaring
// delivery are independent: either generates without the other.
//
// The shape is store-neutral: dedup and cardinality_hint are declared as
// semantic intent, and a downstream materializer renders the concrete
// engine/merge behavior.
message Transformation {
  // name is the derived row type name (e.g. "SessionRecord").
  string name = 1;
  reserved 2, 3, 6;
  reserved "engine", "ttl", "retention";
  // when is the oneof variant name that triggers this row (e.g. "session").
  // Only source messages carrying this payload variant produce a row.
  string when = 4;
  // field lists the source fields projected into the derived type.
  repeated TransformationField field = 5;
  // dedup is the store-neutral duplicate-resolution policy for the derived rows.
  DedupPolicy dedup = 7;
}

// TransformationField maps a source message field to a derived-type column.
message TransformationField {
  // source is the field path on the source message (e.g. "session.model").
  string source = 1;
  // as renames the column in the derived type (defaults to last segment of source).
  string as = 2;
  // order_key is the column's position in the store-neutral sort-key role
  // (0 = not a sort key). A materializer maps this to the engine's sort order.
  int32 order_key = 3;
  // partition_key marks this column as part of the store-neutral partition role.
  bool partition_key = 4;
  reserved 5;
  reserved "low_cardinality";
  // cardinality_hint is a store-neutral hint about the column's distinct-value count.
  CardinalityHint cardinality_hint = 6;
}

// ============================================================================
// Timeseries Projection Annotations
// ============================================================================

// TimeseriesTypeAnnotation opts a message into timeseries table generation.
// tacplus generates store-neutral conversion helpers and a gRPC service from
// messages annotated with this option. Each annotated message produces one
// timeseries table type. Retention and dedup are declared as semantic intent;
// a downstream materializer renders the concrete engine/TTL/merge behavior.
//
// Example:
//   message SensorTimeseries {
//     option (spec.timeseries_type) = {source: "sensor.SensorEvent"};
//     ...
//   }
//
// This is a GENERATOR-INTERNAL compile target: tacplus emits it from every
// (spec.transformation). It carries no retention — retention is delivery-side
// state and lives on (spec.record).retention.
message TimeseriesTypeAnnotation {
  // Table name. Default: snake_case of message name.
  string name = 1;
  reserved 2, 3, 5;
  reserved "engine", "ttl", "retention";
  // Source event FQN for field extraction.
  // When set, every field in this message must have (spec.projection_source) to map
  // from the source event to this projection.
  // Example: "sensor.SensorEvent"
  string source = 4;
  // dedup is the store-neutral duplicate-resolution policy.
  DedupPolicy dedup = 6;
}

// TimeseriesFieldOption configures how a single proto field maps to a timeseries
// column. Applied via (spec.timeseries_column) on individual fields. Any field
// with this annotation becomes a column; fields without it are omitted. Column
// roles are store-neutral: order_key/partition_key name logical roles and
// cardinality_hint states distinct-value intent — a downstream materializer maps
// them onto the concrete engine's sort/partition/encoding mechanisms.
//
// Example:
//   string session_id = 1 [(spec.timeseries_column) = {order_key: 1}];
//   int64 timestamp_ms = 2 [(spec.timeseries_column) = {order_key: 2, partition_key: true}];
//   string event_type = 3 [(spec.timeseries_column) = {cardinality_hint: CARDINALITY_LOW}];
//   int64 duration_ms = 4 [(spec.timeseries_column) = {}];
message TimeseriesFieldOption {
  reserved 1, 2, 5, 6;
  reserved "type", "codec", "default_expr", "low_cardinality";
  // Position in the store-neutral sort-key role (1-indexed). 0 = not a sort key.
  int32 order_key = 3;
  // Part of the store-neutral partition role.
  bool partition_key = 4;
  // Store-neutral hint about the column's distinct-value count.
  CardinalityHint cardinality_hint = 7;
}

// ServiceS2SAnnotation declares a service-to-service gRPC service.
// Only authenticated service identities can call these RPCs.
// Per-RPC auth lives on spec.rpc: allowed callers (auth_services) and the
// bootstrap corner cases (RPC_FLAG_SELF_AUTHENTICATES) are declared there.
message ServiceS2SAnnotation {
  // auth_services: service identities allowed to call (service-level default).
  // ["*"] = any service. Named entries restrict to those identities.
  // Overridden per-RPC by spec.rpc auth_services; tacplus-generated service
  // protos (state, record_map, timeseries, opa_eval) still declare it here.
  repeated string auth_services = 1;

  // label is the routing label for the physical service that hosts this S2S
  // interface. Used for vservice routing tables where the interface is defined
  // in a vservice proto but hosted by a physical service (e.g. "stratum").
  string label = 3;
}

// ServiceC2SAnnotation declares a client-to-service gRPC service.
// Exposed through the gateway to end users.
// Per-RPC auth lives on spec.rpc: an RPC declares its own policy through
// RPC_FLAG_PUBLIC_NO_AUTH / RPC_FLAG_AUTH_ANY_USER / RPC_FLAG_AUTH_ENTITLED_USERS.
// Default policy: entitled users (gateway enforces entitlements).
message ServiceC2SAnnotation {
  // auth_entitled_users: users with matching entitlements can call.
  // This is the default C2S policy; set explicitly when entitlement
  // checks are required for all RPCs in this service.
  bool auth_entitled_users = 3;

  // label is the routing label for the physical service that hosts this C2S
  // interface, the twin of (spec.service_s2s).label. A trait declares its
  // client-facing surface in its own proto and names the implementor here, so
  // the surface is not locked to the implementor's identity.
  //
  // The label names the HOST (whom the gateway dials). The AUDIENCE the
  // gateway checks the caller's token against is the file's (spec.trait).name,
  // not this label: the audience is the contract, so a second implementor of
  // the same trait needs no client change. A label no loaded service serves
  // fails generation, and so does a label on a file that declares no trait.
  string label = 4;
}

// ServiceC2DAnnotation declares a client-to-daemon gRPC service.
// Served over local IPC between CLI processes and a daemon.
// No auth required — filesystem permissions are the security boundary.
message ServiceC2DAnnotation {
  // All c2d services are unauthenticated and localhost-only.
  //
  // socket_path is the Unix domain socket the daemon binds and clients dial.
  // Required — there is no default. A shared default path would collide between
  // daemons on the same host, so every c2d service declares its own path.
  string socket_path = 1;
}

// IdentitySpiffeResource declares that a string field holds a resource SPIFFE ID
// that tacplus must be able to CONSTRUCT from sibling fields (SPIFFE plan D5),
// via resource_spiffe_id(trust_domain, <namespace_field>, kind, <id_field>).
// Generation FAILS when the referenced sibling fields are absent, so a resource
// owner identity can never be hand-formatted or left underspecified.
//
//   string owner_spiffe = 2 [(spec.identity_spiffe_resource) = {
//     namespace_field: "tenant_namespace";
//     kind: "gitlab-event";
//     id_field: "event_id";
//   }];
message IdentitySpiffeResource {
  // namespace_field is the sibling field holding the namespace path.
  string namespace_field = 1;
  // kind is the resource kind segment (a constant, validated as a single segment).
  string kind = 2;
  // id_field is the sibling field holding the resource id.
  string id_field = 3;
}

// TokenMinterAnnotation marks a service as the cluster's token minter, declared
// EXPLICITLY rather than inferred from RPC signatures. The bootstrap token
// exchanger (service_im / client_im codegen) targets the service carrying this
// annotation, resolving its fully-qualified package.Service. Exactly one
// authoritative minter should be annotated.
message TokenMinterAnnotation {
  // proxy marks the client-reachable C2S front (e.g. gateway.Mint) that proxies
  // to the authoritative S2S minter. Clients with no S2S identity mint through
  // this proxy; services with an S2S identity call the authoritative minter
  // (proxy = false) directly.
  bool proxy = 1;
}

// SmbRoot selects which trust root backs an SMB service's member certificates.
enum SmbRoot {
  // SMB_ROOT_ISOLATED uses a self-signed per-SMB CA, scoped only to this SMB.
  SMB_ROOT_ISOLATED = 0;
  // SMB_ROOT_CLUSTER signs the per-SMB intermediate under the cluster CA.
  SMB_ROOT_CLUSTER = 1;
}

// SmbAnnotation marks a Service Mesh Blackbox service and selects its trust root.
// The default root is SMB_ROOT_ISOLATED.
message SmbAnnotation {
  SmbRoot root = 1;
}

// SmbAuthorityAnnotation marks the consumer service that issues per-SMB CAs and
// member certs for spec.smb services (SPIFFE plan D7), declared
// EXPLICITLY rather than inferred. tacplus resolves the fully-qualified
// package.Service carrying this annotation as the SMB cert authority and fails
// generation if any spec.smb service exists with no authority declared. tacplus
// generates the authority contract and the SMB service's client seam; the
// designated consumer service implements the server side (CA keypair custody,
// member-cert signing, rotation). Exactly one authority should be annotated.
message SmbAuthorityAnnotation {
}

// MethodS2SAnnotation overrides service-level defaults for a single S2S RPC.
// Only valid on methods within a service_s2s service.
message MethodS2SAnnotation {
  // auth_services overrides the service-level default for this method.
  repeated string auth_services = 1;

  // auth_disabled: this RPC handles its own authentication internally.
  // The caller interceptor skips this RPC entirely. Used for bootstrap
  // bootstrap token-minting RPCs where callers authenticate via
  // credentials in the request body (cred pair JWT), not via bearer token.
  bool auth_disabled = 2;
}

// MethodC2SAnnotation overrides service-level defaults for a single C2S RPC.
// Only valid on methods within a service_c2s service.
message MethodC2SAnnotation {
  // auth_disabled: no token required for this RPC.
  // Used for public endpoints like OIDC discovery and JWKS.
  bool auth_disabled = 1;

  // auth_any_user: any authenticated user can call this RPC
  // (no entitlement check). Used for user-facing endpoints where
  // any valid token is sufficient (e.g., token exchange, event streams).
  bool auth_any_user = 2;

  // target_namespace_field names the request field whose string value carries
  // the target namespace path (e.g. "/io/example/tenant"). When set, the C2S
  // authorizer enforces the level-or-below rule: the caller's namespace (from
  // the bearer token's `namespace` claim) must equal the target namespace or
  // be a strict path-segment ancestor of it. The field must exist on the
  // request message and be of type string.
  //
  // Use the proto field name (snake_case as declared), e.g. "tenant_namespace".
  // Leave unset for RPCs whose target is implicit (e.g. List* methods that
  // scope the response to the caller's subtree at the handler).
  string target_namespace_field = 5;
}

// RpcPrincipal declares WHO calls an RPC: a user identity, a service identity,
// or a model acting through a generated MCP tool surface. They are mutually
// exclusive, so this is an enum rather than a flag. Every spec.rpc must set it —
// there is no safe default, because either wrong answer is a silent
// authorization bug rather than a loud failure.
enum RpcPrincipal {
  RPC_PRINCIPAL_UNSPECIFIED = 0;
  // RPC_PRINCIPAL_USER: the caller acts as a user identity. Internally that is
  // a client calling as a given user; externally it is the actual user.
  RPC_PRINCIPAL_USER = 1;
  // RPC_PRINCIPAL_SERVICE: the caller acts as a service identity.
  RPC_PRINCIPAL_SERVICE = 2;
  // RPC_PRINCIPAL_MCP: this RPC is declared as an MCP tool rather than a gRPC
  // call. tacplus generates the tool schema and a handler interface method the
  // service implements by hand; it maps the tool to no gRPC RPC of its own.
  // Being a value of this enum rather than a flag is what makes "MCP tool" and
  // "gRPC call" 1:1 exclusive by construction: an rpc block holds one principal,
  // so a service wanting both surfaces for related functionality declares two
  // rpcs. Authorization is unchanged — flags / auth_services /
  // target_namespace_field mean the same thing against whatever Caller the MCP
  // session captured at handshake as they do against a gRPC caller.
  //
  // Streaming is a hard generation failure on this principal: the tool-call wire
  // format has no representation for a stream. A handler is free to drive a
  // Watch internally and fold it into one response.
  RPC_PRINCIPAL_MCP = 3;
}

// RpcExposure declares WHERE an RPC is reachable from. Also mutually
// exclusive, so also an enum. Unlike principal it has a safe default:
// forgetting it under-exposes the RPC, which fails loudly at call time rather
// than silently widening the surface.
enum RpcExposure {
  // RPC_EXPOSURE_INTERNAL: reachable only from inside the cluster boundary.
  RPC_EXPOSURE_INTERNAL = 0;
  // RPC_EXPOSURE_EXTERNAL: reachable from outside the cluster boundary.
  RPC_EXPOSURE_EXTERNAL = 1;
}

// RpcFlag carries the non-exclusive protocol properties of an RPC — the
// things that are independent of principal and exposure and of each other, so
// an RPC may carry any combination of them (including none).
enum RpcFlag {
  RPC_FLAG_UNSPECIFIED = 0;
  // RPC_FLAG_PUBLIC_NO_AUTH: this RPC is a public endpoint that requires no
  // caller token at all (OIDC discovery, JWKS). Nothing authenticates the
  // caller, because there is nothing to authenticate.
  RPC_FLAG_PUBLIC_NO_AUTH = 1;
  // RPC_FLAG_AUTH_ANY_USER: any authenticated user may call, with no
  // entitlement check (e.g. token exchange, event streams).
  RPC_FLAG_AUTH_ANY_USER = 2;
  // RPC_FLAG_AUTH_ENTITLED_USERS: only users holding a matching entitlement
  // may call. This is today's default policy for user-facing RPCs.
  RPC_FLAG_AUTH_ENTITLED_USERS = 3;
  // RPC_FLAG_SELF_AUTHENTICATES: this RPC carries no bearer token because it
  // authenticates the caller from the request body itself (bootstrap token
  // minting, cred-pair JWT). The caller interceptor skips it; the handler does
  // the authentication. Distinct from RPC_FLAG_PUBLIC_NO_AUTH: the caller is
  // still authenticated, just not by the token path.
  RPC_FLAG_SELF_AUTHENTICATES = 4;
}

// RpcAnnotation declares an RPC's call surface on two independent axes plus a
// set of non-exclusive protocol flags. It is per-RPC: the axes are properties
// of the call, not of the service that happens to host it.
//
// Example: option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE};
// Example: option (spec.rpc) = {
//            principal: RPC_PRINCIPAL_USER,
//            exposure: RPC_EXPOSURE_EXTERNAL,
//            flags: [RPC_FLAG_AUTH_ENTITLED_USERS]
//          };
message RpcAnnotation {
  // principal is required; RPC_PRINCIPAL_UNSPECIFIED is not a valid declaration.
  RpcPrincipal principal = 1;
  // exposure defaults to RPC_EXPOSURE_INTERNAL.
  RpcExposure exposure = 2;
  // flags is an unordered set; RPC_FLAG_UNSPECIFIED is not a valid entry.
  repeated RpcFlag flags = 3;

  // auth_services lists the service identities allowed to call this RPC.
  // ["*"] = any authenticated service. Only meaningful when principal is
  // RPC_PRINCIPAL_SERVICE. Per-RPC: two RPCs of one service may legitimately
  // admit different callers.
  repeated string auth_services = 4;

  // target_namespace_field names the request field whose string value carries
  // the target namespace path (e.g. "/io/example/tenant"). When set, the
  // authorizer enforces the level-or-below rule: the caller's namespace (from
  // the bearer token's `namespace` claim) must equal the target namespace or
  // be a strict path-segment ancestor of it. The field must exist on this
  // RPC's request message and be of type string.
  //
  // Use the proto field name (snake_case as declared), e.g. "tenant_namespace".
  // Leave unset for RPCs whose target is implicit (e.g. List* methods that
  // scope the response to the caller's subtree at the handler). Under
  // RPC_FLAG_AUTH_ANY_USER this instead holds an absolute namespace literal.
  string target_namespace_field = 5;

  // mcp_tool_name overrides the generated MCP tool name for a
  // RPC_PRINCIPAL_MCP rpc. Leave it unset: the default is the RPC name in MCP
  // naming convention (snake_case), and the tool description is the rpc's own
  // leading // doc comment, so neither is a second surface that can drift from
  // the real one. Set it only for the rare RPC whose name does not make a good
  // tool name. Must be snake_case ([a-z][a-z0-9_]*), and is only meaningful on
  // RPC_PRINCIPAL_MCP — declaring it elsewhere fails generation rather than
  // being silently ignored.
  string mcp_tool_name = 6;
}

// CollectionMode declares how a multi-result read behaves. See docs/API.md.
// A read returning more than one result must declare exactly one mode; an
// unbounded SNAPSHOT is a contradiction (if it is unbounded, it is a WATCH).
enum CollectionMode {
  COLLECTION_MODE_UNSPECIFIED = 0;
  // SNAPSHOT: a finite point-in-time set that terminates. Requires max_items.
  // tacplus derives the delivery tier (inline / accumulated-stream / cursor)
  // from max_items and the response's max element size.
  COLLECTION_MODE_SNAPSHOT = 1;
  // WATCH: an open-ended, change-driven stream (snapshot-then-deltas). Forbids
  // max_items; uses a bounded replay ring (replay_depth) for resume.
  COLLECTION_MODE_WATCH = 2;
  // PAGE: a client-driven, resumable, windowed GET (unary). The caller pages
  // through a finite set with an opaque keyset page_token over order_by; each
  // page is bounded by page_size (capped at the trust-tier ceiling). Forbids
  // max_items/replay_depth. See archive/RPC_PATTERNS_AND_VERBS_PLAN.md §4.
  COLLECTION_MODE_PAGE = 3;
}

// MethodCollection marks an RPC as a collection-returning read and declares its
// shape. The author declares intent plus a bound; tacplus derives transport,
// tiering, flow control, and lifecycle. See docs/API.md for the full model.
message MethodCollection {
  // mode is required: SNAPSHOT (finite) or WATCH (open-ended).
  CollectionMode mode = 1;

  // order_by names the response fields that define a stable total order.
  // Required for both modes (pagination cursors and the snapshot/delta boundary
  // are only coherent over a stable order). tacplus appends a unique tiebreaker
  // if these are not already total.
  repeated string order_by = 2;

  // max_items is the required, positive, finite item cap for SNAPSHOT reads.
  // It is the routing key: tacplus computes max_items * max_item_bytes to pick
  // the delivery tier. Forbidden on WATCH. Zero/unset on SNAPSHOT is an error.
  uint32 max_items = 3;

  // replay_depth is the WATCH replay-ring depth (count of retained changes).
  // Optional; defaults to a platform constant. Forbidden on SNAPSHOT.
  uint32 replay_depth = 4;

  // default_page_size is the PAGE per-page window used when the request omits
  // page_size. Required positive on PAGE; must be <= the trust-tier ceiling.
  // Forbidden on SNAPSHOT/WATCH. PAGE only.
  uint32 default_page_size = 5;
}

// ServiceEventAnnotation declares that a state service's topic/queue RPCs
// are accessible to other services (S2S only, like service_state).
message ServiceEventAnnotation {
  // label is the routing label for service resolution (e.g. "eventbus").
  string label = 1;
  // export makes this event topic available for RO import by other services.
  bool export = 3;
}

// ConditionalRequirement defines a conditional requirement for a field.
// The field is required when a sibling field equals a specific value.
message ConditionalRequirement {
  // field is the sibling field name (snake_case) to check
  string field = 1;
  // value is the enum value name or string to compare against
  string value = 2;
}

extend google.protobuf.FieldOptions {
  // Validates that a field has a value
  // For scalar/string fields: must not be empty/zero value
  // For repeated fields: must have at least one element
  bool assert_required = 60001;
  IpAddrTypes assert_ipaddr_type = 60002;
  EncType assert_enc_type = 60003;
  bool assert_net_port = 60004;

  // URL/URI validation
  UrlScheme assert_url = 60005;

  // Email validation
  bool assert_email = 60006;

  // FQDN validation
  bool assert_fqdn = 60007;

  // Duration/Timeout validation
  DurationType assert_duration = 60008;
  int64 assert_duration_min = 60009;
  int64 assert_duration_max = 60010;

  // Listen address validation (host:port format)
  bool assert_listen_addr = 60015;

  // Base64 validation
  bool assert_base64 = 60016;

  // was assert_min_length (60017) / assert_max_length (60018) — do not reuse.
  // Superseded by assert_min_size (60052) / assert_max_size (60039), which enforce
  // the same length bound on string/bytes fields (and count on repeated/map).

  // Enum non-zero validation (ensures enum is not 0/_UNDEFINED value)
  bool assert_enum_defined = 60019;

  // File path validation
  PathType assert_file_path = 60020;

  // Simple numeric comparisons (for most common cases)
  // These work with int32, int64, uint32, uint64 fields
  int64 assert_gt = 60021;  // greater than
  int64 assert_ge = 60022;  // greater than or equal
  int64 assert_lt = 60023;  // less than
  int64 assert_le = 60024;  // less than or equal

  // Complex numeric constraints (for advanced validation scenarios)
  NumericConstraint assert_numeric = 60025;

  // Floating-point constraints (for float and double fields)
  FloatConstraint assert_float = 60026;

  // Semantic version validation
  // Validates that a string follows semantic versioning format (e.g., "1.0.0", "v2.3.1")
  // Supports optional 'v' prefix and follows semver.org specification
  bool assert_semver = 60028;

  // Parameter key mapping for FromMap generation
  // Explicitly maps this field to a specific enum value for parameter parsing
  // Example: [(consts.param_key) = "TOKEN_PARAM_KEY_CLIENT_ID"]
  string param_key = 60029;

  // Conditional requirement: this field is required when another field equals false
  // Specifies the name of a boolean field that, when false, makes this field required
  // Example: [(consts.required_if_false) = "disable_tls"] means this field is required when disable_tls is false
  string required_if_false = 60030;

  // Conditional requirement: this field is required when another field equals true
  // Specifies the name of a boolean field that, when true, makes this field required
  // Example: [(consts.required_if_true) = "enable_cors"] means this field is required when enable_cors is true
  string required_if_true = 60031;

  // Host validation (IP address OR FQDN)
  // Validates that a string is either a valid IP address (IPv4/IPv6) or a valid FQDN.
  // This is an OR check — the value must satisfy at least one of the two formats.
  // Use this for fields that accept a network host identifier.
  bool assert_host = 60032;

  // Field-level default value annotations.
  // Attaches a default constant directly to a field. The code generators will
  // emit a constant named DEFAULT_{FIELD_NAME_UPPER_SNAKE} in the constants output.
  // Example: int32 partition_count = 5 [(spec.default_int) = 271];
  //   -> generates: DEFAULT_PARTITION_COUNT = 271
  string default_string = 60033;
  int64  default_int    = 60034;
  double default_float  = 60035;
  bool   default_bool   = 60036;
  // was default_double — do not reuse 60049 (removed; use default_float for
  // all floating-point defaults, the parser always mapped it to default_float).

  // key provides a string identifier for mapping on Config fields.
  // Links a grpcserver.Config or statedb.Config field to its target service/state.
  // Example: statedb.Config state = 2 [(spec.key) = "BaseballState"];
  string key = 60037;

  // Conditional requirement: this field is required when another field equals a specific value.
  // Works with enum or string sibling fields.
  // Example: [(spec.required_if_eq) = {field: "action", value: "ACTION_PERMIT"}]
  ConditionalRequirement required_if_eq = 60038;

  // assert_max_size enforces a maximum length/count on string, bytes, repeated, and map fields.
  // For string/bytes: maximum byte length. Default 32,768 bytes (32 KB) when not set.
  // For repeated/map: maximum element count. Runtime default 1,024 elements when not set;
  // user protos are still linted to require explicit bounds unless exempt.
  // Use this to override the default for fields that need more or less capacity.
  uint32 assert_max_size = 60039;

  // assert_min_size enforces a minimum length/count on string, bytes, repeated, and map fields.
  // For string/bytes: minimum byte length. For repeated/map: minimum element count.
  uint32 assert_min_size = 60052;

  // SQL statement validation: a syntactic sanity check, NOT an injection defense.
  // Checks that a string looks like a single statement of the permitted type: it rejects a
  // few obvious tokens (semicolons, -- and /* comments, backslash escapes) and verifies the
  // leading keyword. It does NOT make an interpolated string injection-safe -- a permitted
  // SELECT can still carry a UNION/subquery payload, and other comment syntaxes (e.g. a
  // '#' line comment) are not rejected. Callers MUST use parameterized queries.
  // Example: string query = 1 [(spec.assert_sql) = SQL_PERMIT_SELECT];
  SqlPermit assert_sql = 60046;

  // References a file-level constant (int_const, string_const, float_const, bool_const)
  // as the default value for this field. The Defaults function will use the named constant
  // directly, so multiple fields can share the same default without duplicating values.
  // Example: int32 tcp_port = 5 [(spec.default_const) = "DEFAULT_PORT"];
  string default_const = 60047;

  // Default value for host.Host fields. Generates a Defaults() initialization
  // and a DEFAULT_{FIELD}_PORT constant.
  // Mirrors host.Host structure to avoid circular import with host.proto.
  DefaultHost default_host = 60048;

  // Statedb field indexing: marks a field for state-store index creation
  bool indexed = 50010;

  // Statedb index type hint for indexed fields
  string index_type = 50011;  // "HASH", "SORTED", "BITMAP"

  // 50012 was (spec.consistency) (ConsistencyModel) — removed; every message-typed
  // boundary is convergent (stored independently, lockless LWW/append-only). Do not reuse 50012.

  // Statedb private: field can never be accessed by other services (owner RW only)
  bool private = 50013;

  // state_import declares that this field's value comes from another service's
  // exported state. This is the canonical source for read-only cross-service
  // state imports; the imported root is derived from "package.StateName.field".
  // The projection currently supports singular message fields.
  // Example: [(spec.state_import) = "football.FootballState.roster"];
  string state_import = 50014;

  // queue marks a state root field as a FIFO queue.
  // One consumer receives each item. Operations: offer, poll, peek, size.
  // Example: TaskItem task_queue = 3 [(spec.queue) = true];
  bool queue = 50015;

  // priority_queue marks a state root field as a priority queue.
  // Value is the name of the field used for priority ordering (e.g., "severity").
  // Items consumed in priority order (highest first).
  // Example: AlertItem alert_queue = 4 [(spec.priority_queue) = "severity"];
  string priority_queue = 50016;

  // topic marks a state root field as a pub/sub topic.
  // Every subscriber receives every message. Operations: publish, subscribe.
  // Example: EventData event_stream = 5 [(spec.topic) = true];
  bool topic = 50017;

  // leader marks a queue, topic, or priority_queue field as requiring leader election.
  // When set, the generated code automatically manages election, lease renewal, and
  // watch streams. Write operations (Offer/Publish) are gated on leader status.
  // The hand-written code must implement a leader handler callback.
  // Example: TaskItem task_queue = 3 [(spec.queue) = true, (spec.leader) = true];
  bool leader = 50018;

  // NOT IMPLEMENTED. Statedb storage: number of synchronous backups for this
  // boundary. No generator reads this; generation REJECTS it rather than accept a
  // durability intent tacplus does not honour (GEN-ANN-1).
  int32 sync_backup_count = 50020;

  // NOT IMPLEMENTED. Statedb storage: number of asynchronous backups for this
  // boundary. No generator reads this; generation REJECTS it (GEN-ANN-1).
  int32 async_backup_count = 50021;

  // NOT IMPLEMENTED. Statedb eviction: which entries to evict when max_size is
  // reached. No generator reads this; generation REJECTS it (GEN-ANN-1).
  EvictionPolicy eviction_policy = 50022;

  // Statedb eviction: maximum number of entries (or heap metric) before eviction begins.
  // Default: 0 (no limit).
  int32 eviction_max_size = 50023;

  // NOT IMPLEMENTED. Statedb eviction: what the eviction_max_size limit refers
  // to. No generator reads this; generation REJECTS it (GEN-ANN-1).
  MaxSizePolicy eviction_max_size_policy = 50024;

  // NOT IMPLEMENTED. Statedb eviction: time-to-live for entries in seconds. No
  // generator reads this; generation REJECTS it, because a boundary that silently
  // never expires anything is the failure it was meant to prevent (GEN-ANN-1).
  // For per-entry expiry use (spec.epoch_expiration) on the collection item.
  int64 eviction_ttl_seconds = 50025;

  // NOT IMPLEMENTED. Statedb eviction: maximum idle time for entries in seconds.
  // No generator reads this; generation REJECTS it (GEN-ANN-1).
  int64 eviction_max_idle_seconds = 50026;

  // epoch_expiration marks an int64 field as a Unix epoch expiration timestamp (seconds).
  // Collections only: 0 = no expiration; > 0 must be future and within 1 year.
  // TTL = epoch - now at write time; the state store auto-removes the entry on expiry.
  // Placement validation: a scalar state-root field carrying this annotation is
  // REJECTED at generation time. CARVE-OUT (accepted-and-ignored, not validated):
  // an int64 inside a message used only as a SINGLETON boundary — detecting that
  // needs whole-graph collection-usage analysis and would false-reject item types
  // shared between collection and singleton uses (e.g. jwk.proto JWK.exp).
  bool epoch_expiration = 50027;

  // persistence marks a graph boundary (singleton, collection, map) for durable storage.
  // When true, the cluster persists this boundary's data across restarts.
  // Can only be set on message-typed boundary fields.
  // Cannot be set on queues, topics, or priority queues.
  bool persistence = 50028;

  // 50030 was (spec.boundary_perms) (per-boundary RO/RW/WORM override) — removed with
  // the state_perms permission axis. Do not reuse 50030.

  // refresh_on_miss names the message type used as the lookup request
  // for cache-miss-triggered refresh. When set, tacplus generates a
  // Lookup{FieldName} RPC on the state service.
  // The implementation checks the boundary for a match, refreshes from
  // the external source on miss, and returns the updated boundary value.
  // Only valid on message-typed boundary fields.
  // Cannot combine with queue/topic/priority_queue.
  string refresh_on_miss = 50031;

  // command marks this field as a command RPC on the state service.
  // The field type is the request message; the response is always google.protobuf.Empty.
  // Commands are mutations. Use boundary_callers to restrict which services can
  // invoke the command cross-namespace.
  bool command = 50032;

  // view_sources marks a field as a read-only view over multiple collection boundaries.
  // Each entry is the field name of a source collection within the same service_state.
  // The view unions all source collections into a single read-only boundary.
  //
  // Generated RPCs: Get, GetAll, Watch, KeySet, Size, ContainsKey (read-only subset).
  // No mutator RPCs (Put, Set, Delete, Remove, Clear) are generated.
  //
  // The indexed field (kid, node_id, etc.) must be unique across all source collections.
  // Writes to a source collection that would violate cross-source uniqueness are rejected.
  //
  // Requirements:
  //   - The field must be repeated.
  //   - All source fields must be collections of the same message type.
  //   - At least two source fields must be specified.
  //   - The field is a view (not stored): it aggregates the source collections.
  //
  // Example:
  //   repeated ManagedJwk config_keys = 1;
  //   repeated ManagedJwk dynamic_keys = 2;
  //   repeated ManagedJwk all_keys = 3 [
  //     (spec.view_sources) = "config_keys",
  //     (spec.view_sources) = "dynamic_keys"
  //   ];
  repeated string view_sources = 50033;

  // boundary_callers lists services allowed to call this boundary cross-namespace.
  // Applies to queue (offer), topic (publish), and command (exec) boundaries.
  // Example: TaskItem task_queue = 3 [(spec.queue) = true, (spec.boundary_callers) = "woodstock"];
  repeated string boundary_callers = 50036;

  // view_member registers this collection as a contributing source to one or
  // more named cross-boundary views. All collections sharing a view_member
  // value are aggregated by the cluster into that read-only view service. A
  // collection may belong to multiple views (e.g. an internal-signing-key
  // collection that feeds both "JwkVerifyingKeysView" for internal verifiers
  // and "PublicJwksView" for the gateway's public JWKS).
  //
  // Each value must match a view service defined in the embedded protos
  // (e.g., "JwkVerifyingKeysView" from sys/jwkview.proto).
  //
  // Requirements:
  //   - The field must be a repeated (collection) boundary.
  //   - All members of the same view must have the same message type.
  //   - The message type must have an (spec.indexed) field for entry keying.
  repeated string view_member = 50035;

  // instance_keyed: server extracts instance_id from the caller's token
  // and uses "service_id@instance_id" as the entry key. The publisher
  // sees a singleton Set API (no key param). Consumers see a collection.
  bool instance_keyed = 50034;

  // store_key marks a field as the entry key for a service_store message.
  // Exactly one field per service_store message must have this annotation.
  // The field type must be string. The key is used as the entry key.
  bool store_key = 50037;

  // quorum_write marks a state field as requiring write quorum: the write is
  // acked only after the value is durable on (spec.min_durable_copies) distinct
  // nodes. Only valid on fields within a service_state or service_store message.
  //
  // BELOW THAT THRESHOLD THE WRITE IS REJECTED, NOT ACKED. This comment used to
  // read "on a single-node cluster, writes succeed immediately (no quorum
  // possible)" — an implicit auto-degrade on cluster size. That was retired
  // (ruling, 2026-08-29) because a production cluster that has lost two members
  // is indistinguishable from a laptop, so the degrade silently converts the
  // durability guarantee into its absence exactly when it matters. The threshold
  // is now an explicit knob: see (spec.min_durable_copies) below, which a local
  // dev tree sets to 1 DELIBERATELY.
  bool quorum_write = 50038;

  // min_durable_copies is how many distinct nodes must hold a value durably
  // before a (spec.quorum_write) field's write is acked. Default 2 when unset;
  // 1 is the deliberate single-node development setting.
  //
  // A write that cannot reach this many durable copies is REJECTED with
  // FAILED_PRECONDITION before any local effect — it never acks-then-hopes. That
  // is the whole point of the knob: the alternative (degrade to whatever the
  // cluster can manage) is the failure the threshold exists to catch.
  //
  // Only valid on a field that also carries (spec.quorum_write): a durability
  // threshold on a field with no quorum requirement is a knob nothing reads, and
  // generation REJECTS it rather than accept an intent tacplus does not honour
  // (ValidateMinDurableCopiesAnnotations).
  //
  // Values below 1 are a generation error. A value of 1 disables the
  // multi-node requirement and is legal, loudly, for local development.
  int32 min_durable_copies = 50040;

  // collected_health marks a state boundary for Sentinel health collection.
  // Sentinel discovers instances via ServiceHealthState, calls a generated
  // GetXxx RPC on the source service, and writes results to state.
  // Singular fields → query ONE node. Repeated fields → query ALL nodes.
  // Per-node (repeated) entries are keyed by instance_id and auto-evicted
  // when Sentinel stops updating them (use eviction_ttl_seconds).
  bool collected_health = 50039;

  // 60050 retired (graph_index — graph store support removed 2026-08-25).

  // projection_source maps a projection field to its source path on the event message.
  // Used on fields within messages annotated with (spec.timeseries_type)
  // that have a source set. Uses dot notation for
  // nested/oneof field access.
  // Examples:
  //   "agent_id"              — top-level field on the source event
  //   "tool_use.tool_name"    — field inside a oneof/nested payload
  //   "tool_use.duration_ms"  — nested int64 field
  string projection_source = 60063;

  // projection_record_key marks the projection field that carries the SOURCE
  // RECORD's key. tacplus auto-injects this field (or marks the existing one) on
  // every timeseries projection so the projection query can return record
  // keys — the record store federates into a projection, gets record keys, and hydrates the
  // full records from the record_store. Exactly one field per projection carries it.
  bool projection_record_key = 60081;

  // 60064 retired (graph_edge — graph store support removed 2026-08-25).

  // assert_invariant declares a formal invariant for this field.
  // The expression is a boolean predicate in the target language's syntax.
  // For Rust: used as kani::assume() in proof harnesses and debug_assert! in validate().
  // For Java: emitted as //@ invariant ... (JML).
  // Use for cross-field relationships that can't be expressed as single-field constraints.
  // Example: string token = 1 [(spec.assert_invariant) = "self.ttl > 0 && self.ttl <= 86400"];
  string assert_invariant = 60053;

  // ── Store Annotations ─────────────────────────────────────────────────────
  // These field-level annotations mark fields for service-specific store
  // projections.

  // cache marks this field for projection into the hot cache.
  // When true, this field is included in the cache entry.
  // Example: string display_name = 3 [(spec.cache) = true];
  bool cache = 60054;

  // timeseries marks this field for projection into the timeseries store.
  // When true, this field is included in the timeseries materialized view.
  // Example: int64 first_seen_ms = 5 [(spec.timeseries) = true];
  bool timeseries = 60055;

  // archive marks this field for projection into cold storage.
  // When true, this field is included in the cold-storage schema.
  // Example: bytes raw_payload = 20 [(spec.archive) = true];
  bool archive = 60056;

  // 60057 retired (spec.sql — a raw named SQL query embedded in the contract).
  // Removed as a store-coupling boundary violation: tacplus is store-neutral and
  // must not carry backend query syntax. It was never consumed by any generator.
  // Store services own their own query surfaces (see the RecordMap query plane).
  // (Distinct from spec.assert_sql, which is a store-neutral syntactic SQL sanity check
  // on user-provided strings -- not an injection defense -- and is retained.)

  // JSON key override: specifies the output key used in JSON serialization.
  // The generated JSON helpers use this instead of the proto field name.
  // Use when the proto field was renamed to avoid language keyword conflicts
  // but the JSON wire format must remain unchanged.
  // Example: int64 reset_at = 4 [(spec.json_key) = "reset"];
  string json_key = 60061;

  // JSON aliases: additional keys accepted during JSON deserialization.
  // Used alongside json_key and the proto field name for flexible input parsing.
  // Example: string callback_url = 5 [(spec.json_aliases) = "callbackUrl"];
  repeated string json_aliases = 60062;

  // 60065 retired (graph — graph store support removed 2026-08-25).

  // ── Timeseries Projection Annotations ────────────────────────────────────────
  // Controls how individual fields map to timeseries columns. Fields without
  // this annotation are omitted — timeseries projection is opt-in.
  // See TimeseriesFieldOption for detailed documentation.
  //
  // Example:
  //   string session_id = 1 [(spec.timeseries_column) = {order_key: 1}];
  //   int64 timestamp_ms = 2 [(spec.timeseries_column) = {order_key: 2, partition_key: true}];
  //   string event_type = 3 [(spec.timeseries_column) = {cardinality_hint: CARDINALITY_LOW}];
  TimeseriesFieldOption timeseries_column = 60066;

  // ----- SPIFFE identity annotations (plan D5) -----
  // These give tacplus enough information to VALIDATE and CONSTRUCT SPIFFE
  // identities from declared proto fields. They do not replace
  // method_c2s.target_namespace_field; they classify identity-bearing fields so
  // generated code routes them through sys/spiffe instead of hand-formatting.

  // identity_namespace: this string field holds an authorization-tree namespace
  // path; generated code normalizes it via normalize_namespace before use.
  bool identity_namespace = 60075;

  // identity_subject: this string field holds a stable principal subject id
  // (the `sub`), not a full SPIFFE URI.
  bool identity_subject = 60076;

  // identity_spiffe_subject: this string field holds a full SUBJECT SPIFFE ID,
  // constructed/validated via sys/spiffe (durable subject key, e.g. workload).
  bool identity_spiffe_subject = 60077;

  // identity_spiffe_resource: this string field holds a RESOURCE SPIFFE ID that
  // tacplus constructs from sibling fields; see IdentitySpiffeResource.
  IdentitySpiffeResource identity_spiffe_resource = 60078;

  // query_field: marks this record field as a typed filter criterion for the
  // generated RecordMap query plane (Open<T>Query / Refine<T>). tacplus emits a typed
  // <T>Filter message from the queryable fields. EQ → `optional <type> <name>`;
  // RANGE → `optional <type> <name>_from` + `optional <type> <name>_to` (ordered
  // fields, e.g. int64 timestamp_ms). The store transforms the filter into its
  // query; tacplus knows only the shape, never the query→SQL transform.
  QueryFieldOption query_field = 60080;

  // redact: marks this record field as REDACTABLE AT EGRESS. Records are stored
  // raw; the record store applies the field's mode when the caller's entitlements
  // do not reveal it (at Sample/Pull only — never baked into stored state). tacplus
  // generates a typed Sanitize<T>(record, <T>Entitlement, hmacKey) transform; the
  // store computes the entitlement (mechanism in tacplus, policy in service).
  RedactOption redact = 60082;

  // ----- Principal annotations (§4b: the principal is a property of the type) -----
  // These two say WHERE the caller's principal lives, once, on the type. The
  // generated service wrapper then owns the stamp, the forgery refusal and the
  // read filter, so no handler hand-writes any of the three. They are stronger
  // than (spec.identity_subject), which only classifies a field as holding *a*
  // subject id: these bind the field to the *authenticated caller's* subject.

  // principal: this REQUEST string field carries the caller's principal. The
  // generated wrapper resolves the authenticated caller's subject and then:
  //   - empty  -> stamps the subject into the field before the handler runs;
  //   - equal  -> accepts unchanged;
  //   - differs-> refuses with INVALID_ARGUMENT (never silently overwritten).
  // An unauthenticated caller on a principal-bearing RPC is UNAUTHENTICATED.
  // Example: string created_by = 2 [(spec.principal) = true];
  bool principal = 60083;

  // store_principal: this RECORD string field holds the row's owning principal.
  // The generated wrapper filters every repeated field of that record type in a
  // response down to rows the caller owns, so a read plane cannot return one
  // principal's rows to another. Egress-side only, exactly like (spec.redact):
  // rows are stored raw and the filter is applied on the way out.
  // Example: string created_by = 4 [(spec.store_principal) = true];
  bool store_principal = 60084;

  // identity_spiffe_actor: this OPTIONAL string field holds the delegated-
  // mint actor's identity, stamped by EventBus from the token's `act` claim
  // (JWT_PAYLOAD_TYPE_ACT) at publish time — the delegate/agent that made
  // the call on the user's behalf, distinct from (spec.identity_spiffe_subject)
  // which is always the authenticated caller (the user, when delegated).
  // Unset when the token carries no `act` claim (the ordinary, non-delegated
  // case). This field is provenance metadata on the event envelope ONLY —
  // it is never a (spec.principal)/(spec.store_principal) field and must
  // never be wired into either.
  bool identity_spiffe_actor = 60085;

  // store_epoch: this RECORD int64 field holds the row's STORE EPOCH — Unix
  // milliseconds of the row's LAST WRITE, stamped by the generated wrapper.
  //
  // Same doctrine as (spec.principal)/(spec.store_principal) above: the
  // annotation says WHERE the value lives, once, on the type; the generated
  // wrapper owns the stamp so no handler hand-writes it.
  //
  // WHERE THE STAMP HAPPENS. A record has no write RPC — it reaches the store
  // on the store's EventBus subscription (spec.record implies spec.event), so
  // the stamping seam is the generated service manager's subscription dispatch,
  // not a request wrapper. There is therefore no caller to refuse: the store's
  // clock is stamped over whatever arrived, UNCONDITIONALLY, which is a
  // stronger guarantee than a refusal (the value cannot be caller-influenced at
  // all) and does not drop the record. A producer that sets the field is not
  // erroring, it is writing into a slot the store owns.
  //
  // The store epoch is what the residency window is measured against, and the
  // predicate a two-leg query would partition on: memory serves
  // epoch >= now - window, the disk leg gets epoch < now - window bolted onto
  // the filter. It is therefore also a RANGE query criterion in the generated
  // filter, so the field carries (spec.query_field) = {op: QUERY_OP_RANGE}.
  //
  // NOT (spec.epoch_expiration) (above, statedb per-entry TTL) and NOT
  // (spec.record).retention.timestamp_field (the author's business timestamp,
  // which retention measures from). Three different clocks; only this one is
  // store-owned.
  bool store_epoch = 60086;

  // ----- Namespace isolation annotations (the generated tenant backstop) -----
  // The principal pair above binds a field to the caller's SUBJECT. These two
  // are the same two mechanisms bound to the caller's NAMESPACE claim instead,
  // and they exist for a different guarantee: not "these are my rows" but "this
  // is my tenant". The service's own query logic is expected to be correct; the
  // generated code is the backstop that makes a cross-tenant leak structurally
  // impossible even when it is not.
  //
  // EXACT MATCH, NOT CONTAINMENT. (spec.method_c2s).target_namespace_field
  // enforces the ADMINISTRATIVE "level-or-below" rule over the tenant tree.
  // Data isolation is plain equality instead: users and their data always land
  // in a leaf, so a caller at /acme sees rows stamped /acme and no others. Root
  // ("/") is an ordinary namespace under that rule, not a wildcard — platform
  // data is simply data namespaced at root, visible only to a caller whose own
  // namespace claim is exactly root.

  // namespace: this REQUEST string field carries the caller's namespace. The
  // generated wrapper resolves the authenticated caller's namespace claim and
  // then, exactly as (spec.principal) does for the subject:
  //   - empty  -> stamps the namespace into the field before the handler runs;
  //   - equal  -> accepts unchanged;
  //   - differs-> refuses with INVALID_ARGUMENT (never silently overwritten).
  // An unauthenticated caller on a namespace-bearing RPC is UNAUTHENTICATED.
  // Example: string namespace = 2 [(spec.namespace) = true];
  bool namespace = 60087;

  // store_namespace: this RECORD string field holds the row's owning namespace.
  // MANDATORY: every (spec.record)-annotated message must declare exactly one,
  // and generation FAILS for one that does not — the same posture the record
  // query plane's non-empty auth_services requirement already takes. An opt-in
  // isolation backstop is not a backstop; the annotation an author forgets is
  // exactly the record that leaks.
  //
  // The generated wrapper filters every repeated field of that record type in a
  // response down to rows whose stamped namespace EXACTLY equals the caller's.
  // Egress-side only, exactly like (spec.store_principal): rows are stored raw
  // and the filter is applied on the way out.
  //
  // A row that has to be filtered CRASHES THE PROCESS rather than failing the
  // one call. Reaching that line means the store handed the wrapper another
  // tenant's row, which multi-tenant tests are supposed to catch before release
  // and a canary is built to absorb; a crash-rate spike halts a rollout, where
  // a per-call error would be swallowed. Against a silent cross-tenant leak an
  // availability blip is the cheaper failure.
  // Example: string namespace = 5 [(spec.store_namespace) = true];
  bool store_namespace = 60088;

  // ----- Residency: the per-row gate on the type's eviction window -----

  // ejectionable: this RECORD field carries the row's own answer to "does the
  // residency window apply to me?". The field must be of type spec.Ejectionable
  // and a record declares at most one; ValidateEjectionableAnnotations refuses
  // anything else.
  //
  // A marker, like (spec.store_epoch) and (spec.store_namespace) above: the
  // annotation owns the LOCATION and nothing else. (spec.record).residency
  // declares the window for the TYPE; this names the field whose per-row value
  // decides whether that window is consulted for a given row. The two are
  // orthogonal the same way mutability is orthogonal to residency.
  //
  // UNSET IS NEVER-EVICT. An EJECTIONABLE_UNSPECIFIED row is not evicted, which
  // is exactly what RESIDENCY_HOT means and exactly what every record does
  // today. So this is additive: a record that declares no ejectionable field
  // keeps today's behaviour, and a record that declares one keeps it for every
  // row that leaves the field at zero. The safe direction for a marker an
  // author forgets is "keep the row"; the fail-silent alternative would drop
  // data.
  //
  // Only meaningful on a record that declares (spec.record).residency — there
  // is no window to gate otherwise, and declaring the gate anyway is a
  // GENERATION ERROR rather than an inert annotation, the same posture
  // ValidateResidencyAnnotations VAL-6 takes for a residency nothing reads.
  //
  // Example:
  //   spec.Ejectionable ejectionable = 6 [(spec.ejectionable) = true];
  bool ejectionable = 60089;
}

// QueryOp is the match kind for a (spec.query_field) record filter criterion.
enum QueryOp {
  QUERY_OP_UNSPECIFIED = 0; // treated as EQ
  QUERY_OP_EQ = 1;          // equality: optional <type> <name>
  QUERY_OP_RANGE = 2;       // inclusive range: optional <type> <name>_from/_to
}

// QueryFieldOption configures a record field as a RecordMap query filter criterion.
message QueryFieldOption {
  QueryOp op = 1;
}

// RedactMode selects the data-entitlement transform for a field on its way out
// of a service (egress-only, e.g. Sample/Pull). It expresses the four states of
// the data-entitlement lattice across two transform kinds (redact, anonymize)
// and two floors (hard "is-*", eligible "may-*"). Effective level per field is
// max(annotation floor, runtime entitlement) under pass-through < anonymize <
// redact — the runtime entitlement can only ratchet tighter, never loosen below
// the floor. The two "is-*" modes are the original unconditional behavior.
enum RedactMode {
  REDACT_MODE_UNSPECIFIED = 0;   // invalid — presence of the annotation implies a real mode
  REDACT_MODE_DROP = 1;          // HARD FLOOR redact: always cleared to zero        (is-redacted)
  REDACT_MODE_PSEUDONYMIZE = 2;  // HARD FLOOR anonymize: always keyed-HMAC pseudonym (is-anonymized)
  REDACT_MODE_MAY_REDACT = 3;    // ELIGIBLE redact: runtime entitlement decides      (may-be-redacted)
  REDACT_MODE_MAY_ANONYMIZE = 4; // ELIGIBLE anonymize: runtime entitlement decides   (may-be-anonymized)
}

// RedactOption configures a field (or, at message level via (spec.data_entitlement),
// a whole message default) with a data-entitlement mode.
message RedactOption {
  RedactMode mode = 1;
}

// ============================================================================
// Statedb Boundary Configuration
// ============================================================================

// ConsistencyModel was removed: the state backend supports only convergent
// (lockless, last-writer-wins / append-only) replication, so every message-typed
// boundary is stored independently and convergent. Boundary-ness is determined by
// the field being a message type — no consistency annotation is needed or accepted.
//   - Boundary name = "service_name+field_name+...n" (path through the state tree).
//   - Non-repeated boundaries are singletons: a single value, no entry key.
//   - Repeated boundaries require an (spec.indexed) field as the entry key
//     (validated at build time).

// EvictionPolicy determines which entries to evict when max_size is reached.
// Used as a field-level annotation on boundary fields and as a message-level
// default on state root messages.
enum EvictionPolicy {
  // EVICTION_POLICY_NONE disables eviction (default). Entries are never evicted by policy.
  EVICTION_POLICY_NONE = 0;

  // EVICTION_POLICY_LRU evicts least recently used entries.
  EVICTION_POLICY_LRU = 1;

  // EVICTION_POLICY_LFU evicts least frequently used entries.
  EVICTION_POLICY_LFU = 2;

  // EVICTION_POLICY_RANDOM evicts entries randomly.
  EVICTION_POLICY_RANDOM = 3;
}

// MaxSizePolicy determines what the eviction_max_size limit refers to.
enum MaxSizePolicy {
  // MAX_SIZE_POLICY_ENTRY_COUNT limits by total number of entries (default).
  MAX_SIZE_POLICY_ENTRY_COUNT = 0;

  // MAX_SIZE_POLICY_USED_HEAP_SIZE limits by heap memory used in bytes.
  MAX_SIZE_POLICY_USED_HEAP_SIZE = 1;

  // MAX_SIZE_POLICY_USED_HEAP_PERCENTAGE limits by percentage of heap memory used.
  MAX_SIZE_POLICY_USED_HEAP_PERCENTAGE = 2;

  // MAX_SIZE_POLICY_FREE_HEAP_PERCENTAGE evicts when free heap drops below percentage.
  MAX_SIZE_POLICY_FREE_HEAP_PERCENTAGE = 3;
}

// ============================================================================
// Service Deployment Configuration
// ============================================================================

// StatePermsMode was removed: state access is export/import only and is not
// governed by an RO/RW/WORM/CALL permission axis. Cross-namespace call gating on
// queue/topic/command boundaries is declared with (spec.boundary_callers).

// TlsKeyType specifies the key algorithm for auto-TLS certificate management.
enum TlsKeyType {
  // TLS_KEY_TYPE_NONE disables auto-TLS (default).
  TLS_KEY_TYPE_NONE = 0;
  // TLS_KEY_TYPE_ED25519 uses Ed25519 (OKP) keys.
  TLS_KEY_TYPE_ED25519 = 1;
  // TLS_KEY_TYPE_ECDSA uses ECDSA P-256 keys.
  TLS_KEY_TYPE_ECDSA = 2;
}

// StateAnnotation marks a message as a state root and references its backing store.
message StateAnnotation {
  // name is the state root name (e.g. "ClusterState", "AegisState").
  string name = 1;
  // label lists the routing labels for the backing stores this state root
  // routes to (e.g. ["state-store"], ["kernel", "edge"]). Every label must be
  // served by a loaded service; a label no service serves fails generation.
  repeated string label = 3;
  // auto_tls enables automatic TLS certificate lifecycle management.
  // When set, tacplus generates a bidi stream subscription to the certificate
  // authority service and a new_tls_cert Handler method for cert delivery.
  // The service generates keypairs locally; the certificate authority signs and
  // delivers certs, triggering renewal at half-life.
  TlsKeyType auto_tls = 4;
  // export makes this state root available for RO import by other services.
  // Without export, the state is private to the owning service.
  bool export = 5;
  // requires_artifact_on_write marks this state root as "the living side" —
  // user-owned/user-facing data whose mutation must leave a durable artifact.
  // When set, every WRITE-classified RPC (spec.internal/common/verbs registry)
  // on a non-synthesized service declared in the same package must be
  // accompanied by at least one (spec.record)-annotated message in that
  // package; a write RPC with no record in scope fails generation
  // (ValidateArtifactOnWrite). Control-plane/config state roots (kernel, opa,
  // sentinel, oauth, letsencrypt, operator) must NOT set this — it is only for
  // state that represents user-owned knowledge, not service configuration.
  bool requires_artifact_on_write = 6;
}

// ServiceStoreAnnotation marks a message as a durable key-value store.
// Unlike service_state (convergent, fan-out, Watch), service_store is:
//   - Write-with-quorum (writes acked only after replication to 2+ nodes)
//   - Read-on-demand (no Watch streams, no client-side caching)
//   - No boundary decomposition (the message IS the value)
// The store_key field annotation marks which field is the entry key.
// Access is via delegate pattern: services authenticate clients, then
// write through the backing service. External clients never write directly.
message ServiceStoreAnnotation {
  // label lists the routing labels for the backing stores this store routes to
  // (e.g. ["state-store"]). Every label must be served by a loaded service; a
  // label no service serves fails generation.
  repeated string label = 1;
}

// TimeseriesStoreAnnotation marks a service proto as a timeseries data store.
// The store receives its projection data by auto-subscribing to the EventBus
// topics that carry its projection sources; no mutation service is generated.
message TimeseriesStoreAnnotation {}

// RecordStoreAnnotation marks a service proto as the full-record store (stratum).
// Services with this annotation auto-subscribe to EventBus topics that publish
// the record types they store (currently spec.record). Hot/cold tiering is
// internal to the service.
message RecordStoreAnnotation {}

// ServiceHealthAnnotation declares a typed health message for a service.
// The annotated message MUST embed healthreport.ServiceInstanceHealth as field 1
// ("base"). The state store extracts .base for the generic health view and stores the
// full typed message per service (keyed by instance_id).
// Each node reports its own perspective of cluster health — Sentinel monitors
// consistency across perspectives and raises alarms on divergence.
message ServiceHealthAnnotation {}

// VServiceAnnotation declares a virtual service identity for a proto file.
// Virtual services have their RPCs hosted by a physical service (e.g., eventbus)
// but are authorized separately. The id is a stable field number for TokenEntitlements
// (use range 30+ to avoid collision with physical service IDs).
message VServiceAnnotation {
  // name is the canonical vservice name used as the entitlement key (e.g., "claudesensor").
  string name = 1;
  // id is the stable field number in TokenEntitlements for this vservice.
  int32 id = 2;
}

// TraitAnnotation declares a trait identity for a proto file.
// Traits carry the same identity shape as a vservice — a canonical name used as
// the entitlement key plus a stable TokenEntitlements field id — and are parsed
// into the same descriptor fields.
message TraitAnnotation {
  // name is the canonical trait name used as the entitlement key (e.g., "query").
  string name = 1;
  // id is the stable field number in TokenEntitlements for this trait.
  int32 id = 2;

  // host is the routing label of the physical service that implements this
  // trait's RPCs. It becomes the (spec.service_s2s)/(spec.service_c2s) label on
  // the emitted sibling services, so the gateway dials the host while callers
  // are still entitled against `name` — the audience is the contract, not the
  // implementor.
  string host = 3;

  // s2s_service and c2s_service name the sibling services the trait's plane is
  // emitted as. A service may declare only one caller surface
  // (ValidateServiceSurfaces), so one plane serving both peers and users is two
  // services. They are declared rather than derived from `name` so the emitted
  // identities are readable in the declaration instead of in generator source.
  //
  // s2s_service is required. c2s_service is OPTIONAL: leave it empty and the
  // trait hosts the peer half only — no client-facing sibling is emitted and the
  // plane contributes no grants to the c2s catalog. A service that wants its own
  // records readable by users declares (spec.record_read).c2s, which gives it a
  // scoped <Svc>Records plane instead of a share in this fleet-wide one.
  string s2s_service = 4;
  string c2s_service = 5;

  // auth_services lists the peer identities allowed to call the S2S half, the
  // per-RPC (spec.rpc).auth_services the emitted service carries. Declared here
  // rather than hardcoded in the generator: the platform generator must not
  // name an application service.
  repeated string auth_services = 6;
}

// ServiceAnnotation declares the owning service identity for a proto file.
message ServiceAnnotation {
  // name is the canonical service name (e.g. "identity", "gateway").
  string name = 1;
  // store declares this service as a backing store.
  // Other services reference it via StateAnnotation.label.
  bool store = 3;
  // config_store declares this service as THE backing store for auto-injected
  // per-service config state (the <Service>ConfigState messages tacplus injects
  // from (spec.grpc_config)). At most one service in a proto set may set it.
  // Distinct from store: store says "this service can back state", config_store
  // says which one config is routed to. Without it, a proto set with more than
  // one store has no non-arbitrary answer.
  bool config_store = 6;
  // gateway declares this service as a gateway (reverse proxy).
  // Changes TLS source to GatewayTlsState (public cert) instead of X509Mint (internal CA).
  // The generated run() watches GatewayTlsState for cert hot-reload instead of running
  // a TLS renewal loop.
  bool gateway = 4;
  // rest_dispatch generates REST→gRPC dispatch code for all C2S RPCs visible
  // to this service. The service acts as a reverse proxy, translating HTTP/JSON
  // requests into typed gRPC calls. Used by gateway and the CLI.
  bool rest_dispatch = 5;
  // accepted_audiences widens the set of token `aud` values this service's
  // generated Authorizer accepts, beyond the two it already derives: its own
  // service label, plus every vservice/trait it hosts (AcceptedAudiencesForHost).
  // Omitting it — which every service does today — leaves that derived set
  // exactly as it is, so this field is backward compatible by construction.
  //
  // Declaring an audience here does NOT grant anything. It only stops the
  // Authorizer rejecting a token that was correctly minted for that audience;
  // the caller must still be entitled to the RPC. Who may add an entry is not a
  // runtime question: this is a proto annotation under VCS and code review, the
  // same trust boundary as (spec.trait) or an entitlement declaration.
  repeated string accepted_audiences = 7;
}

// GrpcConfigAnnotation marks a message as a gRPC service's configuration.
// tacplus uses these to auto-generate a generated.Services message that aggregates all
// gRPC configs, plus per-service config state boundaries.
message GrpcConfigAnnotation {
  // service_name is the gRPC service name.
  string service_name = 1;
}

// ConfigSliceScope identifies the aggregate config message that receives a
// per-service config slice.
enum ConfigSliceScope {
  CONFIG_SLICE_SCOPE_UNSPECIFIED = 0;
  CONFIG_SLICE_SCOPE_TENANT = 1;
  CONFIG_SLICE_SCOPE_PROJECT = 2;
}

// ConfigSliceAnnotation declares one per-service config slice and its owner.
message ConfigSliceAnnotation {
  ConfigSliceScope scope = 1;
  string service_name = 2;
}

// StateImport is the legacy file-level mirror for field-level state_import
// declarations. The target state must have export=true on its service_state.
message StateImport {
  // source is "package.StateName" (e.g. "identity.Identity", "aegis.AegisState").
  string source = 1;
}

// OpaEvalAnnotation marks a message as an OPA policy evaluation input.
// tacplus generates a typed RPC on the opa service for each annotated message.
// The input message defines the evaluation parameters; the result message defines
// the typed output. Both must be in the same proto file.
// Example:
//   message EntitlementEvalInput {
//     option (spec.opa_eval) = {
//       entry_point: "data.entitlements.profiles"
//       result: "EntitlementEvalResult"
//     };
//     string email = 1;
//     repeated string claims = 2;
//   }
message OpaEvalAnnotation {
  // entry_point is the OPA policy path (e.g. "data.entitlements.profiles").
  string entry_point = 1;
  // result is the name of the result message in the same proto file.
  string result = 2;
}

// OpaImport declares a dependency on an OPA eval definition.
// Used as a file-level option so each proto package can declare which OPA
// evaluations it needs. tacplus generates a typed OpaEval client targeting
// the named physical service.
// Example:
//   option (spec.opa_import) = {source: "userentitlements.EntitlementEvalInput", service: "opa"};
message OpaImport {
  // source is "package.InputMessageName" (e.g. "userentitlements.EntitlementEvalInput").
  string source = 1;
  // service is the physical service that implements the OpaEval virtual service.
  // Required. Build fails if the target does not import sys/opalib.proto.
  string service = 2;
}

// GrpcS2SClient declares a service-to-service gRPC client dependency.
// Used as a file-level option to declare which S2S gRPC services this service calls.
// Proto package names are globally unique, so no file path is needed.
// tacplus resolves the package name to its proto file at build time.
// Example: option (spec.grpc_s2s_client) = {service: "identity.Mint"};
message GrpcS2SClient {
  // service is "package.ServiceName" (e.g. "identity.Mint").
  string service = 1;
}

// RecordRead declares that this service reads a (spec.record) type's STORED
// ROWS through the record query plane's S2S half.
//
// The USE half of the paired control whose grant half is
// (spec.record).s2s_read. See spec.record_read in the FileOptions block above
// for what it generates and why the transport dependency is implied rather than
// restated.
message RecordRead {
  // record is the fully-qualified record message name, "package.Message"
  // (e.g. "messaging.Message"). Proto package names are globally unique, so no
  // file path is needed; tacplus resolves the name to its declaring file.
  //
  // A name that resolves to no message, or to a message carrying no
  // (spec.record), is a hard generation failure — the same fail-loud posture
  // (spec.record).key already takes for a key naming a field that does not
  // exist.
  string record = 1;

  // c2s, when present, asks for a CLIENT-FACING read surface over this record's
  // rows, emitted into THIS service's own proto as a synthesized sibling
  // service (`<Service>Records`) carrying Get<T> and List<T>.
  //
  // Absent — which is every declaration that predates this field — the reader
  // gets the s2s typed reader and nothing else, byte for byte as before.
  //
  // The grant half is (spec.record).c2s_read on the record, and it must name
  // this service. See the C2SScope comments for what the emitted surface is
  // allowed to return.
  RecordReadC2S c2s = 2;
}

// C2SScope names WHICH ROWS a client-facing record read may return, out of a
// closed set. It is not a predicate language and must never become one.
//
// Every value here is derivable from VERIFIED TOKEN CLAIMS alone. The moment a
// scope would need something else — "the decider this ticket is routed to", a
// reach down an org hierarchy — it has stopped being a generated backstop and
// become business logic, and such a read belongs in a HAND-WRITTEN RPC whose
// body calls the generated s2s reader. That boundary is the design, not a gap
// in it.
//
// Declared top-level rather than nested inside RecordReadC2S: a nested enum
// generates but does not compile in the Rust model crate.
enum C2SScope {
  // Unspecified = C2S_SCOPE_PRINCIPAL. The narrowest value is the default, so a
  // reader that declares the block and forgets the scope discloses the least,
  // not the most.
  C2S_SCOPE_UNSPECIFIED = 0;

  // PRINCIPAL: rows whose owning-principal field equals the caller's subject,
  // AND whose namespace equals the caller's tenant. "My own rows."
  //
  // The principal field is resolved exactly as the egress row filter resolves
  // it — (spec.store_principal) on a record field, else (spec.record).owner —
  // and ONLY when that field is also an EQ criterion on the generated <T>Filter.
  // When it resolves to nothing, generation FAILS rather than degrading to a
  // tenant-wide read: on ScottyActivity and AccountingRecord the declared
  // `owner` is the PUBLISHING SERVICE, so a filter on it would show a human
  // every row in its tenant while looking like it showed them their own.
  C2S_SCOPE_PRINCIPAL = 1;

  // NAMESPACE: every row in the caller's tenant, with no principal narrowing.
  // A legitimate shape — an org-wide audit feed — but a disclosure decision, so
  // it must be written down and can never be what absence means.
  //
  // DECLARED BUT NOT IMPLEMENTED in v1: generation fails with an explicit
  // "declared but not implemented" error, the same stance RESIDENCY_COLD takes.
  // The value exists so it cannot be invented twice with two meanings.
  C2S_SCOPE_NAMESPACE = 2;
}

// RecordReadC2S is the USE half of the client-facing read plane: what
// (spec.record_read).c2s asks tacplus to emit.
message RecordReadC2S {
  // scope names which rows the surface may return. See C2SScope.
  C2SScope scope = 1;

  // exposure is stamped onto the emitted RPCs' (spec.rpc). INTERNAL (the
  // default) keeps the surface inside the cluster boundary; EXTERNAL publishes
  // it through the gateway, which is what a mobile or browser client needs.
  RpcExposure exposure = 2;
}

// GrpcC2SClient declares a client-facing service dependency.
// Used as a file-level option to declare which services this package calls.
// tacplus.yaml selects whether that dependency emits C2S, W2S, or both.
// Example: option (spec.grpc_c2s_client) = {service: "gateway.TokenMint"};
message GrpcC2SClient {
  // service is "package.ServiceName" (e.g. "gateway.TokenMint").
  string service = 1;
}

// GrpcW2SClient declares a client-facing service dependency.
// Used as a file-level option to declare which services this package calls.
// tacplus.yaml selects whether that dependency emits C2S, W2S, or both.
// Example: option (spec.grpc_w2s_client) = {service: "dashboard.Dashboard"};
message GrpcW2SClient {
  // service is "package.ServiceName" (e.g. "dashboard.Dashboard").
  string service = 1;
}

// RestMethod enumerates additional HTTP methods for REST exposure.
// POST is always implicit on every convention REST route and does not
// appear in this enum. These values are used with spec.rest_method to
// declare additional HTTP methods for an RPC.
enum RestMethod {
  REST_METHOD_UNSPECIFIED = 0;
  REST_METHOD_GET = 1;
  REST_METHOD_PATCH = 2;
  REST_METHOD_PUT = 3;
  REST_METHOD_DELETE = 4;
}

// RestMethods is a wrapper for repeated RestMethod, used in method options.
message RestMethods {
  repeated RestMethod methods = 1;
}

extend google.protobuf.ServiceOptions {
  // event_label is the routing label for gateway-exposed event services.
  // Set by tacplus on generated state services that have spec.service_event.
  // The gateway uses this as the service_id for backend resolution.
  string event_label = 70012;

  // service_s2s declares a service-to-service gRPC service.
  // Only authenticated service identities can call these RPCs; which ones is
  // declared per-RPC on spec.rpc.
  // Example: option (spec.service_s2s) = {};
  // Example: option (spec.service_s2s) = {label: "stratum"};
  ServiceS2SAnnotation service_s2s = 70013;

  // service_c2s declares a client-to-service gRPC service.
  // Exposed through the gateway to end users.
  // Example: option (spec.service_c2s) = {auth_entitled_users: true};
  ServiceC2SAnnotation service_c2s = 70014;

  // service_c2d declares a client-to-daemon gRPC service.
  // Served over local IPC between CLI processes and a daemon.
  // No auth — filesystem permissions are the security boundary.
  // Example: option (spec.service_c2d) = {socket_path: "/run/mydaemon.sock"};
  ServiceC2DAnnotation service_c2d = 70015;

  // token_minter explicitly marks the cluster's token mint service so the
  // bootstrap exchanger codegen targets it by fully-qualified name instead of
  // scanning for mint RPC signatures.
  // Example: option (spec.token_minter) = {};            // authoritative S2S minter
  //          option (spec.token_minter) = {proxy: true}; // gateway C2S front
  TokenMinterAnnotation token_minter = 70016;

  // smb (Service Mesh Blackbox) marks a service whose OWN INSTANCES communicate
  // over a black-box peer protocol within a
  // single cluster (SPIFFE plan D7). Each instance obtains a per-SMB CA + its
  // own member cert from the SMB CA authority (the consumer service designated
  // by spec.smb_authority). By default that per-SMB CA is isolated from the
  // cluster root; bootstrap-constrained members may request a cluster-rooted
  // per-SMB intermediate with root: SMB_ROOT_CLUSTER.
  // Example: option (spec.smb) = {};
  //          option (spec.smb) = {root: SMB_ROOT_CLUSTER};
  SmbAnnotation smb = 70020;

  // smb_authority marks the consumer service that issues isolated per-SMB CAs and
  // member certs for spec.smb services — declared EXPLICITLY (like token_minter),
  // not inferred. tacplus targets the service carrying this annotation as the SMB
  // cert authority and fails generation if spec.smb services exist with no
  // authority declared. tacplus does not implement the authority; the designated
  // consumer service does. Exactly one authority should be annotated.
  // Example: option (spec.smb_authority) = {};
  SmbAuthorityAnnotation smb_authority = 70021;
}

extend google.protobuf.MethodOptions {
  // rest_method declares additional HTTP methods for this RPC's REST endpoint.
  // POST is always implicit on every convention REST route.
  // Example: option (spec.rest_method) = {methods: [REST_METHOD_GET]};
  RestMethods rest_method = 80009;

  // rest_path adds an additional alias REST route for this method.
  // The path is relative to REST_ROOT_PATH (defined in gateway.proto).
  // The convention path ({ROOT_PATH}/{package}/{MethodName}) is always
  // present; rest_path creates a second route with the same HTTP methods.
  // Example: option (spec.rest_path) = ".well-known/openid-configuration";
  //          → adds route at /api/v1/.well-known/openid-configuration
  string rest_path = 80008;

  // proof_requires declares a precondition on an RPC method.
  // In Rust, emitted as #[kani::requires(...)].
  // In Java, emitted as //@ requires ... (JML).
  // Example: option (spec.proof_requires) = "!request.client_id.is_empty()";
  string proof_requires = 80010;

  // proof_ensures declares a postcondition on an RPC method.
  // In Rust, emitted as #[kani::ensures(...)].
  // In Java, emitted as //@ ensures ... (JML).
  // Example: option (spec.proof_ensures) = "response.token.len() > 0";
  string proof_ensures = 80011;

  // 80012 (method_s2s) and 80013 (method_c2s) are retired: every RPC-level auth
  // fact they carried now lives on spec.rpc (80015). Do not reuse the numbers.

  // method_collection marks a collection-returning read and declares its shape.
  // Example: option (spec.method_collection) = {mode: COLLECTION_MODE_SNAPSHOT, max_items: 1000, order_by: ["created_at"]};
  // Example: option (spec.method_collection) = {mode: COLLECTION_MODE_WATCH, order_by: ["id"]};
  MethodCollection method_collection = 80014;

  // rpc declares an RPC's call surface: who calls it (principal), where it is
  // reachable from (exposure), its non-exclusive protocol flags, the service
  // identities allowed to call it, and its target namespace field.
  // Example: option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  // Example: option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ENTITLED_USERS]};
  RpcAnnotation rpc = 80015;

  // min_group_size is the smallest result size this RPC will disclose. Stamped
  // by the record-map injector onto every size-only RPC of a record declaring
  // (spec.record).min_group_size. Not hand-written on any RPC.
  int32 min_group_size = 80016;

}

// Collection query types are in sys/query.proto.
