// The authoritative token minter for the record-egress fixture set.
//
// The fixture has an S2S surface (the record plane's peer half is where the
// (spec.store_namespace) runtime gate lives), and a build with an S2S surface and
// no (spec.token_minter) is refused: the generated ServiceManager would have no
// way to obtain an S2S identity. Declared in its OWN package so the self service
// reaches it over a generated client, the same arrangement the requires-device
// fixture uses for its approval broker.

syntax = "proto3";

package egressmint;

import "sys/spec.proto";
import "sys/tokenrequest.proto";
import "sys/x509.proto";

option (spec.service) = {name: "egressmint"};

service EgressTokenMint {
  option (spec.service_s2s) = {};
  option (spec.token_minter) = {};

  rpc TokenMint(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }

  rpc MintServiceToken(tokenrequest.MintServiceTokenRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }

  rpc X509Mint(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }
}
