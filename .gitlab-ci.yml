stages:
  - base-image
  - build
  - package
  - test
  - publish
  - release

variables:
  GOPRIVATE: "gitlab.com/seabeam/*"
  GONOSUMCHECK: "gitlab.com/seabeam/*"
  CGO_ENABLED: "0"
  # Bump and retag to trigger a base image rebuild.
  BASE_VERSION: "7"

.parse-version: &parse-version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then
      V="${CI_COMMIT_TAG#v}"
      MAJOR="$(echo "$V" | cut -d. -f1)"
      MINOR="$(echo "$V" | cut -d. -f2)"
      PATCH="$(echo "$V" | cut -d. -f3)"
      VERSION="$V"
    else
      # main (and any non-tag build): fixed dev version 0.0.0 → tacplus-0-0:latest
      MAJOR=0; MINOR=0; PATCH=latest; VERSION=0.0.0
    fi

.image-rules: &image-rules
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  - if: $CI_COMMIT_BRANCH == "main"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

# ---------------------------------------------------------------------------
# Base image: rebuild when BASE_VERSION is bumped.
# Runs on version tags — skips if the image already exists in the registry.
# ---------------------------------------------------------------------------
.build-base:
  stage: base-image
  image: docker:latest
  services:
    - docker:dind
  rules: *image-rules
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      TAG="$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-${ARCH}"
      # Skip if this base version already exists
      if docker manifest inspect "$TAG" > /dev/null 2>&1; then
        echo "Base image ${TAG} already exists, skipping build."
        exit 0
      fi
      echo "Building base image: ${TAG}"
      docker build -f Dockerfile.base -t "$TAG" .
      docker push "$TAG"

build-base-amd64:
  extends: .build-base
  variables:
    ARCH: amd64

build-base-arm64:
  extends: .build-base
  tags:
    - schematic-aarch64
  variables:
    ARCH: arm64

verify:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules: *image-rules
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - go build ./...
    - go vet ./...

# Gate merge requests and non-tag branch pushes: unit tests + the soundness
# (constraint × language parity) checker must pass before code lands.
test-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - go test ./...
    - go run ./cmd/soundness -root .

# Consumer-contract MR coverage is tiered:
# - shared generator/harness changes run the full service/client matrices
# - language-specific changes run that backend plus the Go sentinel
# Non-tag branch pushes keep the full matrices to preserve existing branch
# coverage outside merge requests.
consumer-service-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &contract_shared_changes
        - .gitlab-ci.yml
        - go.mod
        - go.sum
        - main.go
        - cmd/**/*
        - cross-test/**/*
        - pkg/builder/**/*
        - pkg/codefile/**/*
        - pkg/depfiles/**/*
        - pkg/formatter/**/*
        - pkg/gittag/**/*
        - pkg/internal/common/**/*
        - pkg/internal/consts/**/*
        - pkg/internal/proto/**/*
        - pkg/internal/tactype/**/*
        - pkg/projectfile/**/*
        - pkg/proto/**/*
        - pkg/protosrc/**/*
        - pkg/protovalidate/**/*
        - pkg/registry/**/*
        - pkg/runner/**/*
        - pkg/tacplusyaml/**/*
        - pkg/verification/**/*
        - pkg/version/**/*
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "merge_request_event"
  parallel:
    matrix:
      - TACPLUS_CONTRACT_LANGUAGE: ["go", "rust", "java"]
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-client-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *contract_shared_changes
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "merge_request_event"
  parallel:
    matrix:
      - TACPLUS_CONTRACT_LANGUAGE: ["python", "typescript"]
      - TACPLUS_CONTRACT_LANGUAGE: ["swift"]
        TACPLUS_ALLOW_MISSING_SWIFT: ["1"]
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-go-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/go/**/*
        - pkg/internal/java/**/*
        - pkg/internal/rust/**/*
        - pkg/internal/python/**/*
        - pkg/internal/typescript/**/*
        - pkg/internal/swift/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "go"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-java-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/java/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "java"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-rust-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/rust/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "rust"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-python-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/python/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "python"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-typescript-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/typescript/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "typescript"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

consumer-swift-contract-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/swift/**/*
  variables:
    TACPLUS_CONTRACT_LANGUAGE: "swift"
    TACPLUS_ALLOW_MISSING_SWIFT: "1"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/consumer-contract/run.sh --language "$TACPLUS_CONTRACT_LANGUAGE"

# Cross-language runtime smoke: a go fixture server (generated s2sm servers +
# hand-written W2S endpoints) hosts the contract on localhost while the
# python/typescript generated clients exercise it over the wire. Separate from
# consumer-contract because one job needs go build + python + node runtimes
# concurrently. One matrix leg per consumer language; the go fixture builds in
# both legs (parallelism over wall-clock).
runtime-smoke-mr:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *contract_shared_changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/internal/go/**/*
        - pkg/internal/python/**/*
        - pkg/internal/typescript/**/*
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "merge_request_event"
  parallel:
    matrix:
      - TACPLUS_RUNTIME_SMOKE_CONSUMER: ["python", "typescript"]
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/runtime-smoke/run.sh --consumer "$TACPLUS_RUNTIME_SMOKE_CONSUMER"

cross-test-nightly:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - *setup-netrc
  script:
    - go generate ./pkg/internal/proto/spec/...
    - cross-test/nightly-matrix.sh

build:
  stage: build
  image: "$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-amd64"
  rules: *image-rules
  before_script:
    - *setup-netrc
  script:
    - *parse-version
    - go generate ./pkg/internal/proto/spec/...
    - |
      LDFLAGS="-w -s -X github.com/tacplus-dev/tacplus/pkg/buildinfo.Version=${VERSION} -X github.com/tacplus-dev/tacplus/pkg/buildinfo.GitSha=${CI_COMMIT_SHORT_SHA} -X github.com/tacplus-dev/tacplus/pkg/buildinfo.BuildID=${CI_COMMIT_SHA} -X github.com/tacplus-dev/tacplus/pkg/buildinfo.ProjectPath=${CI_PROJECT_PATH} -X github.com/tacplus-dev/tacplus/pkg/buildinfo.ContainerImage=${CI_REGISTRY_IMAGE}/tacplus-${MAJOR}-${MINOR}:${PATCH}"
      for target in linux/amd64 linux/arm64; do
        GOOS="${target%/*}"
        GOARCH="${target#*/}"
        OUTPUT="bin/tacplus-${GOOS}-${GOARCH}"
        echo "Building ${OUTPUT}..."
        GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="$LDFLAGS" -o "$OUTPUT" main.go
      done
      for arch in amd64 arm64; do
        echo "Building launcher-linux-${arch}..."
        GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-w -s" -o "bin/launcher-linux-${arch}" ./launcher
      done
      ls -lh bin/
  artifacts:
    paths:
      - bin/tacplus-*
      - bin/launcher-*
    expire_in: 1 hour

# ---------------------------------------------------------------------------
.package-arch:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules: *image-rules
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      BASE="$CI_REGISTRY_IMAGE/tacplus-base:${BASE_VERSION}-${ARCH}"
      IMAGE="$CI_REGISTRY_IMAGE/tacplus-${MAJOR}-${MINOR}"
      # DOCKER_BUILDKIT=0 → classic builder, single-arch manifest (no OCI index
      # with provenance attestations). The package-manifest job uses
      # `docker manifest create` which rejects manifest-list inputs.
      DOCKER_BUILDKIT=0 docker build \
        --build-arg BASE_IMAGE="${BASE}" \
        --build-arg VERSION="${VERSION}" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg TARGETARCH="${ARCH}" \
        --build-arg TARGETOS=linux \
        -t "${IMAGE}:${PATCH}-${ARCH}" \
        .
      docker push "${IMAGE}:${PATCH}-${ARCH}"

package-amd64:
  extends: .package-arch
  variables:
    ARCH: amd64

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  variables:
    ARCH: arm64

package-manifest:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - package-amd64
    - package-arm64
  rules: *image-rules
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/tacplus-${MAJOR}-${MINOR}"
      docker manifest create "${IMAGE}:${PATCH}" \
        "${IMAGE}:${PATCH}-amd64" \
        "${IMAGE}:${PATCH}-arm64"
      docker manifest push "${IMAGE}:${PATCH}"
      # For tagged releases PATCH is a number, so also publish :latest. On main
      # PATCH is already "latest", so the push above IS :latest — skip the dup.
      if [ "$PATCH" != "latest" ]; then
        docker manifest create "${IMAGE}:latest" \
          "${IMAGE}:${PATCH}-amd64" \
          "${IMAGE}:${PATCH}-arm64"
        docker manifest push "${IMAGE}:latest"
      fi

test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  needs:
    - package-manifest
  rules: *image-rules
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - *parse-version
    - |
      IMAGE="$CI_REGISTRY_IMAGE/tacplus-${MAJOR}-${MINOR}"
      docker pull "${IMAGE}:${PATCH}"
      docker run --rm "${IMAGE}:${PATCH}" sh -c '
        protoc --version &&
        tacplus --help &&
        tacplus build --help &&
        tacplus validate --help &&
        protoc-gen-go --version &&
        protoc-gen-go-grpc --version &&
        protoc-gen-es --version &&
        test -x /usr/local/bin/protoc-gen-swift &&
        test -x /usr/local/bin/protoc-gen-grpc-swift-2 &&
        black --version'

# ---------------------------------------------------------------------------
# Release: create a GitLab Release for a version tag (image-only, no binaries).
# Only runs on version tags.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package-manifest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "tacplus $CI_COMMIT_TAG"
