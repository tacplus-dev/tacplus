// Cert-stream behavioral fixture member: it opts into both auto-TLS and SMB so
// the generated Go service-manager contains both certificate loops.

syntax = "proto3";

package certstream;

import "sys/spec.proto";

message Ping { string m = 1; }

message StreamState {
  option (spec.service_state) = {
    name: "StreamState",
    label: ["certstream"],
    auto_tls: TLS_KEY_TYPE_ED25519,
    export: true
  };
  string marker = 1;
}

service StreamMemberService {
  option (spec.service_s2s) = {label: "StreamMemberService"};
  option (spec.smb) = {};
  rpc Get(Ping) returns (Ping) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
