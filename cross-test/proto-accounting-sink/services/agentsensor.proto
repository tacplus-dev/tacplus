// Fixture for the accounting-sink self-tests in cross-test/current-generation.
// It carries no state: a topic on a state generates a Publish method that needs
// a PublishTo RPC and TopicPublishReceipt, which this fixture does not declare.

syntax = "proto3";

package agentsensor;

import "sys/spec.proto";

option (spec.service) = {name: "agentsensor", store: true};

message AgentEvent {
  option (spec.event) = {s2s: {auth_services: ["agentsensor"]}};

  string id = 1 [(spec.assert_required) = true];
  bytes body = 2;
}

option (spec.grpc_w2s_client) = {service: "agentsensor.AgentApi"};

service AgentApi {
  option (spec.service_c2s) = {};

  // Ping echoes an agent event back to the caller.
  rpc Ping(AgentEvent) returns (AgentEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, auth_services: ["*"]};
  }
}

service AgentUploadApi {
  option (spec.service_c2s) = {};

  // SendEvents uploads a stream of agent events and returns one summary.
  rpc SendEvents(stream AgentEvent) returns (AgentEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, auth_services: ["*"]};
  }
}
