name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and soundness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: just protoc-check
      - run: just generate
      - run: just vet
      - run: just test

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL --retry 5 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - run: gitleaks git --no-banner --redact .

  example:
    name: Example (Go server, TypeScript client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: just example

  cross-test-go:
    name: Go cross-test gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: just current-generation-go
      - run: just determinism-go
      - run: just w2s-validate-go

  w2s-validate-java:
    name: Java W2S dispatch gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install protoc-gen-grpc-java
        shell: bash
        run: |
          set -euo pipefail
          # Same plugin and version the gates container carries (Dockerfile.base).
          GRPC_JAVA_VERSION=1.79.0
          case "$(uname -m)" in
            x86_64) GRPC_ARCH=linux-x86_64 ;;
            aarch64|arm64) GRPC_ARCH=linux-aarch_64 ;;
          esac
          curl -fsSL --retry 5 -o "$HOME/.local/bin/protoc-gen-grpc-java" \
            "https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/${GRPC_JAVA_VERSION}/protoc-gen-grpc-java-${GRPC_JAVA_VERSION}-${GRPC_ARCH}.exe"
          chmod +x "$HOME/.local/bin/protoc-gen-grpc-java"
      - run: just w2s-validate-java
