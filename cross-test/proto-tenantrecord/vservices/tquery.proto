// The record plane of the tenant-owned tstratum (#207): both halves, every rpc
// routed by target_tenant.

syntax = "proto3";

package tquery;

import "sys/spec.proto";

option (spec.trait) = {
  name: "tquery"
  host: "tstratum"
  s2s_service: "TenantRecordMap"
  c2s_service: "TenantRecordQuery"
  auth_services: ["tmessaging"]
};
