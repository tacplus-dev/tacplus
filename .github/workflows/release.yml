name: Release

# On a version tag (v1.2.3): build the tacplus binary for every supported
# platform, write checksums.txt, and publish a GitHub release. `tacplus upgrade`
# reads exactly this layout.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

jobs:
  # The build image of this tag's own line, build:X.Y: build:latest moves with
  # whichever run pushed last, and a 2.0.x release built in a 2.3 image (or the
  # reverse) fails or ships the wrong toolchain (#160: v2.3.2 ran in release/2.0's
  # image, which has no gh). A line's first release (X.Y.0, cut from main) has no
  # build:X.Y yet and uses build:latest, which is main's.
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - id: image
        shell: bash
        env:
          NS: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          IFS=. read -r MAJOR MINOR _ <<< "${GITHUB_REF_NAME#v}"
          ref="$NS/build:latest"
          if docker manifest inspect "$NS/build:$MAJOR.$MINOR" >/dev/null 2>&1; then ref="$NS/build:$MAJOR.$MINOR"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$ref"

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A container job defaults to sh; the steps below are bash (here-strings,
    # [[ ]]), so say so, or "Syntax error: redirection unexpected" (v2.1.1).
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: just generate
      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          PKG=github.com/tacplus-dev/tacplus/pkg/buildinfo
          LDFLAGS="-w -s -X ${PKG}.Version=${VERSION} -X ${PKG}.GitSha=${GITHUB_SHA::8} -X ${PKG}.BuildID=${GITHUB_SHA} -X ${PKG}.ProjectPath=${GITHUB_REPOSITORY}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"; EXT=""
            [[ "$GOOS" == windows ]] && EXT=.exe
            OUT="dist/tacplus-${MAJOR}-${MINOR}-${PATCH}-${GOOS}-${GOARCH}${EXT}"
            echo "building $OUT"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="$LDFLAGS" -o "$OUT" .
          done
          (cd dist && sha256sum -- * > checksums.txt && cat checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
