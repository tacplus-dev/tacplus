// Minimal ServiceHealth state root used by the consumer-contract subscription
// fixture so EventBus subscribers can resolve broker instances.

syntax = "proto3";

package contracthealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["contractfixtures"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
