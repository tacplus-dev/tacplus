// The redo-contract fixture's HOST (issue #163 D5): the redo service, a
// /system service (#258: stratum -> redo is tenant -> /system). It declares no
// rpc of its own: it serves the sys contract redolog.Redo, which names it by
// routing label "redo"; a call is not tenant-routed, and the log is the
// caller's tid's.

syntax = "proto3";

package redo;

import "sys/spec.proto";

option (spec.service) = {name: "redo"};
