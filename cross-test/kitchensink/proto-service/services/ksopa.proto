// Stand-in OPA service: the physical implementor a (spec.opa_import) names,
// which must import sys/opalib.proto.

syntax = "proto3";

package ksopa;

import "sys/spec.proto";
import "sys/opalib.proto";

option (spec.service) = {name: "ksopa"};

message Config {
  option (spec.grpc_config) = {service_name: "ksopa"};

  opalib.OpaPolicy policy = 1;
}
