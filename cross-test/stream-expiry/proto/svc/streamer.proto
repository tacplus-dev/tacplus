// Stream-expiry fixture (issue #260): an S2S service with one rpc of each
// streaming shape. A stream opened with a short-lived token that is never
// rotated must be ended by the server at the token's exp, UNAUTHENTICATED.

syntax = "proto3";

package streamexpiry;

import "sys/spec.proto";

message Tick { string m = 1; }

service StreamerService {
  option (spec.service_s2s) = {label: "StreamerService"};
  rpc SendTicks(stream Tick) returns (Tick) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
  rpc GenerateTicks(Tick) returns (stream Tick) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
  rpc AssistTicks(stream Tick) returns (stream Tick) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
