name: tacplus toolchain
description: Go (from go.mod), Node, just, protoc and the protoc plugins tacplus generation needs.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: extractions/setup-just@v2
    - name: Install protoc and plugins
      shell: bash
      run: |
        set -euo pipefail
        # protoc at or below the ceiling pinned in the justfile (see protoc-check);
        # 28.3 is what the base image carries.
        PROTOC_VERSION=28.3
        PROTOC_GEN_ES_VERSION=2.11.0
        case "$(uname -m)" in
          x86_64) PROTOC_ARCH=linux-x86_64 ;;
          aarch64|arm64) PROTOC_ARCH=linux-aarch_64 ;;
        esac
        curl -fsSL --retry 5 -o /tmp/protoc.zip \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip"
        mkdir -p "$HOME/.local"
        unzip -qo /tmp/protoc.zip -d "$HOME/.local"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        npm install -g "@bufbuild/protoc-gen-es@${PROTOC_GEN_ES_VERSION}"
