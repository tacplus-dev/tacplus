syntax = "proto3";

package contractclient;

import "sys/spec.proto";

option (spec.service) = {name: "contract"};
option (spec.grpc_s2s_client) = {service: "contractclient.ContractS2S"};
option (spec.grpc_c2s_client) = {service: "contractclient.ContractApi"};
option (spec.grpc_w2s_client) = {service: "contractclient.ContractApi"};

enum ContractMode {
  CONTRACT_MODE_UNSPECIFIED = 0;
  CONTRACT_MODE_READ = 1 [(spec.json_return_value) = "read"];
  CONTRACT_MODE_WRITE = 2 [(spec.json_return_value) = "write"];
}

message ContractRequest {
  string tenant_namespace = 1 [
    (spec.assert_required) = true,
    (spec.assert_min_size) = 1
  ];
  string item_id = 2 [
    (spec.assert_required) = true,
    (spec.assert_min_size) = 3
  ];
  ContractMode mode = 3 [(spec.assert_enum_defined) = true];
  repeated string tags = 4 [(spec.assert_max_size) = 8];
  map<string, string> metadata = 5 [(spec.assert_max_size) = 8];
}

message ContractResponse {
  string result_id = 1 [(spec.assert_required) = true];
  bool accepted = 2;
}

message ContractEvent {
  string event_id = 1 [(spec.assert_required) = true];
  string tenant_namespace = 2 [(spec.assert_required) = true];
  // Egress data entitlement (RED-1): caller-decided redaction. The generated
  // service wrapper applies Sanitize<T> on every record-bearing egress path
  // (ListEvents / Watch / ListEventsPaged) — fail-closed, so an unentitled
  // caller receives "" + payload_redacted=true; a matching
  // CONTRACTCLIENT_CONTRACT_EVENT_PAYLOAD data grant egresses it raw.
  string payload = 3 [(spec.redact) = {mode: REDACT_MODE_MAY_REDACT}];
}

message ContractActor {
  option (spec.event_watch) = {
    topic_ref: "contractfixtures.FixtureState.events"
    method_s2s: {auth_services: ["*"]}
  };
  // ROUTING-ONLY ARM. FixtureRouted's owner names contractclient in
  // s2s_subscribe.routing_only_services, so this watch's generated Handler takes
  // FixtureRoutedRoutingEnvelope {delivery_id, recipient, namespace} and not
  // FixtureRouted. The events watch above is the paired control: same actor,
  // same generated service manager, full message, unchanged.
  option (spec.event_watch) = {
    topic_ref: "contractfixtures.FixtureState.routed"
    method_s2s: {auth_services: ["*"]}
  };
}

enum ContractChangeType {
  CONTRACT_CHANGE_TYPE_UNSPECIFIED = 0;
  CONTRACT_CHANGE_TYPE_ADD = 1;
  CONTRACT_CHANGE_TYPE_MODIFY = 2;
  CONTRACT_CHANGE_TYPE_DELETE = 3;
}

message ContractWatchRequest {
  string tenant_namespace = 1 [
    (spec.assert_required) = true,
    (spec.assert_min_size) = 1
  ];
  string item_id = 2 [
    (spec.assert_required) = true,
    (spec.assert_min_size) = 3
  ];
  ContractMode mode = 3 [(spec.assert_enum_defined) = true];
  int64 from_revision = 4;
}

message ContractWatchChange {
  ContractChangeType type = 1 [(spec.assert_enum_defined) = true];
  ContractEvent item = 2;
  int64 revision = 3;
}

message ContractWatchEvent {
  oneof event {
    ContractEvent snapshot_item = 1;
    int64 snapshot_done = 2;
    ContractWatchChange delta = 3;
  }
}

// PAGE (keyset pagination) request/response envelope. The request carries the
// filter fields plus page_size + page_token; the response carries exactly one
// repeated items field plus next_page_token (+ an optional int64 total_count).
message ContractPageRequest {
  string tenant_namespace = 1 [
    (spec.assert_required) = true,
    (spec.assert_min_size) = 1
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ContractPageResponse {
  // Bounded at runtime by page_size (<= the trust-tier MaxPageSize); the static
  // assert_max_size satisfies the "every repeated field is bounded" rule.
  repeated ContractEvent items = 1 [(spec.assert_max_size) = 10000];
  string next_page_token = 2;
  int64 total_count = 3;
}

service ContractS2S {
  option (spec.service_s2s) = {};

  rpc Ping(ContractRequest) returns (ContractResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
  rpc GenerateEvents(ContractRequest) returns (stream ContractEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
  rpc SendEvents(stream ContractEvent) returns (ContractResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
  rpc AssistEvents(stream ContractEvent) returns (stream ContractEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}

service ContractApi {
  option (spec.service_c2s) = {auth_entitled_users: true};

  // Return the contract for one tenant namespace.
  rpc GetContract(ContractRequest) returns (ContractResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ENTITLED_USERS], target_namespace_field: "tenant_namespace"};
    option (spec.rest_method) = {methods: [REST_METHOD_GET]};
  }

  rpc GetPublicContract(ContractRequest) returns (ContractResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_PUBLIC_NO_AUTH]};
    option (spec.rest_path) = "contract/public-read";
  }

  rpc ListEvents(ContractRequest) returns (stream ContractEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ANY_USER]};
    option (spec.method_collection) = {
      mode: COLLECTION_MODE_SNAPSHOT
      order_by: "event_id"
      max_items: 1000
    };
  }

  rpc Watch(ContractWatchRequest) returns (stream ContractWatchEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ANY_USER]};
    option (spec.method_collection) = {
      mode: COLLECTION_MODE_WATCH
      order_by: "event_id"
    };
  }

  // List a tenant namespace's contract events, one page at a time.
  rpc ListEventsPaged(ContractPageRequest) returns (ContractPageResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ANY_USER]};
    option (spec.method_collection) = {
      mode: COLLECTION_MODE_PAGE
      order_by: "event_id"
      default_page_size: 50
    };
  }

  rpc SendEvents(stream ContractEvent) returns (ContractResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ENTITLED_USERS]};
  }
  rpc AssistEvents(stream ContractEvent) returns (stream ContractEvent) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_USER, exposure: RPC_EXPOSURE_EXTERNAL, flags: [RPC_FLAG_AUTH_ENTITLED_USERS]};
  }
}

service ContractDaemon {
  option (spec.service_c2d) = {socket_path: "/tmp/contract-daemon.sock"};

  rpc GetLocal(ContractRequest) returns (ContractResponse);
  rpc GenerateLocalEvents(ContractRequest) returns (stream ContractEvent);
}
