// uni-config fixture (tacplus#262): an ordinary S2S service, so the generated
// chassis carries the config loader and the identity manager, plus the
// Secrets message a service reads from the platform's secrets file.

syntax = "proto3";

package uniconfig;

import "sys/spec.proto";

message Ping { string m = 1; }

// Secrets are this service's secret inputs, delivered as one file from the
// uni-config and read with the generated file reader.
message Secrets {
  string api_key = 1;
  bytes signing_seed = 2;
}

service CallerService {
  option (spec.service_s2s) = {label: "CallerService"};
  rpc Get(Ping) returns (Ping) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}
