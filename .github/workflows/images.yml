name: Images

# The image set from docs/VERSIONING.md: base (every SDK) and build (base +
# every tool and verifier; the image builds and the gates run in), pushed to
# ghcr.io for linux/amd64 and linux/arm64. There is no tacplus image any more
# (#193): tacplus is a release binary, and the build image's tacplus is
# images/tacplus.sh, which runs the release a repository pins (tacplus.lock).
# The old tacplus/tacplus tags stay, deprecated, and are never pushed again.
#
# build is rebuilt on every release tag, as build:X.Y.Z (immutable: a second
# push of it is refused) and the floating tags of scripts/images-tags.sh
# (X.Y, X, latest when it is the newest release each covers), with the line
# X.Y baked in (TACPLUS_LINE); on main when its file changed, on demand, or
# when base is rebuilt (weekly, or when its file changed). Releases are cut on
# several lines at once, so a run for an older line never moves base:latest or
# build:latest (#160). Each run writes the build image's digest to its summary:
# the digest is what a repository pins (`tacplus pin`).
#
# A run on a release/X.Y branch is a line rebuild (#283): base and build from
# that branch, pushed as base:X.Y and build:X.Y (and the dated tag) only, never
# latest, main, X or an X.Y.Z. The weekly schedule on main dispatches one for
# every supported line (job lines), so each line's images take the OS security
# fixes (apt-get upgrade) without waiting for a patch. A release tag's build
# starts from its line's base:X.Y when there is one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Lowest layer to rebuild (everything above it rebuilds too); a run on release/X.Y always rebuilds base and build, as that line's X.Y"
        type: choice
        options: [build, base]
        default: build

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NS: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: Which layers
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
      line: ${{ steps.plan.outputs.line }}
      base_image: ${{ steps.plan.outputs.base_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: a release tag diffs against the previous release tag.
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$(scripts/images-plan.sh "${{ github.event_name }}" "$GITHUB_REF_TYPE" "${{ github.event.inputs.rebuild }}" "$GITHUB_REF_NAME")"
          read -r base build <<<"$plan"
          # First publish: build everything when the build image does not exist yet.
          if ! docker manifest inspect "$NS/build:latest" >/dev/null 2>&1; then base=true; build=true; fi
          stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # The release line a tag's or a line rebuild's build image serves (its
          # tacplus refuses a repository pinned to another); none for main.
          line=""
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            line="${BASH_REMATCH[1]}"
          fi
          # The base a build starts from when this run does not rebuild base: its
          # line's base:X.Y (refreshed weekly by the line rebuild), else base:latest.
          base_image="$NS/base:latest"
          if [[ -n $line ]] && docker manifest inspect "$NS/base:$line" >/dev/null 2>&1; then base_image="$NS/base:$line"; fi
          { echo "base=$base"; echo "build=$build"; echo "stamp=$stamp"; echo "line=$line"; echo "base_image=$base_image"; } >> "$GITHUB_OUTPUT"
          echo "base=$base build=$build line=$line base_image=$base_image"
        env:
          DOCKER_CONFIG: /tmp/docker-anon

  base:
    name: base
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          list="$NS/base:${{ needs.plan.outputs.stamp }}"
          # base takes latest where build does (main, the newest release) and its
          # line's X.Y where build does (a line rebuild, the newest patch of a line).
          for t in $(scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA"); do
            case "$t" in
              main|latest) list+=",$NS/base:latest" ;;
              "${{ needs.plan.outputs.line }}") list+=",$NS/base:$t" ;;
            esac
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ env.NS }}/base:buildcache
          cache-to: type=registry,ref=${{ env.NS }}/base:buildcache,mode=max

  build:
    name: build (${{ matrix.arch }})
    needs: [plan, base]
    if: always() && needs.plan.outputs.build == 'true' && (needs.base.result == 'success' || needs.base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.base.result == 'success' && format('{0}/base:{1}', env.NS, needs.plan.outputs.stamp) || needs.plan.outputs.base_image }}
            TACPLUS_LINE=${{ needs.plan.outputs.line }}
          outputs: type=image,name=${{ env.NS }}/build,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }},mode=max
      - name: Smoke test (this architecture)
        if: matrix.arch == 'amd64'
        run: docker run --rm "$NS/build@${{ steps.push.outputs.digest }}" tacplus-smoke
      # Generate, test, verify (Kani; Go reported as skipped) and fuzz a pinned
      # repository through the image's tacplus launcher, with a tacplus built
      # from this commit as a local release of the image's line.
      - name: Pipeline smoke (generate, test, verify, fuzz)
        if: matrix.arch == 'amd64'
        timeout-minutes: 90
        run: docker run --rm -v "$PWD:/src:ro" "$NS/build@${{ steps.push.outputs.digest }}" bash /src/images/smoke-pipeline.sh
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  build-manifest:
    name: build (manifest)
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: build-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=(); for d in *; do refs+=("$NS/build@sha256:$d"); done
          tags=(-t "$NS/build:${{ needs.plan.outputs.stamp }}")
          # Fetched here, not in plan: parallel tags on one line (v2.3.1 and
          # v2.3.2) must see each other before either moves a floating tag.
          git -C "$GITHUB_WORKSPACE" fetch --force --tags origin
          list="$(cd "$GITHUB_WORKSPACE" && scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # build:X.Y.Z is what a pin was resolved from: never moved once pushed.
            v="${GITHUB_REF_NAME#v}"
            if docker buildx imagetools inspect "$NS/build:$v" >/dev/null 2>&1; then
              echo "::error::$NS/build:$v already exists; a release's build image is immutable"
              exit 1
            fi
            for t in $list; do tags+=(-t "$NS/build:$t"); done
          else
            # main moves latest; a line rebuild moves its X.Y and nothing else.
            for t in $list; do
              case "$t" in
                main) tags+=(-t "$NS/build:latest") ;;
                main-*) ;;
                *) tags+=(-t "$NS/build:$t") ;;
              esac
            done
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$NS/build:${{ needs.plan.outputs.stamp }}"
      - name: Digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$NS/build:${{ needs.plan.outputs.stamp }}" --format '{{json .Manifest}}' | jq -r .digest)"
          ref="$NS/build:${{ needs.plan.outputs.stamp }}@$digest"
          [[ "$GITHUB_REF_TYPE" == tag ]] && ref="$NS/build:${GITHUB_REF_NAME#v}@$digest"
          echo "build image: $ref"
          echo "Build image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  # The weekly line rebuild (#283): dispatch this workflow on every supported
  # release/X.Y (a minor released within the last twelve months,
  # docs/VERSIONING.md), each building from its own branch. A branch whose own
  # scripts/images-tags.sh does not yet map release/X.Y to X.Y alone (its
  # backport of #283 not merged) is skipped: its images.yml would push the
  # line's image as build:latest.
  lines:
    name: Rebuild each release line
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch a line rebuild per supported line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          cutoff=$(( $(date -u +%s) - 365*24*3600 ))
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release/*'); do
            line="${ref#release/}"
            [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]] || continue
            first="$(git tag -l "v$line.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k3,3n | head -1 || true)"
            if [[ -n $first ]] && (( $(git log -1 --format=%ct "$first") < cutoff )); then
              echo "$ref: out of support (first release $first), skipped"; continue
            fi
            got="$(bash <(git show "origin/$ref:scripts/images-tags.sh") branch "$ref" "$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$got" != "$line" ]]; then
              echo "::warning::$ref has no line rebuild yet (its images-tags.sh gives '$got'); skipped"; continue
            fi
            gh workflow run images.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
            echo "$ref: line rebuild dispatched"
          done
