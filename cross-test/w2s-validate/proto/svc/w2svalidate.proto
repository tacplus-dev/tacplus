// W2S request-validation fixture self service: opts into rest_dispatch so the
// generated Rust crate contains the REST -> gRPC dispatch module under test,
// and declares the C2S backend whose RPCs that module dispatches to.

syntax = "proto3";

package w2svalidate;

import "sys/spec.proto";

option (spec.service) = {name: "w2svalidate", rest_dispatch: true};
option (spec.grpc_c2s_client) = {service: "catalog.CatalogService"};

message Ping { string m = 1; }

service W2sValidateService {
  option (spec.service_s2s) = {auth_services: ["*"], tag: "W2sValidateService"};
  rpc Get(Ping) returns (Ping) {
    option (spec.method_s2s) = {auth_services: ["*"]};
  }
}
