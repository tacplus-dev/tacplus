// The product-layer fixture's PLATFORM service (#475, products-layer-2026-11-08).
//
// hub is /system: tenants and products call it, and it calls a tenant
// (crew), never a product. Its build carries the generated client of crew's
// S2S surface, whose layer check the fixture's self-test drives with a
// platform's, a tenant's and a product's own token.

syntax = "proto3";

package hub;

import "sys/spec.proto";

option (spec.service) = {name: "hub"};
option (spec.grpc_s2s_client) = {service: "crew.CrewPeerService"};

service HubService {
  option (spec.service_s2s) = {};

  rpc GetHubStatus(GetHubStatusRequest) returns (GetHubStatusResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }

  // GetUsage returns the calling tenant's usage. Its tenant is bound to the
  // caller's token's tid (spec.caller_tid), so the fixture's hub server in
  // each language compiles the binding; a caller with no tid (the platform,
  // a product) is refused.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, auth_services: ["*"]};
  }
}

message GetHubStatusRequest {}

message GetUsageRequest {
  // tenant is the caller's tid, from its token, never the client's value.
  string tenant = 1 [(spec.caller_tid) = true];
}

message GetUsageResponse {
  int64 units = 1;
}

message GetHubStatusResponse {
  bool ready = 1;
}
