# The gate map of tacplus (tacplus#266; tacplus-dev/looper README, Gates scaled
# to the diff): the gates a land runs, chosen by the paths its diff changes. A
# path no set names, a path under full's paths, a change to this file, the
# nightly gates and every release run full. Each set's run is a shell command
# at the root of the checkout, with LOOPER_GATES_BASE the main the land is
# rebased on.
#
# full's minutes (tacplus#812; was 2h55m, current-generation 2h26m of it
# serially): measured on the 8-CPU looper VM, GATES_JOBS=8, its gates' wall
# time 2362 s and 2457 s (tacplus#979, main 654a7b3 and its change) and 2825 s
# (2026-11-26, main 715ecaa, current-generation 1687 s, memberport 633 s) and
# 2495 s (2026-11-27, main 6a271f8, current-generation 1466 s), each
# beside one other full build (the VM's two build slots), the gates' own
# processes using 3.4 of 8 CPUs. Since tacplus#977 current-generation's shards
# are legs of the gates' own pool.
# Under pkg/, only the language sets below are split out (tacplus#976): any
# other path of pkg/ (the shared generator, pkg/internal/common, the spec
# protos, pkg/templates/embed.go) matches no set, so it runs full.
full:
  run: just gates
  minutes: 45
  paths: [proto/**, cmd/**, /justfile, /dependencies.yaml, /go.mod, /go.sum, /main.go, /docs/embed.go, /docs/*.tmpl]
# One language's generator and templates (tacplus#976): every leg of the full
# gates that generates that language (its generation, compile and cross-tests,
# and a leg of another language's that runs against it: the Go server of the
# client-only languages' rotation legs, the Java member port of Go's and
# Rust's interop), with soundness, test and floors. scripts/gate-sets.sh names
# each set's legs and why; `just gate-audit` reports, for a diff, the sets
# chosen and why (scripts/gate_sets_test.go). A change to two languages runs
# both sets. Their minutes: each set measured alone on the 8-CPU looper VM
# (GATES_JOBS=8, 2026-11-26, a warm cache), its gates' wall time go 893 s,
# java 863, rust 1300 (current-generation-rust 1292 of it), typescript 183,
# python 137, csharp 124, swift 379; and a margin, as full's, for a cold cache
# (`just test` took 494 s of go's, 118 of csharp's) and a slower runner.
go:
  run: just gates-lang go
  minutes: 25
  paths: [pkg/internal/go/**, pkg/templates/go/**]
java:
  run: just gates-lang java
  minutes: 25
  paths: [pkg/internal/java/**, pkg/templates/java/**]
rust:
  run: just gates-lang rust
  minutes: 35
  paths: [pkg/internal/rust/**, pkg/templates/rust/**]
typescript:
  run: just gates-lang typescript
  minutes: 10
  paths: [pkg/internal/typescript/**, pkg/templates/typescript/**]
python:
  run: just gates-lang python
  minutes: 10
  paths: [pkg/internal/python/**, pkg/templates/python/**]
csharp:
  run: just gates-lang csharp
  minutes: 10
  paths: [pkg/internal/csharp/**, pkg/templates/csharp/**]
swift:
  run: just gates-lang swift
  minutes: 15
  paths: [pkg/internal/swift/**, pkg/templates/swift/**]
# Documentation: the planning files, links, secrets and `just test`, which
# checks README.md against README.src.md and the docs the compiler embeds
# (see the justfile). docs/embed.go and docs/AGENT.md.tmpl are code: full's.
# /looper.yaml, the VM spec, is read only outside the repository (tacplus#968).
docs:
  run: just docs
  minutes: 5
  paths: ["*.md", docs/**, /looper.yaml]
# The image set. `just test` first: pkg/images and scripts test the files under
# images/ (a change to pkg/images alone matched no set, so it ran full, which
# builds no image). Its minutes cover a cold base and build, which a change to
# a base pin makes (tacplus#947): at 30, the requester's wait was its 3h floor,
# and a Swift bump's gates ran past it twice with no verdict. images.yml gives
# base alone 90 minutes; base and build for release/2.6 took 1h29m.
images:
  run: just test && just images && just tacplus-script
  minutes: 180
  paths: [images/, pkg/images/**]
# The pre-land gate (tacplus-dev/looper#196): `just test` on the land rebased
# onto current main, before it is queued and when the manager stages it onto a
# newer main, so a land older than a repo-wide check goes back before a batch.
pre-land:
  run: just test
  minutes: 5
