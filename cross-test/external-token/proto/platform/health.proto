// Minimal ServiceHealth state root, required by every generated service manager.

syntax = "proto3";

package externaltokenhealth;

import "sys/healthreport.proto";
import "sys/spec.proto";

message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", label: ["externaltoken"], export: true};

  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.assert_max_size) = 10000
  ];
}
