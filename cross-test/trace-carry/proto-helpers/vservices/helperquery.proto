// The trait that asks for the trace-helpers fixture's record query plane
// (tacplus#327), hosted on helperstratum.

syntax = "proto3";

package helperquery;

import "sys/spec.proto";

option (spec.trait) = {
  name: "helperquery"
  host: "helperstratum"
  s2s_service: "HelperRecordMap"
  c2s_service: "HelperRecordQuery"
  auth_services: ["tracehelpers"]
};
