syntax = "proto3";

package contractfixtures;

import "sys/healthreport.proto";
import "sys/spec.proto";
import "sys/tokenrequest.proto";
import "sys/x509.proto";

option (spec.service) = {name: "contractfixtures"};
option (spec.vservice) = {
  name: "contractfixtures"
  id: 30
};

message FixtureEvent {
  // DELIVERY. A record implies an event and must declare its producer surface
  // (s2s here). The row lifecycle is (spec.record).residency's two clocks and
  // lives here, never on the transformation below — a pure typed conversion has
  // no lifetime. This fixture leaves both clocks at the platform default.
  option (spec.record) = {
    key: "event_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["*"]}
  };
  // TRANSFORMATION. A pure typed conversion FixtureEvent -> FixtureEventRecord.
  // Exercises the transformation + TimeseriesGroupCounts + TimeseriesQuery
  // (key-returning) generators. Because the SOURCE is a record, the record key
  // (event_id) is auto-injected by tacplus for federation/hydration; a
  // transformation over a non-record source (see FixtureProbe) gets no key.
  option (spec.transformation) = {
    name: "FixtureEventRecord"
    dedup: {strategy: DEDUP_LATEST_BY_VERSION version_field: "timestamp_ms" key_fields: "timestamp_ms"}
    field: {source: "timestamp_ms" order_key: 1 partition_key: true}
    field: {source: "tenant_namespace" cardinality_hint: CARDINALITY_LOW}
  };

  string event_id = 1 [(spec.assert_required) = true];
  // Queryable record fields — exercise the RecordMap typed <T>Filter (EQ + RANGE),
  // Refine, Watch, and the oneof watch envelope.
  string tenant_namespace = 2 [
    (spec.assert_required) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.store_namespace) = true
  ];
  // Egress data entitlement (spec.redact) — exercises the Sanitize<T> codegen for
  // the full-service store languages (go/rust/java; the transform is COMPILED as
  // part of the generated helpers). Client-only targets (python/typescript) are
  // exempt and emit no transform. DROP zeroes the field; PSEUDONYMIZE replaces it
  // with a keyed HMAC token; both set the injected <field>_redacted indicator.
  string payload = 3 [(spec.redact) = {mode: REDACT_MODE_DROP}];
  string spiffe_id = 4 [(spec.identity_spiffe_subject) = true];
  int64 timestamp_ms = 5 [(spec.query_field) = {op: QUERY_OP_RANGE}];
  // assert_email makes anonymization FORMAT-PRESERVING: the surrogate is a valid
  // synthetic email, not a pseud: token.
  string contact_email = 6 [(spec.assert_email) = true, (spec.redact) = {mode: REDACT_MODE_PSEUDONYMIZE}];
  // Caller-decided (may-*) field: the entitlement's EntitlementLevel selects
  // PASS/ANONYMIZE/REDACT at egress. Exercises the FixtureEventEntitlement.notes
  // level end-to-end.
  string notes = 7 [(spec.redact) = {mode: REDACT_MODE_MAY_REDACT}];
  // Message-typed field: exercises FIELD-BY-FIELD recursion. The entitlement's
  // contact_sub (a FixtureContactEntitlement) redacts inside FixtureContact while
  // leaving its other fields intact.
  FixtureContact contact = 8;
  // Repeated message field: exercises ELEMENT-WISE recursion — one
  // more_contacts_sub entitlement is applied to every element of the list.
  // (Repeated fields must declare a max element count.)
  repeated FixtureContact more_contacts = 9 [(spec.assert_max_size) = 16];
}

// PAIRED CONTROL (delivery half). FixtureAudit declares DELIVERY and nothing
// else: a record with a producer surface, stored and retained, driven by the
// FixtureState subscription — and NO (spec.transformation) anywhere. Delivery
// generates with no transformation attached, exactly as a transformation
// generates with no delivery attached (see FixtureProbe in cross-test/proto).
message FixtureAudit {
  option (spec.record) = {
    key: "audit_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["*"]}
  };

  string audit_id = 1 [(spec.assert_required) = true];
  string spiffe_id = 2 [(spec.identity_spiffe_subject) = true];
  int64 recorded_at_ms = 3 [(spec.query_field) = {op: QUERY_OP_RANGE}];
  string action = 4 [(spec.query_field) = {op: QUERY_OP_EQ}];
  string namespace = 5 [(spec.store_namespace) = true];
}

// A nested sub-message reached through FixtureEvent.contact — proves recursive
// data entitlement redacts a sub-message field (phone) while preserving its
// siblings (label). Not a record; redaction is valid on any returned message.
message FixtureContact {
  string phone = 1 [(spec.redact) = {mode: REDACT_MODE_MAY_REDACT}];
  string label = 2;
}

message FixtureState {
  option (spec.service_state) = {
    name: "FixtureState"
    label: ["contractfixtures"]
    export: true
  };
  option (spec.service_event) = {};
  option (spec.subscribe) = {
    source: "contractfixtures.FixtureState.events"
  };

  repeated FixtureEvent events = 1 [
    (spec.topic) = true
  ];
}

message FixtureStoreEntry {
  option (spec.service_store) = {label: ["contractfixtures"]};

  string entry_id = 1 [
    (spec.assert_required) = true,
    (spec.store_key) = true
  ];
  string value = 2;
}

message FixtureHealth {
  option (spec.service_health) = {};

  healthreport.ServiceInstanceHealth base = 1;
  int64 observed_events = 2;
}

message FixtureActor {
  option (spec.event_publish) = {
    topic_ref: "contractfixtures.FixtureState.events"
    method_s2s: {auth_services: ["*"]}
  };
  option (spec.event_watch) = {
    topic_ref: "contractfixtures.FixtureState.events"
    method_s2s: {auth_services: ["*"]}
  };
  // Auth-less publish binding to the synthesized record topic: the surface is
  // inherited from FixtureEvent's declared producer surface (s2s). Exercises the
  // event/record -> event_publish auth-fold.
  option (spec.event_publish) = {
    topic_ref: "contractfixtures.FixtureEventBus.stream"
  };
}

service FixtureTokenMint {
  option (spec.service_s2s) = {};
  option (spec.token_minter) = {};

  rpc TokenMint(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }

  rpc MintServiceToken(tokenrequest.MintServiceTokenRequest) returns (tokenrequest.TokenMintResponse) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }

  rpc X509Mint(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {
    option (spec.rpc) = {principal: RPC_PRINCIPAL_SERVICE, flags: [RPC_FLAG_SELF_AUTHENTICATES], auth_services: ["*"]};
  }
}
