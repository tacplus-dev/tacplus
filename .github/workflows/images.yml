name: Images

# The image set from docs/VERSIONING.md: base (every SDK) and build (base +
# every tool; the image the gates run in). Each layer is rebuilt only when its
# definition changed, on demand, or (base) weekly, and pushed to ghcr.io for
# linux/amd64 and linux/arm64. A release tag tags the build image with X.Y.Z,
# and X.Y, X when it is the newest release each covers (scripts/images-tags.sh).
# Releases are cut on several lines at once, so a run for an older line never
# moves base:latest or build:latest, and it builds from its own line's images,
# not whichever image another run last pushed (#160). There is no tacplus image
# any more (#932): the old tacplus/tacplus tags stay, deprecated, and are never
# pushed again.
#
# A release tag builds its build image fresh (apt-get upgrade), from its line's
# base:X.Y when there is one, so a patch takes every OS security fix. A run on a
# release/X.Y branch is a line rebuild (#283), dispatched weekly by main's
# Images workflow: base and build from this branch, pushed as base:X.Y and
# build:X.Y (and the dated tag) only, never latest, main, X or an X.Y.Z.

# Every run upgrades the OS packages (#369): APT_REFRESH, unique to the run,
# keeps the registry cache from handing back an older run's apt-get upgrade
# layer, and scripts/images-check-index.sh fails the run unless each base and
# build index it pushes holds linux/amd64 and linux/arm64, both created during
# the run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Lowest layer to rebuild (everything above it rebuilds too); a run on release/X.Y always rebuilds base and build, as that line's X.Y"
        type: choice
        options: [build, base]
        default: build

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  NS: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: Which layers
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
      build_image: ${{ steps.plan.outputs.build_image }}
      line: ${{ steps.plan.outputs.line }}
      base_image: ${{ steps.plan.outputs.base_image }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: a release tag diffs against the previous release tag.
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          # Every image this run pushes must be created after this (#369,
          # scripts/images-check-index.sh).
          started="$(date -u +%s)"
          plan="$(scripts/images-plan.sh "${{ github.event_name }}" "$GITHUB_REF_TYPE" "${{ github.event.inputs.rebuild }}" "$GITHUB_REF_NAME")"
          read -r base build <<<"$plan"
          # First publish: build everything when the build image does not exist yet.
          if ! docker manifest inspect "$NS/build:latest" >/dev/null 2>&1; then base=true; build=true; fi
          stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # The build image a release tags (build-tags): the one it builds, else
          # its release line's (build:X.Y), else (a line's first release)
          # build:latest.
          image="$NS/build:latest"
          if [[ $build == true ]]; then
            image="$NS/build:$stamp"
          elif [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            line="$NS/build:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if docker manifest inspect "$line" >/dev/null 2>&1; then image="$line"; fi
          fi
          # The release line of a tag or a line rebuild; none for main.
          line=""
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            line="${BASH_REMATCH[1]}"
          fi
          # The base a build starts from when this run does not rebuild base: its
          # line's base:X.Y (refreshed weekly by the line rebuild), else base:latest.
          base_image="$NS/base:latest"
          if [[ -n $line ]] && docker manifest inspect "$NS/base:$line" >/dev/null 2>&1; then base_image="$NS/base:$line"; fi
          { echo "base=$base"; echo "build=$build"; echo "stamp=$stamp"; echo "build_image=$image"; echo "line=$line"; echo "base_image=$base_image"; echo "started=$started"; } >> "$GITHUB_OUTPUT"
          echo "base=$base build=$build build_image=$image line=$line base_image=$base_image"
        env:
          DOCKER_CONFIG: /tmp/docker-anon

  base:
    name: base
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          list="$NS/base:${{ needs.plan.outputs.stamp }}"
          # base takes latest where build does (main, the newest release) and its
          # line's X.Y where build does (a line rebuild, the newest patch of a line).
          for t in $(scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA"); do
            case "$t" in
              main|latest) list+=",$NS/base:latest" ;;
              "${{ needs.plan.outputs.line }}") list+=",$NS/base:$t" ;;
            esac
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Unique to the run: every run upgrades the OS packages instead of
          # taking an older run's upgrade from the cache (#369).
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ env.NS }}/base:buildcache
          cache-to: type=registry,ref=${{ env.NS }}/base:buildcache,mode=max
      - name: Both platforms built by this run
        run: scripts/images-check-index.sh "$NS/base:${{ needs.plan.outputs.stamp }}" "${{ needs.plan.outputs.started }}"

  build:
    name: build (${{ matrix.arch }})
    needs: [plan, base]
    if: always() && needs.plan.outputs.build == 'true' && (needs.base.result == 'success' || needs.base.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.base.result == 'success' && format('{0}/base:{1}', env.NS, needs.plan.outputs.stamp) || needs.plan.outputs.base_image }}
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=image,name=${{ env.NS }}/build,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.NS }}/build:buildcache-${{ matrix.arch }},mode=max
      - name: Smoke test (this architecture)
        if: matrix.arch == 'amd64'
        run: docker run --rm "$NS/build@${{ steps.push.outputs.digest }}" tacplus-smoke
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  build-manifest:
    name: build (manifest)
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: build-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=(); for d in *; do refs+=("$NS/build@sha256:$d"); done
          tags=(-t "$NS/build:${{ needs.plan.outputs.stamp }}")
          git -C "$GITHUB_WORKSPACE" fetch --force --tags origin
          # main and the newest release move latest; a line rebuild moves its X.Y
          # and nothing else. A release's X.Y.Z, X.Y and X come in build-tags.
          for t in $(cd "$GITHUB_WORKSPACE" && scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA"); do
            case "$t" in
              main|latest) tags+=(-t "$NS/build:latest") ;;
              "${{ needs.plan.outputs.line }}") [[ "$GITHUB_REF_TYPE" == branch ]] && tags+=(-t "$NS/build:$t") ;;
            esac
          done
          # The dated tag first, and the other tags only once its index holds
          # both platforms, each built by this run (#369): v2.6.2 published
          # v2.6.1's arm64 image, which the cache handed back.
          docker buildx imagetools create -t "$NS/build:${{ needs.plan.outputs.stamp }}" "${refs[@]}"
          "$GITHUB_WORKSPACE/scripts/images-check-index.sh" "$NS/build:${{ needs.plan.outputs.stamp }}" "${{ needs.plan.outputs.started }}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$NS/build:${{ needs.plan.outputs.stamp }}"

  # There is no tacplus image any more (#932): ghcr.io/.../tacplus is
  # deprecated, its tags stay as they are and it is never pushed again
  # (docs/VERSIONING.md). A release still tags the build image it was produced
  # with by the version policy, so consumers (the looper image, CI jobs,
  # release.yml) pin build:X.Y and float on the patch like everything else; a
  # dated build tag is a patch pin and the policy forbids those.
  build-tags:
    name: build (release tags)
    needs: [plan, base, build, build-manifest]
    if: always() && github.ref_type == 'tag' && needs.plan.result == 'success' && (needs.base.result == 'success' || needs.base.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-manifest.result == 'success' || needs.build-manifest.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image tags from the version policy
        run: |
          set -euo pipefail
          # Fetched again here, not in plan: parallel tags on one line (v2.3.1 and
          # v2.3.2) must see each other before either moves a floating tag.
          git fetch --force --tags origin
          list="$(scripts/images-tags.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "$list"
          # latest is build-manifest's (main and the newest release).
          tags=(); for t in $list; do [[ $t == latest ]] || tags+=(-t "$NS/build:$t"); done
          docker buildx imagetools create "${tags[@]}" "${{ needs.plan.outputs.build_image }}"
          docker buildx imagetools inspect "$NS/build:${GITHUB_REF_NAME#v}"
